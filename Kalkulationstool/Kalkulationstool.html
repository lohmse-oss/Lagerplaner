<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulationstool V2.0</title>
<style>
/* ============================ Grundlagen ============================ */
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --side:#0f172a; --acc:#2563eb; --amber:#f59e0b; --red:#dc2626; --teal:#0f766e;
  font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);font-size:13px}
body{display:flex;flex-direction:column;min-height:100vh}
table{border-collapse:collapse;width:100%}
th{background:#f8fafc;text-align:left;font-size:10.5px;color:var(--mut);padding:4px 5px;border:1px solid var(--line)}
td{border:1px solid var(--line);padding:1px 2px;line-height:1.25}
td.calc{background:#f8fafc;text-align:right;font-size:11.5px;padding:2px 5px;white-space:nowrap}
tr:hover td{background:#f8fafc}
.hint{font-size:11px;color:#64748b;line-height:1.45}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Knöpfe: primär (.acc), sekundär (.btn), Werkzeug (.btn-quiet) */
.btn{background:#fff;color:#1e293b;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:500}
.btn:hover{background:#f1f5f9;border-color:#94a3b8}
.btn:disabled{opacity:.45;cursor:default;background:#fff;border-color:#cbd5e1}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn.danger{color:#b91c1c;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#f87171}
.btn.btn-quiet{background:transparent;color:#334155;border-color:transparent}
.btn.btn-quiet:hover{background:#e2e8f0;border-color:transparent}
.btn:focus-visible,#tabs button:focus-visible,.dd-list button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.tt{position:relative;display:inline-block;margin-left:7px;color:var(--acc);font-weight:700;cursor:help;font-size:13px;line-height:1;vertical-align:baseline}
.tt::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 7px);background:#0f172a;color:#e2e8f0;padding:9px 11px;border-radius:8px;font-size:11.5px;font-weight:400;line-height:1.55;width:min(440px,70vw);white-space:normal;text-align:left;display:none;z-index:80;box-shadow:0 10px 28px rgba(15,23,42,.3);pointer-events:none}
/* Ausgeblendete Tooltips dürfen die Seitenbreite nicht vergrößern */
.tt:hover::after,.tt:focus-visible::after{display:block}
/* Kopfzeile */
header{background:var(--side);color:#fff;padding:10px 16px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(15,23,42,.18)}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em;white-space:nowrap}
header h1 .v{color:var(--amber);font-weight:600;margin-left:4px}
header .proj{color:#cbd5e1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
header .btn{background:#1e293b;color:#e2e8f0;border-color:#334155}
header .btn:hover{background:#334155}
header .btn:disabled{background:#1e293b;border-color:#334155}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.dd{position:relative}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:90;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.2);padding:6px;min-width:280px}
.dd.open .dd-menu{display:block}
.dd-list button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;font-size:12.5px;color:var(--ink);cursor:pointer}
.dd-list button:hover{background:#f1f5f9}
.dd-sep{height:1px;background:var(--line);margin:5px 2px}
/* Register */
#tabs{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
#tabs button{border:1px solid #99f6e4;border-bottom:none;background:#f0fdfa;color:#115e59;border-radius:9px 9px 0 0;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
#tabs button[aria-selected="true"]{background:var(--card);color:var(--teal);border-color:#0d9488;box-shadow:inset 0 -3px 0 currentColor}
main{flex:1;padding:12px 14px 24px;min-width:0}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
footer{font-size:11px;color:#94a3b8;background:var(--side);padding:6px 16px;text-align:center}
.toast{position:fixed;right:18px;bottom:18px;z-index:95;background:var(--card);border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.25);padding:11px 15px;font-size:12px;color:var(--ink);max-width:430px;cursor:pointer;white-space:pre-line}
@media(max-width:760px){
  header{padding:8px 12px}
  .hdr-actions{margin-left:0}
  .dd-menu{right:auto;left:0}
  main{padding:10px 10px 20px}
  #tabs{padding:8px 10px 0}
}
@media print{header,#tabs,footer,.rowbtns{display:none!important}}
/* ============================ Kalkulation ============================ */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:0 12px;align-items:start}
.calc-grid-wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.calc-grid>*{min-width:0}
.calc-scroll{position:relative;overflow-x:auto;max-width:100%;min-width:0}
.calc-tab{font-size:12px;margin:2px 0 6px}
.calc-tab th{text-transform:none;letter-spacing:0;font-size:11px;white-space:normal;vertical-align:bottom}
.calc-tab th small{font-weight:400}
.calc-tab th.r{text-align:right}
.calc-tab td{padding:2px 5px;height:28px}
.calc-tab td.cn{width:30px;text-align:center;color:var(--mut)}
.calc-tab td.cact,.calc-tab th.cact{white-space:nowrap;width:1%}
.calc-tab td.cin{padding:2px 3px;background:#fffbeb}
.calc-tab tfoot td{font-weight:700;background:#f1f5f9}
.calc-tab tr.hl>*{background:#e0e7ff;font-weight:700}
.calc-tab tr.top>*{background:#c7d2fe;font-weight:700}
.calc-tab tr.sub>th{font-weight:400;padding-left:18px}
.calc-kv tbody th{text-align:left;font-weight:400;color:#334155;font-size:12px;background:#fff;white-space:normal}
.calc-kv td{width:160px}
.calc-head th{background:#f8fafc;width:auto}
.calc-head td{min-width:90px}
td input.ci,input.ci{width:100%;min-width:72px;height:24px;background:#fefce8;border:1px solid #fde68a;border-radius:4px;padding:2px 6px;font-size:12px;color:var(--ink)}
input.ci.num{text-align:right}
input.ci.ci-name{min-width:170px}
input.ci:focus,td input.ci:focus{outline:none;border-color:var(--acc);background:#fff}
input.ci.bad{border-color:var(--red);background:#fef2f2}
.btn.ca{padding:1px 6px;min-width:24px;font-size:12px}
.calc-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 12px;margin-bottom:6px}
.calc-form .mf{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut)}
.calc-form .mf.wide{grid-column:1/-1}
input.ci:disabled{background:#f3f3f3;border-color:var(--line);color:var(--mut)}
input.ci::placeholder{color:#a8a29e}
.calc-form textarea{width:100%;font:12px/1.4 inherit;border:1px solid #fde68a;background:#fefce8;border-radius:6px;padding:4px 6px;resize:vertical}
.calc-form .cout{display:block;height:24px;line-height:22px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:#f3f3f3;color:var(--ink);font-size:12px;text-align:right}
.calc-check{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:4px}
.calc-check input{width:16px;height:16px;accent-color:var(--acc)}
.calc-warn{margin:0}
.co.warnline{display:block;color:#b45309;white-space:pre-line;font-size:12px}
.co.warnline:not(:empty){margin:4px 0 8px;padding:6px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px}
.calc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}
.calc-kpi{border:1px solid #c7d2fe;border-radius:8px;padding:8px 10px;background:#eef2ff;font-size:11.5px;color:#3730a3}
.calc-kpi .kv{display:block;font-size:17px;font-weight:700;color:var(--ink);margin-top:2px}
.calc-det{margin:6px 0}
.calc-det>summary{cursor:pointer;font-size:12px;font-weight:600;color:#334155;padding:4px 0}
.calc-steps{margin:4px 0 8px;padding-left:20px;font-size:12px;line-height:1.5}
.calc-legend{font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.calc-legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.calc-legend .sw-in{background:#fefce8;border-color:#fde68a}.calc-legend .sw-out{background:#f3f3f3}.calc-legend .sw-hl{background:#e0e7ff}
.calc-link{font-weight:600;color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Kalkulationstool<span class="v" id="app-ver">V2.0</span></h1>
  <span class="proj" id="hdr-proj">Neue Kalkulation</span>
  <div class="hdr-actions">
    <button type="button" class="btn" id="btn-undo" disabled title="Rückgängig">Rückgängig</button>
    <div class="dd" id="dd-file">
      <button type="button" class="btn" id="btn-dd-file" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-file">Datei ▾</button>
      <div class="dd-menu dd-list" id="menu-file" role="menu" aria-label="Datei">
        <button type="button" role="menuitem" id="btn-new">Neue Kalkulation</button>
        <button type="button" role="menuitem" id="btn-open">Kalkulation öffnen …</button>
        <button type="button" role="menuitem" id="btn-save">Kalkulation speichern</button>
        <div class="dd-sep" role="separator"></div>
        <button type="button" role="menuitem" id="btn-open-lp">Projektdaten aus Lagerplaner-Planungsdatei …</button>
      </div>
    </div>
    <input type="file" id="file-in" accept=".json,application/json" aria-label="Kalkulationsdatei auswählen" hidden>
    <input type="file" id="file-lp" accept=".json,application/json" aria-label="Lagerplaner-Planungsdatei auswählen" hidden>
  </div>
</header>
<nav id="tabs" role="tablist" aria-label="Register">
  <button type="button" role="tab" id="tab-projekt" data-tab="projekt" aria-controls="panel-projekt">Projekt &amp; Basisdaten</button>
  <button type="button" role="tab" id="tab-personal" data-tab="personal" aria-controls="panel-personal">Personalkosten</button>
  <button type="button" role="tab" id="tab-sachkosten" data-tab="sachkosten" aria-controls="panel-sachkosten">Sachkosten</button>
  <button type="button" role="tab" id="tab-summary" data-tab="summary" aria-controls="panel-summary">Summary</button>
  <button type="button" role="tab" id="tab-oto" data-tab="oto" aria-controls="panel-oto">OtO-Werte</button>
</nav>
<main id="panels">
  <div class="panel" id="panel-projekt" role="tabpanel" aria-labelledby="tab-projekt"><div id="calc-panel-projekt"></div></div>
  <div class="panel" id="panel-personal" role="tabpanel" aria-labelledby="tab-personal"><div id="calc-panel-personal"></div></div>
  <div class="panel" id="panel-sachkosten" role="tabpanel" aria-labelledby="tab-sachkosten"><div id="calc-panel-sachkosten"></div></div>
  <div class="panel" id="panel-summary" role="tabpanel" aria-labelledby="tab-summary"><div id="calc-panel-summary"></div></div>
  <div class="panel" id="panel-oto" role="tabpanel" aria-labelledby="tab-oto"><div id="calc-panel-oto"></div></div>
  <div id="calc-datalists" hidden></div>
</main>
<footer id="app-footer">Kalkulationstool V2.0 · Nachbau des Kalkulationstools Light V1.0 · läuft lokal im Browser, keine Serververbindung · Ergebnisse vom Anwender auf Plausibilität zu prüfen</footer>
<script>
"use strict";
/* ============================ Hilfsfunktionen ============================ */
const APP_VERSION="V2.0";
const LS_KEY="kalkulationstool-state";
const $=id=>document.getElementById(id);
const fmt=(n,d)=>{d=(d===undefined)?0:d;return (isFinite(n)?n:0).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});};
const getP=(o,p)=>p.split(".").reduce((a,k)=>(a==null?undefined:a[k]),o);
const setP=(o,p,v)=>{const ks=p.split("."),last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v;};
function escH(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
const tipHtml=t=>t?' <span class="tt" data-tip="'+escH(t)+'" tabindex="0">ⓘ</span>':'';
function fmtDate(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  return m?m[3]+"."+m[2]+"."+m[1]:String(iso||"");
}
const DANGEROUS_KEYS=new Set(["__proto__","prototype","constructor"]);
function isPlainObject(v){
  if(v===null||typeof v!=="object"||Array.isArray(v))return false;
  const proto=Object.getPrototypeOf(v);
  return proto===Object.prototype||proto===null;
}
function cloneSafeValue(v,depth){
  if(depth>40)throw new Error("Datei zu tief verschachtelt.");
  if(Array.isArray(v))return v.map(x=>cloneSafeValue(x,depth+1));
  if(isPlainObject(v))return deepMerge({},v,depth+1);
  if(v===null||typeof v==="string"||typeof v==="boolean"||(typeof v==="number"&&Number.isFinite(v)))return v;
  return null;
}
function deepMerge(base,ext,depth){
  depth=depth||0;
  if(ext==null||!isPlainObject(base)||!isPlainObject(ext))return base;
  if(depth>40)throw new Error("Datei zu tief verschachtelt.");
  for(const k of Object.keys(ext)){
    if(DANGEROUS_KEYS.has(k))continue;
    const value=ext[k];
    if(Array.isArray(value))base[k]=value.map(x=>cloneSafeValue(x,depth+1));
    else if(isPlainObject(value)){if(!isPlainObject(base[k]))base[k]={};deepMerge(base[k],value,depth+1);}
    else if(value===null||typeof value==="string"||typeof value==="boolean"||(typeof value==="number"&&Number.isFinite(value)))base[k]=value;
  }
  return base;
}
function assertSafeImportTree(value,depth){
  if(depth>40)throw new Error("Datei zu tief verschachtelt.");
  if(typeof value==="string"&&value.length>1000000)throw new Error("Ein Textfeld ist größer als 1 MB.");
  if(Array.isArray(value)){
    if(value.length>20000)throw new Error("Die Datei enthält mehr als 20.000 Einträge in einer Liste.");
    for(const item of value)assertSafeImportTree(item,depth+1);
  }else if(isPlainObject(value)){
    for(const key of Object.keys(value)){
      if(DANGEROUS_KEYS.has(key))throw new Error("Unzulässiger Objektschlüssel: "+key);
      assertSafeImportTree(value[key],depth+1);
    }
  }
}
const describeRepairs=fixed=>fixed.map(x=>"· "+x.label+": "+x.from+" → "+x.to).join("\n");
function showNotice(text,ms){
  const el=document.createElement("div");
  el.className="toast";el.setAttribute("role","status");el.textContent=text;el.title="Klicken zum Schließen";
  el.addEventListener("click",()=>el.remove());
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),ms||15000);
  return el;
}
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function openPrintWindow(title,inner){
  const w=window.open("","_blank");
  if(!w){alert("Das Druckfenster wurde blockiert. Bitte Popups für diese lokale Datei zulassen und erneut öffnen.");return;}
  const css='body{font:12px Arial,Helvetica,sans-serif;color:#111827;margin:24px}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:16px 0 6px;border-bottom:1px solid #cbd5e1;padding-bottom:4px;page-break-after:avoid}table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:11.5px}tr{page-break-inside:avoid}td,th{border:1px solid #cbd5e1;padding:5px 7px;text-align:left}th{background:#f1f5f9}td.calc{text-align:right}tr.hl>*,tr.top>*{font-weight:700;background:#eef2ff}.calc-kpis{display:flex;gap:10px;margin:8px 0}.calc-kpi{border:1px solid #cbd5e1;padding:6px 10px}.calc-kpi .kv{display:block;font-size:15px;font-weight:700}.foot{color:#64748b;font-size:10.5px;margin-top:16px}@media print{button{display:none}}';
  w.document.open();
  w.document.write('<!doctype html><html lang="de"><head><meta charset="utf-8"><title>'+escH(title)+'</title><style>'+css+'</style></head><body><h1>'+escH(title)+'</h1>'+inner+'<button onclick="window.print()">Drucken / als PDF speichern</button><div class="foot">Kalkulationstool '+APP_VERSION+' · Alle Eingaben und Ergebnisse sind vom Anwender eigenverantwortlich auf Richtigkeit und Plausibilität zu prüfen.</div></body></html>');
  w.document.close();
}

/* ============================ Kalkulation ============================ */
/* Nachbau des Kalkulationstools Light V1.0 (Excel): Personal- und Sachkosten, Zuschläge im Hundert, Summary und OtO-Werte.
   Projektkopf in S.meta (Name, Kunde) und S.request (Standort, Kontakt, SOP/EOP …); Prozentwerte in Prozent gespeichert.
   excelMode rechnet wie die Excel-Vorlage (Monatsanteile gerundet, höchstens 10 Kalenderjahre, Gross Profit auf den
   Angebotsumsatz, Wechselkurs ohne Wirkung); sonst gelten die Korrekturen. */
const CALC_TABS=["projekt","personal","sachkosten","summary","oto"];
const CALC_MAX_ROWS=500;
const CALC_LIST_MAX=50;
const CALC_BASE_FIELDS={profit:[0,90],risk:[0,90],hv:[0,90],bu:[0,90],nl:[0,90],negotiation:[0,90],raise:[-20,50],
  weekendDays:[0,200],holidays:[0,60],vacation:[0,100],sick:[0,200],otherOff:[0,200],hoursWage:[0.5,24],hoursSalary:[0.5,24],
  salBonus:[0,300],salOther:[0,300],wageBonus:[0,300],wageOther:[0,300],salSpecial:[0,300],wageSpecial:[0,300],costRaise:[-20,50],interest:[0,30]};
const CALC_PERSON_FIELDS=[["name","text"],["fte","num",0,100000],["rate","num",0,100000000],["gross","pct",0,500]];
const CALC_COST_FIELDS=[["name","text"],["qty","num",0,10000000],["price","num",-10000000000,10000000000]];
const CALC_LISTS={
  salaries:{path:"calc.salaries",label:"Gehälter",fields:CALC_PERSON_FIELDS},
  wages:{path:"calc.wages",label:"Löhne",fields:CALC_PERSON_FIELDS},
  capex:{path:"calc.capex",label:"Investitionen",fields:CALC_COST_FIELDS},
  opex:{path:"calc.opex",label:"Betriebskosten",fields:CALC_COST_FIELDS},
  nu:{path:"calc.nu",label:"Nachunternehmerleistung",fields:CALC_COST_FIELDS},
  rampup:{path:"calc.rampup",label:"Ramp-up",fields:CALC_COST_FIELDS},
  sv:{path:"calc.base.sv",label:"SV-Anteile",fields:[["name","text"],["pct","pct",0,100],["bbg","num",0,10000000]]}
};
const CALC_CHOICES={serviceLines:"Service-Lines",status:"Angebotsstatus",billing:"Abrechnungsarten"};
const CALC_OTO_TEXT=["date","status","offerNo","currency","billing","link"];
function calcDefaults(){
  return {
    calcDate:"",excelMode:false,
    base:{profit:6,risk:2,hv:5,bu:2.5,nl:2.5,negotiation:8,raise:2.5,weekendDays:89.4,holidays:10.4,vacation:30,sick:10,otherOff:0,hoursWage:8,hoursSalary:7.55,
      salBonus:0,salOther:0,wageBonus:4,wageOther:0,salSpecial:25,wageSpecial:25,costRaise:0,interest:0,
      // Beitragsbemessungsgrenzen 2026 je Jahr (KV/PV 5.812,50 €, RV/AV 8.450 € im Monat); jährlich prüfen
      sv:[["Krankenversicherung (AG-Anteil)",8.75,69750],["Rentenversicherung (AG-Anteil)",9.3,101400],["Arbeitslosenversicherung (AG-Anteil)",1.3,101400],["Pflegeversicherung (AG-Anteil)",1.8,69750],
        ["Umlage U2 (Mutterschutz)",0.56,0],["Insolvenzgeldumlage",0.15,0],["Gesetzliche Unfallversicherung (BG)",1,0],["Schwerbehindertenabgabe",1,0]].map(([name,pct,bbg])=>({name,pct,bbg}))},
    salaries:[],wages:[],capex:[],opex:[],nu:[],rampup:[],
    oto:{date:"",status:"Angebot",offerNo:"",currency:"EUR",rate:1,billing:"",link:""},
    lists:{serviceLines:["TFM","IFM","LOG","PEM","TC"],status:["Angebot","Auftrag","Korrekturangebot"],billing:["Aufwand","Gem. Preisliste","Zahlungsplan","Monatspauschale","Stückpreis"]}
  };
}
function calcNewRow(key){
  const row={};
  for(const [f,type] of CALC_LISTS[key].fields)row[f]=type==="text"?"":0;
  // Sachkosten: neue Zeilen mit Menge 1
  if("qty" in row)row.qty=1;
  return row;
}
/* Beispiel der Excel-Vorlage (Test-VZ); dient zum Abgleich mit der Excel */
function calcExample(){
  const c=calcDefaults();
  const person=(name,fte,rate,gross)=>({name,fte,rate,gross});

/* ---- Prüfung und Reparatur beim Import ---- */
function validateCalc(c,label){
  if(c==null)return;
  if(!isPlainObject(c))throw new Error(label+" muss ein Objekt sein.");
  const allowed=new Set(Object.keys(calcDefaults()));
  for(const k of Object.keys(c))if(!allowed.has(k))throw new Error(label+": unbekanntes Feld "+k+".");
  const isDate=v=>typeof v==="string"&&(v===""||/^\d{4}-\d{2}-\d{2}$/.test(v));
  const isNum=v=>typeof v==="number"&&Number.isFinite(v);
  if(c.calcDate!=null&&!isDate(c.calcDate))throw new Error(label+".calcDate muss ein Datum (JJJJ-MM-TT) sein.");
  if(c.excelMode!=null&&typeof c.excelMode!=="boolean")throw new Error(label+".excelMode muss wahr oder falsch sein.");
  const checkList=(key,list,where)=>{
    if(list==null)return;
    if(!Array.isArray(list)||list.length>CALC_MAX_ROWS)throw new Error(where+" muss eine Liste mit höchstens "+CALC_MAX_ROWS+" Zeilen sein.");
    const fields=new Map(CALC_LISTS[key].fields.map(f=>[f[0],f[1]]));
    list.forEach((row,i)=>{
      if(!isPlainObject(row))throw new Error(where+", Zeile "+(i+1)+" ist ungültig.");
      for(const [f,v] of Object.entries(row)){
        if(!fields.has(f))throw new Error(where+", Zeile "+(i+1)+": unbekanntes Feld "+f+".");
        if(fields.get(f)==="text"?(typeof v!=="string"||v.length>200):!isNum(v))throw new Error(where+", Zeile "+(i+1)+": "+f+" ist ungültig.");
      }
    });
  };
  if(c.base!=null){
    if(!isPlainObject(c.base))throw new Error(label+".base muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.base)){
      if(k==="sv")checkList("sv",v,label+".base.sv");
      else if(!CALC_BASE_FIELDS[k])throw new Error(label+".base: unbekanntes Feld "+k+".");
      else if(!isNum(v))throw new Error(label+".base."+k+" muss eine Zahl sein.");
    }
  }
  for(const key of ["salaries","wages","capex","opex","nu","rampup"])checkList(key,c[key],label+"."+key);
  if(c.oto!=null){
    if(!isPlainObject(c.oto))throw new Error(label+".oto muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.oto)){
      if(k==="rate"){if(!isNum(v)||v<=0||v>1000000)throw new Error(label+".oto.rate muss eine positive Zahl sein.");}
      else if(!CALC_OTO_TEXT.includes(k))throw new Error(label+".oto: unbekanntes Feld "+k+".");
      else if(typeof v!=="string"||v.length>(k==="link"?1000:200))throw new Error(label+".oto."+k+" ist ungültig.");
    }
    if(c.oto.date!=null&&!isDate(c.oto.date))throw new Error(label+".oto.date muss ein Datum (JJJJ-MM-TT) sein.");
    if(c.oto.link&&!/^https?:\/\//i.test(c.oto.link))throw new Error(label+".oto.link muss mit http:// oder https:// beginnen.");
  }
  if(c.lists!=null){
    if(!isPlainObject(c.lists))throw new Error(label+".lists muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.lists)){
      if(!CALC_CHOICES[k])throw new Error(label+".lists: unbekannte Auswahlliste "+k+".");
      if(!Array.isArray(v)||v.length>CALC_LIST_MAX||v.some(x=>typeof x!=="string"||x.length>100))throw new Error(label+".lists."+k+" muss eine Liste mit höchstens "+CALC_LIST_MAX+" Einträgen sein.");
    }
  }
}

function normalizeCalc(state){
  const fixed=[];
  const c=state.calc=deepMerge(calcDefaults(),state.calc||{});
  const clampField=(obj,f,min,max,label)=>{
    const v=Number(obj[f]);
    if(!Number.isFinite(v)){obj[f]=0;return;}
    const n=Math.min(max,Math.max(min,v));
    if(n!==v){fixed.push({label,from:fmt(v,2),to:fmt(n,2)});obj[f]=n;}
  };
  for(const [k,[min,max]] of Object.entries(CALC_BASE_FIELDS))clampField(c.base,k,min,max,"Kalkulation · Basisdaten "+k);
  for(const key of Object.keys(CALC_LISTS)){
    const list=getP(state,CALC_LISTS[key].path);
    const rows=(Array.isArray(list)?list:[]).slice(0,CALC_MAX_ROWS).map(row=>Object.assign(calcNewRow(key),isPlainObject(row)?row:{}));
    rows.forEach((row,i)=>{for(const [f,type,min,max] of CALC_LISTS[key].fields)if(type!=="text")clampField(row,f,min,max,"Kalkulation · "+CALC_LISTS[key].label+" Zeile "+(i+1));});
    setP(state,CALC_LISTS[key].path,rows);

/* ---- Rechenkern ---- */
const CALC_DAY_MS=86400000;
function calcParseDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
  if(!m)return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  return d.getUTCMonth()===+m[2]-1?d:null;
}
const calcDayDiff=(a,b)=>Math.round((b-a)/CALC_DAY_MS);
// DATEDIF(a;b;"M"): volle Monate
function calcFullMonths(a,b){
  let m=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();
  if(b.getUTCDate()<a.getUTCDate())m--;
  return Math.max(0,m);
}
/* Laufzeit und Monatsanteile je Kalenderjahr. Excel: erstes Jahr auf 0,1 Monat abgerundet, letztes aufgerundet,
   Schaltjahr = durch 4 teilbar, höchstens 10 Jahre, Personaldauer = abgerundete Summe. Korrigiert: tagesgenau je Monat. */
function calcPeriod(c,req){
  const start=calcParseDate(req.sop),end=calcParseDate(req.eop);
  const y0=start?start.getUTCFullYear():0;
  const P={ok:false,years:[],months:[],monthsTotal:0,monthsPersonnel:0,daysYear:start?calcDayDiff(Date.UTC(y0,0,1),Date.UTC(y0+1,0,1)):365,warn:[]};
  if(!start||!end){P.warn.push("Start und Ende der Leistung eingeben (Register Projekt & Basisdaten).");return P;}
  if(end<start){P.warn.push("Das Leistungsende liegt vor dem Start.");return P;}
  const y1=end.getUTCFullYear();
  if(y1-y0>=60){P.warn.push("Laufzeiten über 60 Jahre werden nicht berechnet.");return P;}
  if(c.excelMode){
    const total=calcFullMonths(start,new Date(end.getTime()+CALC_DAY_MS));
    const dy=y=>y%4===0?366:365;
    for(let y=y0;P.years.length<10;y++){
      let m;
      if(y0===y1)m=total;
      else if(y===y0)m=Math.floor((calcDayDiff(start,Date.UTC(y,11,31))+1)/dy(y)*120+1e-9)/10;
      else if(y!==y1)m=12;
      else m=Math.ceil((calcDayDiff(Date.UTC(y,0,1),end)+1)/dy(y)*120-1e-9)/10;
      P.years.push(y);P.months.push(m);
      if(y>=y1)break;
    }
    if(y1-y0+1>10)P.warn.push("Excel-kompatibel: Die Personalkosten berücksichtigen nur die ersten 10 Kalenderjahre.");
    P.monthsTotal=total;
    P.monthsPersonnel=Math.floor(P.months.reduce((a,b)=>a+b,0)+1e-9);
  }else{
    for(let y=y0;y<=y1;y++){
      let m=0;
      for(let mo=0;mo<12;mo++){
        const ms=Date.UTC(y,mo,1),me=Date.UTC(y,mo+1,0),a=Math.max(ms,start.getTime()),b=Math.min(me,end.getTime());
        if(b>=a)m+=(calcDayDiff(a,b)+1)/(calcDayDiff(ms,me)+1);
      }
      P.years.push(y);P.months.push(m);
    }
    P.monthsTotal=P.monthsPersonnel=P.months.reduce((a,b)=>a+b,0);
  }
  P.ok=P.monthsTotal>0;
  if(!P.ok)P.warn.push("Die Laufzeit ist kürzer als ein Monat.");
  return P;
}
function calcNum(v,min,max){const n=Number(v);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):0;}
function computeCalc(state){
  const c=state.calc||calcDefaults(),req=state.request||{},b=c.base||{};
  const g=k=>calcNum(b[k],CALC_BASE_FIELDS[k][0],CALC_BASE_FIELDS[k][1]),pct=k=>g(k)/100;
  const P=calcPeriod(c,req),warn=P.warn.slice(),excel=!!c.excelMode;
  const gew=pct("profit"),ris=pct("risk"),hv=pct("hv"),bu=pct("bu"),nl=pct("nl"),verh=pct("negotiation"),raise=pct("raise");
  const umlg=hv+bu+nl,den=1-umlg-gew-ris;
  if(den<=0.0001)warn.push("Umlagen, Gewinn und Risiko ergeben zusammen 100 % oder mehr; die Zuschläge im Hundert sind nicht berechenbar.");
  if(verh>=0.9)warn.push("Die Verhandlungsmarge ist zu hoch.");
  const inH=x=>den>0.0001?x/den:0,withVerh=x=>verh<0.9?x/(1-verh):0;
  // Ø produktive Jahresstunden
  const grossDays=P.daysYear-g("weekendDays")-g("holidays");
  const presence=grossDays-g("vacation")-g("sick")-g("otherOff");
  if(presence<=0)warn.push("Keine Anwesenheitstage: Abwesenheiten prüfen.");
  const hWage=Math.max(0,presence*g("hoursWage")),hSal=Math.max(0,presence*g("hoursSalary"));
  const soz=presence>0?(g("holidays")+g("vacation")+g("sick")+g("otherOff"))/presence:0;
  const svRows=(Array.isArray(b.sv)?b.sv:[]).map(x=>({p:calcNum(x&&x.pct,0,100)/100,cap:excel?0:calcNum(x&&x.bbg,0,1e7)}));
  const sv=svRows.reduce((a,x)=>a+x.p,0);
  // SV-Anteil je Stunde; Sätze mit Beitragsbemessungsgrenze nur bis zur Grenze des Jahresentgelts je FTE
  const svOn=(T,hours)=>{const ann=T*hours;return T*svRows.reduce((a,x)=>a+x.p*(x.cap>0&&ann>x.cap?x.cap/ann:1),0);};
  const weights=P.months.map(m=>m/12),wSum=weights.reduce((a,x)=>a+x,0);
  const durP=P.monthsPersonnel/12,durT=P.monthsTotal/12;
  // Personalkosten: Zuschlagskette 100 … 700 je Qualifikation
  function person(list,isWage){
    const zus=isWage?soz+pct("wageBonus")+pct("wageOther"):pct("salBonus")+pct("salOther");
    const special=isWage?pct("wageSpecial"):pct("salSpecial"),hours=isWage?hWage:hSal;
    const rows=(Array.isArray(list)?list:[]).map(row=>{
      const fte=calcNum(row.fte,0,1e5),rate=calcNum(row.rate,0,1e8),gross=calcNum(row.gross,0,500)/100;
      const yearly=weights.map((w,i)=>rate*Math.pow(1+raise,i));
      let avg=wSum>0?yearly.reduce((a,s,i)=>a+s*weights[i],0)/wSum:rate;
      const R=isWage?avg:(hSal>0?avg/hSal:0);
      const Sz=R*zus,T=R+Sz,U=svOn(T,hours),V=T+U,W=inH(V)*umlg,X=V+W,Y=inH(V)*(gew+ris),Z=X+Y,AB=withVerh(Z),AA=AB-Z,AC=AB*special,AD=AB+AC;
      const F=fte*(1+gross),AF=hours*F,AG=AF*V,AH=AG*durP;
      return {name:String(row.name||""),fte,rate,gross,yearly,R,Sz,T,U,V,W,X,Y,Z,AA,AB,AC,AD,F,AF,AG,AH,svEff:T>0?U/T:0};
    });
    const sum=k=>rows.reduce((a,x)=>a+x[k],0);
    // Zuschlagsfaktoren je produktiver Stunde (Kalkulationsschema, Basis 1)
    const f={R:1,Sz:zus};f.T=1+zus;f.U=f.T*sv;f.V=f.T+f.U;f.W=inH(f.V)*umlg;f.X=f.V+f.W;f.Y=inH(f.V)*(gew+ris);f.Z=f.X+f.Y;f.AB=withVerh(f.Z);f.AA=f.AB-f.Z;f.AC=f.AB*special;f.AD=f.AB+f.AC;
    return {rows,fte:sum("fte"),F:sum("F"),AF:sum("AF"),AG:sum("AG"),AH:sum("AH"),hours,zus,special,factors:f};
  }
  const sal=person(c.salaries,false),wage=person(c.wages,true);
  // Sachkosten
  // Korrigiert: Betriebskosten und Nachunternehmer mit Steigerung je Kalenderjahr (Ø-Faktor wie bei den Personalkosten),
  // Einmalkosten mit Kalkulationszins als Annuität über die Laufzeit
  const mT=P.monthsTotal,costRaise=excel?0:pct("costRaise"),interest=excel?0:pct("interest");
  const esc=wSum>0?weights.reduce((a,w,i)=>a+w*Math.pow(1+costRaise,i),0)/wSum:1;
  const annuity=interest>0&&durT>0?interest/(1-Math.pow(1+interest,-durT)):0;
  const once=list=>(Array.isArray(list)?list:[]).map(x=>{
    const q=calcNum(x.qty,0,1e7),p=calcNum(x.price,-1e10,1e10),nominal=q*p;
    const pa=annuity?nominal*annuity:(mT>0?nominal/mT*12:0);
    return {q,p,nominal,pa,lz:annuity?pa*durT:nominal};
  });
  const yearly=(list,perYear)=>(Array.isArray(list)?list:[]).map(x=>{const q=calcNum(x.qty,0,1e7),p=calcNum(x.price,-1e10,1e10),pa=q*p*perYear*esc;return {q,p,pa,lz:pa*durT};});
  const tot=rows=>({pa:rows.reduce((a,x)=>a+x.pa,0),lz:rows.reduce((a,x)=>a+x.lz,0),nominal:rows.reduce((a,x)=>a+(x.nominal||0),0)});
  const capex=once(c.capex),opex=yearly(c.opex,12),nu=yearly(c.nu,1),ramp=once(c.rampup);
  const cost={capex:{rows:capex,...tot(capex)},opex:{rows:opex,...tot(opex)},nu:{rows:nu,...tot(nu)},rampup:{rows:ramp,...tot(ramp)}};
  // Summary: Zuschläge im Hundert auf die Projektkosten
  const hoursAll=sal.AF+wage.AF;
  const groups=[
    {key:"sal",label:"I-1. Personalkosten Gehälter",pa:sal.AG,lz:sal.AG*durT,hours:sal.AF},
    {key:"wage",label:"I-2. Personalkosten Löhne",pa:wage.AG,lz:wage.AG*durT,hours:wage.AF},
    {key:"capex",label:"II-1. Investitionen/Einmalkosten",pa:cost.capex.pa,lz:cost.capex.lz,hours:hoursAll},
    {key:"opex",label:"II-2. Monatliche Betriebskosten/Verbräuche",pa:cost.opex.pa,lz:cost.opex.lz,hours:hoursAll},
    {key:"nu",label:"II-3. Nachunternehmerleistung",pa:cost.nu.pa,lz:cost.nu.lz,hours:hoursAll},
    {key:"rampup",label:"II-4. Ramp-up-Kosten",pa:cost.rampup.pa,lz:cost.rampup.lz,hours:hoursAll}
  ];
  const level=k=>{
    const K=groups.reduce((a,x)=>a+x[k],0),base=inH(K);
    const um=base*umlg,sk=K+um,ge=base*gew,ri=base*ris,uov=sk+ge+ri,ve=verh<0.9?verh*base/(1-verh):0;
    return {K,um,sk,ge,ri,uov,ve,umv:uov+ve,base};
  };
  const sum={pa:level("pa"),lz:level("lz")};
  // OtO-Werte; korrigiert: HV+BU als Anteil am Umsatz ohne Verhandlung, Wechselkurs angewendet
  const fx=excel?1:(Number(c.oto&&c.oto.rate)>0?Number(c.oto.rate):1);
  const s=sum.pa,hvbu=hv+bu;
  const oto=(to,ebita)=>{
    const gp=excel?(to?(ebita/to+hvbu)*to:0):ebita+s.base*hvbu;
    return {to:to*fx,ebita:ebita*fx,gp:gp*fx,ebitaPct:to?ebita/to:0,gpPct:to?gp/to:0};
  };
  const offer=oto(s.umv,s.ge+s.ve),walk=oto(s.uov,s.ge);

  return {period:P,warn,excel,rates:{gew,ris,hv,bu,nl,umlg,verh,raise,den,hvbu,costRaise,interest,esc,annuity},
    days:{grossDays,presence,hWage,hSal,soz,sv,grossSuggest:presence>0?grossDays/presence-1:0},
    sal,wage,cost,groups,sum,hoursAll,fteNet,fteGross:sal.F+wage.F,perFte:fteNet>0?s.umv/fteNet:0,
    oto:{offer,walk,invest:cost.capex.nominal*fx,leasing:cost.opex.pa*fx,fx,currency:(c.oto&&c.oto.currency)||"EUR"}};
}

  return '<div class="calc-scroll"><table class="calc-tab" data-cl="'+key+'"><thead>'+head+'</thead><tbody>'+body+'</tbody>'+tf+'</table></div>'+
    '<div class="rowbtns"><button type="button" class="btn" data-calc-act="add" data-cl="'+key+'">+ Zeile</button>'+(o.extra||'')+'</div>';
}
const calcCard=(title,tip,inner,id)=>'<div class="card"'+(id?' id="'+id+'"':'')+'><h3>'+escH(title)+(tip?tipHtml(tip):'')+'</h3>'+inner+'</div>';
const calcWarnHtml=r=>'<p class="calc-warn">'+co(r.warn.join("\n"),"warnline")+'</p>';
function calcKvTable(rows){

}

      ["Ø Anwesenheitstage FTE pro Jahr",tdo(fmt(d.presence,1)),"hl"],

  const pnk=calcCard("Personalnebenkosten","Diese Sätze beruhen auf dem deutschen Sozialversicherungssystem. Für andere Länder oder zur Vereinfachung die Einzelsätze auf 0 setzen und einen Gesamtwert über die sonstigen Zuschläge oder eine eigene SV-Zeile abbilden. Der Zuschlag für Sondertätigkeiten wird separat aufgeschlagen, sodass Sätze mit und ohne Zuschlag sichtbar sind.",

  const costPar=calcCard("Sachkosten","Steigerung je Kalenderjahr ab dem zweiten Jahr der Laufzeit, gewichtet wie bei den Personalkosten. Der Kalkulationszins verteilt Investitionen und Ramp-up als Annuität (Tilgung und Zins) auf die Laufzeit statt linear. Beide wirken nicht im Excel-kompatiblen Modus.",

/* Register Personalkosten */
const CALC_CHAIN=[["100","Ø Stundensatz Laufzeit","R"],["101/102","Zuschläge (Soziallohn, Prämien)","Sz"],["200","Brutto-Arbeitnehmerlohn","T"],["201","SV-Anteil Arbeitgeber","U"],
  ["300","Kalkulatorischer Satz","V"],["301","Verwaltungsgemeinkosten (HV/BU/NL)","W"],["400","Selbstkosten-Stundenverrechnungssatz","X"],["401/402","Gewinn und Risiko","Y"],
  ["500","VK-Stundensatz ohne Verhandlung","Z"],["501","Verhandlung","AA"],["600","Mitarbeiterverkaufsstundensatz","AB"],["601","Zuschlag Sondertätigkeiten","AC"],["700","VK-Stundensatz Sondertätigkeiten","AD"]];
function calcPersonHtml(r,isWage){
  const key=isWage?"wages":"salaries",res=isWage?r.wage:r.sal,P=r.period;
  const title=isWage?"I-2. Personalkosten Löhne":"I-1. Personalkosten Gehälter";
  const rows=res.rows,e2=n=>calcEur(n,2);
  const table=calcListHtml(key,[
    {h:"Qualifikation",f:"name"},{h:"Ø-FTE/Tag netto",f:"fte",num:true},
    {h:isWage?"Tarifl. Grundlohn Jahr 1 [€/h]":"Jahresgehalt Jahr 1 [€]",f:"rate",num:true},
    {h:"FTE-Brutto-Zuschlag [%]",f:"gross",num:true,tip:"Mehrbedarf für Abwesenheiten, damit die Netto-FTE täglich anwesend sind. Vorschlag aus den Basisdaten: "+calcPct(r.days.grossSuggest)+"."},
    {h:"Brutto-FTE",out:i=>fmt(rows[i].F,2),num:true},{h:"Ø Satz [€/h]",out:i=>e2(rows[i].R),num:true,tip:"Position 100: mit der Personalkostensteigerung über die Kalenderjahre gewichtet"+(isWage?".":", je produktiver Stunde.")},
    {h:"Kalk. Satz [€/h]",out:i=>e2(rows[i].V),num:true,tip:"Position 300: inklusive Zuschlägen und SV-Anteil Arbeitgeber; Grundlage der Kosten."},
    {h:"VK-Satz [€/h]",out:i=>e2(rows[i].AB),num:true,tip:"Position 600: Mitarbeiterverkaufsstundensatz inklusive Umlagen, Gewinn, Risiko und Verhandlung."},
    {h:"Prod. Std./Jahr",out:i=>fmt(rows[i].AF,1),num:true},{h:"Kosten p.a.",out:i=>calcEur(rows[i].AG),num:true},{h:"Kosten Laufzeit",out:i=>calcEur(rows[i].AH),num:true}
  ],[null,fmt(res.fte,2),null,null,fmt(res.F,2),null,null,null,fmt(res.AF,1),calcEur(res.AG),calcEur(res.AH)],
    {extra:'<button type="button" class="btn" id="calc-gross-'+key+'"'+(rows.length&&r.days.grossSuggest>0?'':' disabled')+' title="Setzt den FTE-Brutto-Zuschlag aller Zeilen auf Bruttoarbeitstage ÷ Anwesenheitstage − 1 aus den Basisdaten.">FTE-Brutto-Zuschlag aus Basisdaten ('+co(calcPct(r.days.grossSuggest))+')</button>'});
  const chain='<details class="calc-det"><summary>Stundensätze je Qualifikation (Zuschlagskette)</summary><div class="calc-scroll"><table class="calc-tab"><thead><tr><th>Qualifikation</th>'+
    CALC_CHAIN.map(([nr,label])=>'<th class="r" title="'+escH(label)+'">'+nr+'<br><small>'+escH(label)+'</small></th>').join("")+'<th class="r">SV wirksam</th></tr></thead><tbody>'+
    (rows.map(x=>'<tr><td>'+escH(x.name||"–")+'</td>'+CALC_CHAIN.map(([,,k])=>tdo(e2(x[k]))).join("")+tdo(calcPct(x.svEff))+'</tr>').join("")||'<tr><td colspan="'+(CALC_CHAIN.length+2)+'" class="hint">Keine Einträge.</td></tr>')+
    '</tbody></table></div></details>';
  const years='<details class="calc-det"><summary>'+(isWage?"Lohn":"Gehalt")+'entwicklung je Kalenderjahr</summary><div class="calc-scroll"><table class="calc-tab"><thead><tr><th>Qualifikation</th>'+
    P.years.map(y=>'<th class="r">'+y+'</th>').join("")+'</tr><tr class="hl"><td>Monatsanteil</td>'+P.months.map(m=>tdo(fmt(m,m%1?2:0)+" Mon.")).join("")+'</tr></thead><tbody>'+
    (rows.map(x=>'<tr><td>'+escH(x.name||"–")+'</td>'+x.yearly.map(v=>tdo(isWage?e2(v):calcEur(v))).join("")+'</tr>').join("")||'<tr><td colspan="'+(P.years.length+1)+'" class="hint">Keine Einträge.</td></tr>')+
    '</tbody></table></div><p class="hint">Laufzeit Personal: '+co(fmt(P.monthsPersonnel,P.monthsPersonnel%1?2:0))+' Monate · produktive Stunden je FTE: '+co(fmt(res.hours,2))+' h/Jahr</p></details>';
  return calcCard(title,isWage?"Eingabe des tariflichen Grundlohns je Stunde im Startjahr. Soziallöhne, Prämien und Zuschläge kommen aus den Basisdaten.":"Eingabe des Jahresgehalts im Startjahr. Der Satz je produktiver Stunde ergibt sich aus den produktiven Jahresstunden Gehalt.",
    table+chain+years,"calc-card-"+key);
}
function calcPersonnelHtml(r){

    '<div class="calc-scroll"><table class="calc-tab"><thead><tr><th>Nr</th><th>Bezeichnung</th><th class="r">Faktor Gehalt</th><th class="r">Faktor Lohn</th></tr></thead><tbody>'+

function refreshCalcOutputs(){

let CALC_PERSIST_TIMER=null;

function calcSharedChanged(path){

// Feldwert lesen und speichern; liefert false bei ungültiger Zahl
function calcStoreField(el){
  const path=el.dataset.cf,type=el.dataset.ct;
  let v;
  if(type==="check")v=el.checked;
  else if(type==="text"||type==="date"){
    v=String(el.value).slice(0,el.maxLength>0?el.maxLength:200);
    if(type==="date"&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
  }else{
    const n=calcParse(el.value);
    if(Number.isNaN(n)){el.classList.add("bad");return false;}
    el.classList.remove("bad");
    const min=el.dataset.min!==undefined?Number(el.dataset.min):-Infinity,max=el.dataset.max!==undefined?Number(el.dataset.max):Infinity;
    v=n===null?(path==="calc.oto.rate"?1:0):Math.min(max,Math.max(min,n));
    if(n!==null&&v!==n)el.dataset.clamped=fmt(v,v%1?2:0);else delete el.dataset.clamped;
  }
  if(path.startsWith("request.")){
    S.request=S.request||{texts:{},skip:[]};
    const k=path.slice(8),t=String(v).trim();
    if(t)S.request[k]=t;else delete S.request[k];
  }else if(path.startsWith("meta.")){S.meta[path.slice(5)]=v;}
  else setP(S,path,v);
  calcSharedChanged(path);
  return true;
}

}
function calcFieldChange(ev){
  const el=ev.target;
  if(el.dataset&&el.dataset.calcChoices){
    const k=el.dataset.calcChoices,seen=new Set();
    S.calc.lists[k]=String(el.value).split(/\r?\n/).map(x=>x.trim().slice(0,100)).filter(x=>x&&!seen.has(x)&&seen.add(x)).slice(0,CALC_LIST_MAX);
    calcDatalists();persistState();
    return;
  }
  if(el.dataset&&el.dataset.calcDuration){
    const n=calcParse(el.value),start=calcParseDate(S.request&&S.request.sop);
    if(!start||n===null||Number.isNaN(n)||n<1||n>720||n%1){el.classList.add("bad");return;}
    el.classList.remove("bad");
    // Gleicher Monatstag n Monate später, minus ein Tag; fehlt der Tag im Zielmonat, endet die Leistung am Monatsletzten
    const y=start.getUTCFullYear(),m=start.getUTCMonth()+n,d=start.getUTCDate();
    const last=new Date(Date.UTC(y,m+1,0)).getUTCDate(),end=new Date(d>last?Date.UTC(y,m,last):Date.UTC(y,m,d)-CALC_DAY_MS);
    S.request.eop=end.toISOString().slice(0,10);
    calcSharedChanged("request.eop");persistState();
    setTimeout(()=>{for(const k of CALC_TABS)STALE_PANELS.add(k);renderVisiblePanels();},0);
    return;
  }
  if(!el.dataset||!el.dataset.cf)return;
  if(!calcStoreField(el))return;
  const type=el.dataset.ct;
  if(type==="num"||type==="pct"){
    const v=getP(S,el.dataset.cf);if(Number.isFinite(v)&&!el.classList.contains("bad"))el.value=calcFmtIn(v);
    if(el.dataset.clamped){showNotice("Wert auf den zulässigen Bereich begrenzt: "+el.dataset.clamped+(type==="pct"?" %":"")+" ("+(el.getAttribute("aria-label")||"Feld")+").",5000);delete el.dataset.clamped;}
  }
  persistState();
  // Neuaufbau nach dem Rückgängig-Schritt der Feldänderung (document-Listener läuft danach)
  if(type==="date"||type==="check"||el.dataset.cf==="calc.oto.link")setTimeout(()=>{for(const n of CALC_TABS)STALE_PANELS.add(n);renderVisiblePanels();},0);
  else refreshCalcOutputs();
}
/* Zellbereich aus Excel einfügen: Tabulator trennt Spalten, Zeilenumbruch Zeilen; fehlende Zeilen werden angelegt */
function calcPaste(ev){
  const el=ev.target;
  if(!el.dataset||el.dataset.cl===undefined||!el.dataset.cf)return;
  const text=(ev.clipboardData&&ev.clipboardData.getData("text/plain"))||"";
  const lines=text.replace(/\r/g,"").replace(/\n+$/,"").split("\n");
  if(lines.length<2&&!/\t/.test(text))return;
  ev.preventDefault();
  const key=el.dataset.cl,def=CALC_LISTS[key],i0=+el.dataset.ci,c0=+el.dataset.cc;
  const list=calcList(key),rowsNeeded=Math.min(CALC_MAX_ROWS,i0+lines.length);
  pushUndo("Einfügen in "+def.label);
  while(list.length<rowsNeeded)list.push(calcNewRow(key));
  let bad=0;
  lines.forEach((line,r)=>{
    const row=list[i0+r];if(!row)return;
    line.split("\t").forEach((cell,k)=>{
      const fd=def.fields[c0+k];if(!fd)return;
      if(fd[1]==="text"){row[fd[0]]=cell.trim().slice(0,200);return;}
      const n=calcParse(cell);
      if(n===null)row[fd[0]]=0;else if(Number.isNaN(n))bad++;else row[fd[0]]=Math.min(fd[3],Math.max(fd[2],n));
    });
  });
  for(const n of CALC_TABS)STALE_PANELS.add(n);
  renderVisiblePanels();persistState();
  showNotice(lines.length+(lines.length===1?" Zeile":" Zeilen")+" in "+def.label+" eingefügt"+(bad?"; "+bad+" Werte waren keine Zahl und wurden übersprungen.":"."),5000);
}
function calcRowAction(btn){
  const act=btn.dataset.calcAct,key=btn.dataset.cl,def=CALC_LISTS[key],list=calcList(key),i=+btn.dataset.ci;
  if(act==="add"){
    if(list.length>=CALC_MAX_ROWS){alert("Höchstens "+CALC_MAX_ROWS+" Zeilen je Liste.");return;}
    pushUndo("Zeile angelegt ("+def.label+")");list.push(calcNewRow(key));
  }else if(act==="del"){pushUndo("Zeile gelöscht ("+def.label+")");list.splice(i,1);}
  else if(act==="dup"){
    if(list.length>=CALC_MAX_ROWS){alert("Höchstens "+CALC_MAX_ROWS+" Zeilen je Liste.");return;}
    pushUndo("Zeile dupliziert ("+def.label+")");list.splice(i+1,0,Object.assign({},list[i]));
  }else if(act==="up"||act==="down"){
    const j=act==="up"?i-1:i+1;if(j<0||j>=list.length)return;
    pushUndo("Zeile verschoben ("+def.label+")");[list[i],list[j]]=[list[j],list[i]];
  }
  setP(S,def.path,list);
  for(const n of CALC_TABS)STALE_PANELS.add(n);
  renderVisiblePanels();persistState();
  // Neue Zeile: Fokus ins erste Feld
  if(act==="add"||act==="dup"){
    const row=act==="add"?list.length-1:i+1;
    const f=document.querySelector('[data-cl="'+key+'"][data-ci="'+row+'"][data-cc="0"]');if(f)f.focus();
  }
}

/* Tastatur in Listentabellen wie in Excel: Enter und Pfeil ab in die nächste Zeile (Enter in der letzten legt eine an), Pfeil auf zurück */
function calcKeydown(ev){
  const el=ev.target;
  if(!el.dataset||el.dataset.cl===undefined||!el.dataset.cf||ev.altKey||ev.ctrlKey||ev.metaKey)return;
  const down=ev.key==="Enter"&&!ev.shiftKey||ev.key==="ArrowDown",up=ev.key==="ArrowUp"||ev.key==="Enter"&&ev.shiftKey;
  if(!down&&!up)return;
  const key=el.dataset.cl,i=+el.dataset.ci,cc=el.dataset.cc,n=calcList(key).length;
  const target=up?i-1:i+1;
  if(target<0)return;
  ev.preventDefault();
  // Wie in Excel: Zielzelle markiert, Eingabe überschreibt
  const focusRow=r=>{const f=document.querySelector('[data-cl="'+key+'"][data-ci="'+r+'"][data-cc="'+cc+'"]');if(f){f.focus();try{f.select();}catch(e){}}};
  if(target<n){focusRow(target);return;}
  if(ev.key!=="Enter"||n>=CALC_MAX_ROWS)return;
  el.blur(); // übernimmt den Wert (change) vor dem Neuaufbau
  pushUndo("Zeile angelegt ("+CALC_LISTS[key].label+")");
  calcList(key).push(calcNewRow(key));
  for(const k of CALC_TABS)STALE_PANELS.add(k);
  renderVisiblePanels();persistState();focusRow(target);
}

  const text=calcOtoText(computeCalc(S));
  const fallback=()=>{
    const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();
    showNotice(ok?"OtO-Werte in die Zwischenablage kopiert (Bezeichnung und Wert, durch Tabulator getrennt).":"Kopieren nicht möglich. Bitte die Werte im Druckfenster markieren und kopieren.",5000);
  };
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>showNotice("OtO-Werte in die Zwischenablage kopiert (Bezeichnung und Wert, durch Tabulator getrennt).",5000),fallback);
  else fallback();
}
function calcPrint(which){
  const r=computeCalc(S),name=S.meta.name||"Projekt";
  if(which==="oto"){
    const rows=calcOtoRows(r),tab=(t,list)=>'<h2>'+escH(t)+'</h2><table>'+list.map(([l,v])=>'<tr><th>'+escH(l)+'</th><td>'+escH(v)+'</td></tr>').join("")+'</table>';
    openPrintWindow("OtO-Werte – "+name,tab("Opportunity Informationen I",rows.info)+tab("OtO-Werte Angebot",rows.values)+tab("Opportunity Informationen II",rows.walk));
    return;
  }
  const t=calcSummaryTables(r);
  openPrintWindow("Summary Kalkulation – "+name,t.head+t.rates+'<h2>Kosten und Umsatz</h2>'+t.main+'<h2>Personaleinsatz</h2>'+t.fte+'<h2>OtO-Werte</h2>'+t.oto+(r.warn.length?'<p><b>Hinweise:</b> '+escH(r.warn.join(" "))+'</p>':''));
}
function initCalc(){
  const host=$("panels");
  host.addEventListener("input",calcFieldInput);
  host.addEventListener("change",calcFieldChange);
  host.addEventListener("paste",calcPaste);
  host.addEventListener("keydown",calcKeydown);
  // Zahlenfelder: Klick in ein nicht fokussiertes Feld markiert den Inhalt, Eingabe überschreibt wie in Excel
  // (beim Tabulator markiert der Browser selbst)
  const isNumField=el=>el&&el.dataset&&(el.dataset.ct==="num"||el.dataset.ct==="pct"||el.dataset.calcDuration);
  let selectOnUp=null;
  host.addEventListener("mousedown",ev=>{selectOnUp=isNumField(ev.target)&&document.activeElement!==ev.target?ev.target:null;});
  host.addEventListener("mouseup",ev=>{
    if(selectOnUp&&ev.target===selectOnUp&&selectOnUp.selectionStart===selectOnUp.selectionEnd){ev.preventDefault();selectOnUp.select();}
    selectOnUp=null;
  });
  host.addEventListener("click",ev=>{
    const t=ev.target.closest&&ev.target.closest("button");
    if(!t||!host.contains(t))return;
    if(t.dataset.calcAct)calcRowAction(t);
    else if(t.id==="calc-example")calcLoadExample();
    else if(t.id==="calc-reset")calcResetAll();
    else if(t.id==="calc-gross-salaries"||t.id==="calc-gross-wages")calcApplyGrossSuggestion(t.id.slice(11));
    else if(t.id==="calc-oto-copy")calcCopyOto();
    else if(t.id==="calc-print-summary")calcPrint("summary");
    else if(t.id==="calc-print-oto")calcPrint("oto");
  });
  calcDatalists();
}

/* ============================ Zustand, Speicher, Rückgängig ============================ */
// Projektkopf: Felder mit denselben Schlüsseln wie die Projekt- und Anfragedaten des Lagerplaners
const CALC_REQUEST_FIELDS={serviceSite:"text",contact:"text",businessUnit:"text",serviceLine:"text",sop:"date",eop:"date",calculator:"text",sfId:"text"};
function defaults(){
  return {schemaVersion:1,tool:"Kalkulationstool",toolVersion:APP_VERSION,meta:{name:"",kunde:""},request:{},calc:calcDefaults()};
}
let S=defaults();
function validateRequestFields(req,label){
  if(req==null)return;
  if(!isPlainObject(req))throw new Error(label+" muss ein Objekt sein.");
  for(const [k,v] of Object.entries(req)){
    if(!CALC_REQUEST_FIELDS[k])throw new Error(label+": unbekanntes Feld "+k+".");
    if(typeof v!=="string"||v.length>200)throw new Error(label+"."+k+" muss Text mit höchstens 200 Zeichen sein.");
    if(CALC_REQUEST_FIELDS[k]==="date"&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))throw new Error(label+"."+k+" muss ein Datum (JJJJ-MM-TT) sein.");
  }
}
function validateFile(obj){
  if(!isPlainObject(obj))throw new Error("Die Datei muss ein JSON-Objekt enthalten.");
  assertSafeImportTree(obj,0);
  const allowed=new Set(Object.keys(defaults()));
  for(const k of Object.keys(obj))if(!allowed.has(k))throw new Error("Unbekanntes Feld "+k+". Ist das eine Kalkulationsdatei?");
  if(obj.meta!=null){
    if(!isPlainObject(obj.meta))throw new Error("meta muss ein Objekt sein.");
    for(const [k,v] of Object.entries(obj.meta))if(!["name","kunde"].includes(k)||typeof v!=="string"||v.length>200)throw new Error("meta."+k+" ist ungültig.");
  }
  for(const k of ["tool","toolVersion"])if(obj[k]!=null&&(typeof obj[k]!=="string"||obj[k].length>50))throw new Error(k+" ist ungültig.");
  validateRequestFields(obj.request,"Projektdaten");
  validateCalc(obj.calc,"Kalkulation");
  return obj;
}
// Datei oder Browserstand übernehmen; liefert die Reparaturen
function stateFrom(obj){
  const next=deepMerge(defaults(),obj);
  next.request=Object.assign({},obj.request||{});
  return {next,fixed:normalizeCalc(next)};
}
function persistState(){
  try{S.toolVersion=APP_VERSION;localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}
  catch(e){console.warn("Kalkulation konnte nicht im Browser gespeichert werden:",e);return false;}
}
const UNDO=[],UNDO_MAX=30;
function pushUndo(label){
  try{UNDO.push({label,state:JSON.parse(JSON.stringify(S))});}catch(e){return;}
  if(UNDO.length>UNDO_MAX)UNDO.shift();
  updateUndoBtn();
}
function updateUndoBtn(){
  const b=$("btn-undo");
  b.disabled=!UNDO.length;
  b.title=UNDO.length?"Rückgängig: "+UNDO[UNDO.length-1].label:"Rückgängig";
}
function undoLast(){
  const u=UNDO.pop();if(!u)return;
  S=u.state;
  refreshAll();persistState();updateUndoBtn();
}
// Feldänderungen: Stand beim Betreten merken, beim Verlassen mit geändertem Wert als Rückgängig-Schritt ablegen
let UNDO_FOCUS_SNAP=null,UNDO_FOCUS_LABEL="",UNDO_FOCUS_EL=null;
function bindFieldUndoTracking(){
  document.addEventListener("focusin",e=>{
    const t=e.target;
    if(!t||!t.matches||!t.matches("input,select,textarea")||!t.closest("#panels"))return;
    try{UNDO_FOCUS_SNAP=JSON.stringify(S);}catch(err){UNDO_FOCUS_SNAP=null;return;}
    UNDO_FOCUS_LABEL="Feldänderung ("+(t.getAttribute("aria-label")||"Feld")+")";
    UNDO_FOCUS_EL=t;
  });
  document.addEventListener("change",e=>{
    const t=e.target;
    if(!t||!t.matches||!t.matches("input,select,textarea"))return;
    if(t!==UNDO_FOCUS_EL&&!t.closest("#panels"))return;
    if(UNDO_FOCUS_SNAP===null)return;
    let now=null;
    try{now=JSON.stringify(S);}catch(err){}
    if(now!==null&&now!==UNDO_FOCUS_SNAP){
      try{UNDO.push({label:UNDO_FOCUS_LABEL,state:JSON.parse(UNDO_FOCUS_SNAP)});if(UNDO.length>UNDO_MAX)UNDO.shift();updateUndoBtn();}catch(err){}
      UNDO_FOCUS_SNAP=now;
    }
  });
}

/* ============================ Register ============================ */
const STALE_PANELS=new Set();
function renderVisiblePanels(){
  for(const n of [...STALE_PANELS]){
    const panel=$("panel-"+n);
    if(!panel||!panel.classList.contains("on"))continue;
    STALE_PANELS.delete(n);
    renderCalcPanel(n);
  }
}
function refreshAll(){
  for(const n of CALC_TABS)STALE_PANELS.add(n);
  renderVisiblePanels();updateHeader();
}
function updateHeader(){
  const m=S.meta||{},t=[m.name,m.kunde].filter(Boolean).join(" · ");
  $("hdr-proj").textContent=t||"Neue Kalkulation";
  document.title=(m.name?m.name+" · ":"")+"Kalkulationstool "+APP_VERSION;
}
function showTab(n){
  if(!CALC_TABS.includes(n))return;
  for(const b of document.querySelectorAll("#tabs [data-tab]")){
    const on=b.dataset.tab===n;
    b.setAttribute("aria-selected",on?"true":"false");b.tabIndex=on?0:-1;
  }
  for(const k of CALC_TABS)$("panel-"+k).classList.toggle("on",k===n);
  STALE_PANELS.add(n);renderVisiblePanels();
}
function initTabs(){
  const nav=$("tabs");
  nav.addEventListener("click",ev=>{const b=ev.target.closest("[data-tab]");if(b)showTab(b.dataset.tab);});
  nav.addEventListener("keydown",ev=>{
    if(!["ArrowLeft","ArrowRight","Home","End"].includes(ev.key))return;
    const tabs=[...nav.querySelectorAll("[data-tab]")],i=tabs.indexOf(document.activeElement);if(i<0)return;
    ev.preventDefault();
    const j=ev.key==="Home"?0:ev.key==="End"?tabs.length-1:(i+(ev.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;
    showTab(tabs[j].dataset.tab);tabs[j].focus();
  });
}

/* ============================ Datei ============================ */
function saveFile(){
  S.toolVersion=APP_VERSION;
  const name=(S.meta.name||"kalkulation").replace(/[^\w\-äöüÄÖÜß]+/g,"_");
  downloadBlob(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),name+"_kalkulation.json");
  showNotice("Kalkulation als Datei gespeichert. Der Stand bleibt zusätzlich im Browser dieses Geräts erhalten.",5000);
}
function hasContent(){
  const c=S.calc||{};
  return ["salaries","wages","capex","opex","nu","rampup"].some(k=>(c[k]||[]).length)||!!(S.meta.name||S.meta.kunde);
}
function loadText(txt){
  try{
    if(typeof txt!=="string"||txt.length>10000000)throw new Error("Datei ist größer als 10 MB oder kein Text.");
    let obj;
    try{obj=JSON.parse(txt);}catch(e){throw new Error("Die Datei ist kein gültiges JSON.");}
    if(isPlainObject(obj)&&(Array.isArray(obj.items)||Array.isArray(obj.positionen)))throw new Error("Das ist eine Lagerplaner-Planungsdatei. Projektdaten daraus übernehmen Sie über Datei › Projektdaten aus Lagerplaner-Planungsdatei.");
    validateFile(obj);
    if(hasContent()&&!confirm("Aktuelle Kalkulation durch die Datei ersetzen?"))return false;
    const {next,fixed}=stateFrom(obj);
    pushUndo("Kalkulation geöffnet");
    S=next;refreshAll();persistState();
    if(fixed.length)showNotice("Kalkulation geöffnet: "+fixed.length+(fixed.length===1?" Wert lag":" Werte lagen")+" außerhalb des zulässigen Bereichs und wurde"+(fixed.length===1?"":"n")+" angepasst.\n"+describeRepairs(fixed));
    return true;
  }catch(e){alert("Datei wurde nicht übernommen: "+e.message);return false;}
}
// Brücke zum Lagerplaner: nur Projektname, Kunde und die Projekt- und Anfragedaten
function loadLagerplanerText(txt){
  try{
    let obj;
    try{obj=JSON.parse(txt);}catch(e){throw new Error("Die Datei ist kein gültiges JSON.");}
    if(!isPlainObject(obj)||!isPlainObject(obj.meta))throw new Error("Keine Lagerplaner-Planungsdatei (Projektdaten fehlen).");
    assertSafeImportTree(obj,0);
    const req=isPlainObject(obj.request)?obj.request:{},take={};
    for(const [k,type] of Object.entries(CALC_REQUEST_FIELDS)){
      const v=req[k];
      if(typeof v==="string"&&v.length<=200&&(type!=="date"||/^\d{4}-\d{2}-\d{2}$/.test(v)))take[k]=v;
    }
    const name=typeof obj.meta.name==="string"?obj.meta.name.slice(0,200):"",kunde=typeof obj.meta.kunde==="string"?obj.meta.kunde.slice(0,200):"";
    pushUndo("Projektdaten aus Lagerplaner übernommen");
    if(name)S.meta.name=name;
    if(kunde)S.meta.kunde=kunde;
    Object.assign(S.request,take);
    refreshAll();persistState();
    showNotice("Projektdaten übernommen: "+[name&&"Projektname",kunde&&"Kunde",...Object.keys(take)].filter(Boolean).length+" Felder. Personal- und Sachkosten bleiben unverändert.",6000);
    return true;
  }catch(e){alert("Projektdaten wurden nicht übernommen: "+e.message);return false;}
}
function newCalc(){
  if(hasContent()&&!confirm("Neue Kalkulation beginnen? Der aktuelle Stand wird ersetzt (Rückgängig bleibt möglich)."))return;
  pushUndo("Neue Kalkulation");
  S=defaults();refreshAll();persistState();
}
function initFileMenu(){
  const dd=$("dd-file"),btn=$("btn-dd-file");
  const close=()=>{dd.classList.remove("open");btn.setAttribute("aria-expanded","false");};
  btn.addEventListener("click",()=>{const open=!dd.classList.contains("open");dd.classList.toggle("open",open);btn.setAttribute("aria-expanded",String(open));if(open)$("btn-new").focus();});
  document.addEventListener("click",ev=>{if(!dd.contains(ev.target))close();});
  dd.addEventListener("keydown",ev=>{
    if(ev.key==="Escape"){close();btn.focus();return;}
    if(ev.key!=="ArrowDown"&&ev.key!=="ArrowUp")return;
    const items=[...dd.querySelectorAll("[role=menuitem]")],i=items.indexOf(document.activeElement);
    ev.preventDefault();items[(i+(ev.key==="ArrowDown"?1:-1)+items.length)%items.length].focus();
  });
  const pick=(input,fn)=>input.addEventListener("change",()=>{
    const f=input.files&&input.files[0];input.value="";if(!f)return;
    const rd=new FileReader();rd.onload=()=>fn(String(rd.result));rd.readAsText(f);
  });
  $("btn-new").addEventListener("click",()=>{close();newCalc();});
  $("btn-open").addEventListener("click",()=>{close();$("file-in").click();});
  $("btn-save").addEventListener("click",()=>{close();saveFile();});
  $("btn-open-lp").addEventListener("click",()=>{close();$("file-lp").click();});
  pick($("file-in"),loadText);pick($("file-lp"),loadLagerplanerText);
  $("btn-undo").addEventListener("click",undoLast);
  document.addEventListener("keydown",ev=>{
    if((ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&ev.key.toLowerCase()==="z"&&!(ev.target&&ev.target.matches&&ev.target.matches("input,textarea"))){ev.preventDefault();undoLast();}
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="s"){ev.preventDefault();saveFile();}
  });
}

/* ============================ Start ============================ */
(function init(){
  $("app-ver").textContent=APP_VERSION;
  let saved=null;
  try{saved=localStorage.getItem(LS_KEY);}catch(e){}
  if(saved!==null){
    try{
      const obj=validateFile(JSON.parse(saved));
      const {next,fixed}=stateFrom(obj);S=next;
      if(fixed.length)showNotice("Gespeicherter Stand: "+fixed.length+" Werte angepasst.\n"+describeRepairs(fixed));
    }catch(e){
      try{localStorage.setItem(LS_KEY+"-backup",saved);}catch(e2){}
      console.warn("Gespeicherter Stand nicht ladbar; Sicherungskopie unter "+LS_KEY+"-backup.",e);
    }
  }
  initTabs();initFileMenu();initCalc();bindFieldUndoTracking();
  updateHeader();updateUndoBtn();
  showTab("projekt");
})();
</script>
