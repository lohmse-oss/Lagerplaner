<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulationstool V2.2</title>
<style>
/* ============================ Grundlagen ============================ */
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --side:#0f172a; --acc:#2563eb; --amber:#f59e0b; --red:#dc2626; --teal:#0f766e;
  font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);font-size:13px}
body{display:flex;flex-direction:column;min-height:100vh}
table{border-collapse:collapse;width:100%}
th{background:#f8fafc;text-align:left;font-size:10.5px;color:var(--mut);padding:4px 5px;border:1px solid var(--line)}
td{border:1px solid var(--line);padding:1px 2px;line-height:1.25}
td.calc{background:#f8fafc;text-align:right;font-size:11.5px;padding:2px 5px;white-space:nowrap}
tr:hover td{background:#f8fafc}
.hint{font-size:11px;color:#64748b;line-height:1.45}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Knöpfe: primär (.acc), sekundär (.btn), Werkzeug (.btn-quiet) */
.btn{background:#fff;color:#1e293b;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:500}
.btn:hover{background:#f1f5f9;border-color:#94a3b8}
.btn:disabled{opacity:.45;cursor:default;background:#fff;border-color:#cbd5e1}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn.danger{color:#b91c1c;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#f87171}
.btn.btn-quiet{background:transparent;color:#334155;border-color:transparent}
.btn.btn-quiet:hover{background:#e2e8f0;border-color:transparent}
.btn:focus-visible,#tabs button:focus-visible,.dd-list button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.tt{position:relative;display:inline-block;margin-left:7px;color:var(--acc);font-weight:700;cursor:help;font-size:13px;line-height:1;vertical-align:baseline}
.tt::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 7px);background:#0f172a;color:#e2e8f0;padding:9px 11px;border-radius:8px;font-size:11.5px;font-weight:400;line-height:1.55;width:min(440px,70vw);white-space:normal;text-align:left;display:none;z-index:80;box-shadow:0 10px 28px rgba(15,23,42,.3);pointer-events:none}
/* Ausgeblendete Tooltips dürfen die Seitenbreite nicht vergrößern */
.tt:hover::after,.tt:focus-visible::after{display:block}
/* Kopfzeile */
header{background:var(--side);color:#fff;padding:10px 16px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(15,23,42,.18)}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em;white-space:nowrap}
header h1 .v{color:var(--amber);font-weight:600;margin-left:4px}
header .proj{color:#cbd5e1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
header .btn{background:#1e293b;color:#e2e8f0;border-color:#334155}
header .btn:hover{background:#334155}
header .btn:disabled{background:#1e293b;border-color:#334155}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.dd{position:relative}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:90;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.2);padding:6px;min-width:280px}
.dd.open .dd-menu{display:block}
.dd-list button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;font-size:12.5px;color:var(--ink);cursor:pointer}
.dd-list button:hover{background:#f1f5f9}
.dd-sep{height:1px;background:var(--line);margin:5px 2px}
/* Register */
#tabs{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
#tabs button{border:1px solid #99f6e4;border-bottom:none;background:#f0fdfa;color:#115e59;border-radius:9px 9px 0 0;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
#tabs button[aria-selected="true"]{background:var(--card);color:var(--teal);border-color:#0d9488;box-shadow:inset 0 -3px 0 currentColor}
main{flex:1;padding:12px 14px 24px;min-width:0}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
footer{font-size:11px;color:#94a3b8;background:var(--side);padding:6px 16px;text-align:center}
.toast{position:fixed;right:18px;bottom:18px;z-index:95;background:var(--card);border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.25);padding:11px 15px;font-size:12px;color:var(--ink);max-width:430px;cursor:pointer;white-space:pre-line}
@media(max-width:760px){
  header{padding:8px 12px}
  .hdr-actions{margin-left:0}
  .dd-menu{right:auto;left:0}
  main{padding:10px 10px 20px}
  #tabs{padding:8px 10px 0}
}
@media print{header,#tabs,footer,.rowbtns{display:none!important}}
/* ============================ Kalkulation ============================ */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:0 12px;align-items:start}
.calc-grid-wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.calc-grid>*{min-width:0}
.calc-scroll{position:relative;overflow-x:auto;max-width:100%;min-width:0}
.calc-tab{font-size:12px;margin:2px 0 6px}
.calc-tab th{text-transform:none;letter-spacing:0;font-size:11px;white-space:normal;vertical-align:bottom}
.calc-tab th small{font-weight:400}
.calc-tab th.r{text-align:right}
.calc-tab td{padding:2px 5px;height:28px}
.calc-tab td.cn{width:30px;text-align:center;color:var(--mut)}
.calc-tab td.cact,.calc-tab th.cact{white-space:nowrap;width:1%}
.calc-tab td.cin{padding:2px 3px;background:#fffbeb}
.calc-tab tfoot td{font-weight:700;background:#f1f5f9}
.calc-tab tr.hl>*{background:#e0e7ff;font-weight:700}
.calc-tab tr.top>*{background:#c7d2fe;font-weight:700}
.calc-tab tr.sub>th{font-weight:400;padding-left:18px}
.calc-kv tbody th{text-align:left;font-weight:400;color:#334155;font-size:12px;background:#fff;white-space:normal}
.calc-kv td{width:160px}
.calc-head th{background:#f8fafc;width:auto}
.calc-head td{min-width:90px}
td input.ci,input.ci{width:100%;min-width:72px;height:24px;background:#fefce8;border:1px solid #fde68a;border-radius:4px;padding:2px 6px;font-size:12px;color:var(--ink)}
input.ci.num{text-align:right}
input.ci.ci-name{min-width:170px}
input.ci:focus,td input.ci:focus{outline:none;border-color:var(--acc);background:#fff}
input.ci.bad{border-color:var(--red);background:#fef2f2}
.btn.ca{padding:1px 6px;min-width:24px;font-size:12px}
.calc-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 12px;margin-bottom:6px}
.calc-form .mf{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut)}
.calc-form .mf.wide{grid-column:1/-1}
input.ci:disabled{background:#f3f3f3;border-color:var(--line);color:var(--mut)}
input.ci::placeholder{color:#a8a29e}
.calc-form textarea{width:100%;font:12px/1.4 inherit;border:1px solid #fde68a;background:#fefce8;border-radius:6px;padding:4px 6px;resize:vertical}
.calc-form .cout{display:block;height:24px;line-height:22px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:#f3f3f3;color:var(--ink);font-size:12px;text-align:right}
.calc-check{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:4px}
.calc-check input{width:16px;height:16px;accent-color:var(--acc)}
.calc-warn{margin:0}
.co.warnline{display:block;color:#b45309;white-space:pre-line;font-size:12px}
.co.warnline:not(:empty){margin:4px 0 8px;padding:6px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px}
.calc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}
.calc-kpi{border:1px solid #c7d2fe;border-radius:8px;padding:8px 10px;background:#eef2ff;font-size:11.5px;color:#3730a3}
.calc-kpi .kv{display:block;font-size:17px;font-weight:700;color:var(--ink);margin-top:2px}
.calc-det{margin:6px 0}
.calc-det>summary{cursor:pointer;font-size:12px;font-weight:600;color:#334155;padding:4px 0}
.calc-steps{margin:4px 0 8px;padding-left:20px;font-size:12px;line-height:1.5}
.calc-legend{font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.calc-legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.calc-legend .sw-in{background:#fefce8;border-color:#fde68a}.calc-legend .sw-out{background:#f3f3f3}.calc-legend .sw-hl{background:#e0e7ff}
.calc-link{font-weight:600;color:var(--acc)}
.calc-audit td{white-space:normal;vertical-align:top;font-size:11.5px;padding:3px 5px}
.calc-audit td.calc-old{color:#94a3b8;text-decoration:line-through}
.calc-audit td.cin{min-width:180px}
.calc-tab td.linked{background:#dcfce7}
.calc-tab td.cc{text-align:center}
.calc-tab td.cc input{width:16px;height:16px;accent-color:var(--acc)}
select.ci{width:100%;min-width:80px;height:24px;background:#fefce8;border:1px solid #fde68a;border-radius:4px;font-size:12px;color:var(--ink)}
.calc-legend .sw-link{background:#dcfce7}
.calc-kpi.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.calc-kpi.good{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.calc-sub{margin:12px 0 6px;font-size:12.5px}
.calc-svg{display:block;width:100%;max-width:760px;height:auto;margin:8px 0}
.calc-checks{margin:0;padding-left:18px;font-size:12px;line-height:1.6}
.calc-checks li.warn{color:#b45309}
.calc-checks li.info{color:#64748b}
.calc-var{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
input.ci.calc-var-name{width:240px;flex:0 1 240px}
</style>
</head>
<body>
<header>
  <h1>Kalkulationstool<span class="v" id="app-ver">V2.2</span></h1>
  <span class="proj" id="hdr-proj">Neue Kalkulation</span>
  <div class="hdr-actions">
    <button type="button" class="btn" id="btn-undo" disabled title="Rückgängig">Rückgängig</button>
    <div class="dd" id="dd-file">
      <button type="button" class="btn" id="btn-dd-file" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-file">Datei ▾</button>
      <div class="dd-menu dd-list" id="menu-file" role="menu" aria-label="Datei">
        <button type="button" role="menuitem" id="btn-new">Neue Kalkulation</button>
        <button type="button" role="menuitem" id="btn-open">Kalkulation öffnen …</button>
        <button type="button" role="menuitem" id="btn-save">Kalkulation speichern</button>
        <div class="dd-sep" role="separator"></div>
        <button type="button" role="menuitem" id="btn-export-xlsx">Als Excel-Datei exportieren</button>
        <button type="button" role="menuitem" id="btn-report">Gesamtbericht drucken / als PDF</button>
        <div class="dd-sep" role="separator"></div>
        <button type="button" role="menuitem" id="btn-open-lp">Projektdaten aus Lagerplaner-Planungsdatei …</button>
      </div>
    </div>
    <input type="file" id="file-in" accept=".json,application/json" aria-label="Kalkulationsdatei auswählen" hidden>
    <input type="file" id="file-lp" accept=".json,application/json" aria-label="Lagerplaner-Planungsdatei auswählen" hidden>
    <input type="file" id="file-tpl" accept=".json,application/json" aria-label="Vorlage auswählen" hidden>
  </div>
</header>
<nav id="tabs" role="tablist" aria-label="Register">
  <button type="button" role="tab" id="tab-projekt" data-tab="projekt" aria-controls="panel-projekt">Projekt &amp; Basisdaten</button>
  <button type="button" role="tab" id="tab-personal" data-tab="personal" aria-controls="panel-personal">Personalkosten</button>
  <button type="button" role="tab" id="tab-sachkosten" data-tab="sachkosten" aria-controls="panel-sachkosten">Sachkosten</button>
  <button type="button" role="tab" id="tab-summary" data-tab="summary" aria-controls="panel-summary">Summary</button>
  <button type="button" role="tab" id="tab-auswertung" data-tab="auswertung" aria-controls="panel-auswertung">Auswertung</button>
  <button type="button" role="tab" id="tab-oto" data-tab="oto" aria-controls="panel-oto">OtO-Werte</button>
  <button type="button" role="tab" id="tab-dokumentation" data-tab="dokumentation" aria-controls="panel-dokumentation">Dokumentation</button>
</nav>
<main id="panels">
  <div class="panel" id="panel-projekt" role="tabpanel" aria-labelledby="tab-projekt"><div id="calc-panel-projekt"></div></div>
  <div class="panel" id="panel-personal" role="tabpanel" aria-labelledby="tab-personal"><div id="calc-panel-personal"></div></div>
  <div class="panel" id="panel-sachkosten" role="tabpanel" aria-labelledby="tab-sachkosten"><div id="calc-panel-sachkosten"></div></div>
  <div class="panel" id="panel-summary" role="tabpanel" aria-labelledby="tab-summary"><div id="calc-panel-summary"></div></div>
  <div class="panel" id="panel-auswertung" role="tabpanel" aria-labelledby="tab-auswertung"><div id="calc-panel-auswertung"></div></div>
  <div class="panel" id="panel-oto" role="tabpanel" aria-labelledby="tab-oto"><div id="calc-panel-oto"></div></div>
  <div class="panel" id="panel-dokumentation" role="tabpanel" aria-labelledby="tab-dokumentation"><div id="calc-panel-dokumentation"></div></div>
  <div id="calc-datalists" hidden></div>
</main>
<footer id="app-footer">Kalkulationstool V2.2 · Nachbau des Kalkulationstools Light V1.0 · läuft lokal im Browser, keine Serververbindung · Ergebnisse vom Anwender auf Plausibilität zu prüfen</footer>
<script>
"use strict";
/* ============================ Hilfsfunktionen ============================ */
const APP_VERSION="V2.2";
const LS_KEY="kalkulationstool-state";
const $=id=>document.getElementById(id);
const fmt=(n,d)=>{d=(d===undefined)?0:d;return (isFinite(n)?n:0).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});};
const getP=(o,p)=>p.split(".").reduce((a,k)=>(a==null?undefined:a[k]),o);
const setP=(o,p,v)=>{const ks=p.split("."),last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v;};
function escH(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
const tipHtml=t=>t?' <span class="tt" data-tip="'+escH(t)+'" tabindex="0">ⓘ</span>':'';
function fmtDate(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  return m?m[3]+"."+m[2]+"."+m[1]:String(iso||"");
}
const DANGEROUS_KEYS=new Set(["__proto__","prototype","constructor"]);
function isPlainObject(v){
  if(v===null||typeof v!=="object"||Array.isArray(v))return false;
  const proto=Object.getPrototypeOf(v);
  return proto===Object.prototype||proto===null;
}
function cloneSafeValue(v,depth){
  if(depth>40)throw new Error("Datei zu tief verschachtelt.");
  if(Array.isArray(v))return v.map(x=>cloneSafeValue(x,depth+1));
  if(isPlainObject(v))return deepMerge({},v,depth+1);
  if(v===null||typeof v==="string"||typeof v==="boolean"||(typeof v==="number"&&Number.isFinite(v)))return v;
  return null;
}
function deepMerge(base,ext,depth){
  depth=depth||0;
  if(ext==null||!isPlainObject(base)||!isPlainObject(ext))return base;
  if(depth>40)throw new Error("Datei zu tief verschachtelt.");
  for(const k of Object.keys(ext)){
    if(DANGEROUS_KEYS.has(k))continue;
    const value=ext[k];
    if(Array.isArray(value))base[k]=value.map(x=>cloneSafeValue(x,depth+1));
    else if(isPlainObject(value)){if(!isPlainObject(base[k]))base[k]={};deepMerge(base[k],value,depth+1);}
    else if(value===null||typeof value==="string"||typeof value==="boolean"||(typeof value==="number"&&Number.isFinite(value)))base[k]=value;
  }
  return base;
}
function assertSafeImportTree(value,depth){
  if(depth>40)throw new Error("Datei zu tief verschachtelt.");
  if(typeof value==="string"&&value.length>1000000)throw new Error("Ein Textfeld ist größer als 1 MB.");
  if(Array.isArray(value)){
    if(value.length>20000)throw new Error("Die Datei enthält mehr als 20.000 Einträge in einer Liste.");
    for(const item of value)assertSafeImportTree(item,depth+1);
  }else if(isPlainObject(value)){
    for(const key of Object.keys(value)){
      if(DANGEROUS_KEYS.has(key))throw new Error("Unzulässiger Objektschlüssel: "+key);
      assertSafeImportTree(value[key],depth+1);
    }
  }
}
const describeRepairs=fixed=>fixed.map(x=>"· "+x.label+": "+x.from+" → "+x.to).join("\n");
function showNotice(text,ms){
  const el=document.createElement("div");
  el.className="toast";el.setAttribute("role","status");el.textContent=text;el.title="Klicken zum Schließen";
  el.addEventListener("click",()=>el.remove());
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),ms||15000);
  return el;
}
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function openPrintWindow(title,inner){
  const w=window.open("","_blank");
  if(!w){alert("Das Druckfenster wurde blockiert. Bitte Popups für diese lokale Datei zulassen und erneut öffnen.");return;}
  const css='body{font:12px Arial,Helvetica,sans-serif;color:#111827;margin:24px}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:16px 0 6px;border-bottom:1px solid #cbd5e1;padding-bottom:4px;page-break-after:avoid}table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:11.5px}tr{page-break-inside:avoid}td,th{border:1px solid #cbd5e1;padding:5px 7px;text-align:left}th{background:#f1f5f9}td.calc{text-align:right}tr.hl>*,tr.top>*{font-weight:700;background:#eef2ff}.calc-kpis{display:flex;gap:10px;margin:8px 0}.calc-kpi{border:1px solid #cbd5e1;padding:6px 10px}.calc-kpi .kv{display:block;font-size:15px;font-weight:700}.foot{color:#64748b;font-size:10.5px;margin-top:16px}@media print{button{display:none}}';
  w.document.open();
  w.document.write('<!doctype html><html lang="de"><head><meta charset="utf-8"><title>'+escH(title)+'</title><style>'+css+'</style></head><body><h1>'+escH(title)+'</h1>'+inner+'<button onclick="window.print()">Drucken / als PDF speichern</button><div class="foot">Kalkulationstool '+APP_VERSION+' · Alle Eingaben und Ergebnisse sind vom Anwender eigenverantwortlich auf Richtigkeit und Plausibilität zu prüfen.</div></body></html>');
  w.document.close();
}

/* ============================ Kalkulation ============================ */
/* Nachbau des Kalkulationstools Light V1.0 (Excel): Personal- und Sachkosten, Zuschläge im Hundert, Summary und OtO-Werte,
   erweitert um Auswertungen (Jahre, Cashflow, Sensitivität, Preisuntergrenze, Varianten, Plausibilität).
   Projektkopf in S.meta (Name, Kunde) und S.request (Standort, Kontakt, SOP/EOP …); Prozentwerte in Prozent gespeichert.
   excelMode rechnet wie die Excel-Vorlage (Monatsanteile gerundet, höchstens 10 Kalenderjahre, Gross Profit auf den
   Angebotsumsatz, Wechselkurs ohne Wirkung) und lässt die Methodenerweiterungen außen vor; sonst gelten die Korrekturen.
   Eingabehilfen (Personalbedarf, Tarifgruppen, Zuschlag je Zeile) wirken in beiden Modi. */
const CALC_TABS=["projekt","personal","sachkosten","summary","auswertung","oto","dokumentation"];
const CALC_MAX_ROWS=500;
const CALC_LIST_MAX=50;
const CALC_MAX_VARIANTS=10;
const CALC_BASE_FIELDS={profit:[0,90],risk:[0,90],hv:[0,90],bu:[0,90],nl:[0,90],negotiation:[0,90],raise:[-20,50],
  weekendDays:[0,200],holidays:[0,60],vacation:[0,100],sick:[0,200],otherOff:[0,200],hoursWage:[0.5,24],hoursSalary:[0.5,24],
  salBonus:[0,300],salOther:[0,300],wageBonus:[0,300],wageOther:[0,300],salSpecial:[0,300],wageSpecial:[0,300],costRaise:[-20,50],interest:[0,30],
  raiseMonth:[1,12],firstYearPct:[0,100],volumeGrowth:[-50,100],passMarkup:[0,100]};
const CALC_EVAL_FIELDS={priceIndex:[-20,50],discount:[0,50],minMargin:[-50,90],sensi:[1,50],vkMin:[0,1000],vkMax:[0,1000]};
const CALC_DOC_TEXT=["version","status","reviewer","reviewDate","note"];
// Felder je Liste: [Name, Typ, Minimum, Maximum] bzw. [Name, "sel", Optionen]; Typen text, num, pct, sel, check, date, years

/* ---- Prüfung und Reparatur beim Import ---- */
const calcIsDate=v=>typeof v==="string"&&(v===""||/^\d{4}-\d{2}-\d{2}$/.test(v));
const calcIsNum=v=>typeof v==="number"&&Number.isFinite(v);
function calcCheckYearMap(obj,where,min,max){
  if(obj==null)return;
  if(!isPlainObject(obj))throw new Error(where+" muss ein Objekt sein.");
  for(const [k,v] of Object.entries(obj))if(!/^\d{4}$/.test(k)||!calcIsNum(v)||v<min||v>max)throw new Error(where+": Eintrag "+k+" ist ungültig.");
}
function validateCalc(c,label){
  if(c==null)return;
  if(!isPlainObject(c))throw new Error(label+" muss ein Objekt sein.");
  const allowed=new Set(Object.keys(calcDefaults()));
  for(const k of Object.keys(c))if(!allowed.has(k))throw new Error(label+": unbekanntes Feld "+k+".");
  if(c.calcDate!=null&&!calcIsDate(c.calcDate))throw new Error(label+".calcDate muss ein Datum (JJJJ-MM-TT) sein.");
  if(c.excelMode!=null&&typeof c.excelMode!=="boolean")throw new Error(label+".excelMode muss wahr oder falsch sein.");
  const checkList=(key,list,where)=>{
    if(list==null)return;
    if(!Array.isArray(list)||list.length>CALC_MAX_ROWS)throw new Error(where+" muss eine Liste mit höchstens "+CALC_MAX_ROWS+" Zeilen sein.");
    const fields=new Map(CALC_LISTS[key].fields.map(f=>[f[0],f]));
    list.forEach((row,i)=>{
      if(!isPlainObject(row))throw new Error(where+", Zeile "+(i+1)+" ist ungültig.");
      for(const [f,v] of Object.entries(row)){
        const fd=fields.get(f);
        if(!fd)throw new Error(where+", Zeile "+(i+1)+": unbekanntes Feld "+f+".");
        const t=fd[1],bad=t==="text"?(typeof v!=="string"||v.length>200):t==="date"?!calcIsDate(v):t==="check"?typeof v!=="boolean":
          t==="sel"?(typeof v!=="string"||v.length>40):t==="years"?false:!calcIsNum(v);
        if(bad)throw new Error(where+", Zeile "+(i+1)+": "+f+" ist ungültig.");
        if(t==="years")calcCheckYearMap(v,where+", Zeile "+(i+1)+": "+f,0,100000);
      }
    });
  };
  if(c.base!=null){
    if(!isPlainObject(c.base))throw new Error(label+".base muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.base)){
      if(k==="sv")checkList("sv",v,label+".base.sv");
      else if(k==="raises")calcCheckYearMap(v,label+".base.raises",-20,50);
      else if(!CALC_BASE_FIELDS[k])throw new Error(label+".base: unbekanntes Feld "+k+".");
      else if(!calcIsNum(v))throw new Error(label+".base."+k+" muss eine Zahl sein.");
    }
  }
  for(const key of Object.keys(CALC_LISTS))if(key!=="sv")checkList(key,c[key],label+"."+key);
  const checkObj=(obj,where,fields)=>{
    if(obj==null)return;
    if(!isPlainObject(obj))throw new Error(where+" muss ein Objekt sein.");
    for(const [k,v] of Object.entries(obj))if(!fields(k,v))throw new Error(where+"."+k+" ist ungültig.");
  };
  checkObj(c.eval,label+".eval",(k,v)=>!!CALC_EVAL_FIELDS[k]&&calcIsNum(v));
  checkObj(c.doc,label+".doc",(k,v)=>CALC_DOC_TEXT.includes(k)&&typeof v==="string"&&v.length<=(k==="note"?1000:200)&&(k!=="reviewDate"||calcIsDate(v)));
  if(c.oto!=null){
    if(!isPlainObject(c.oto))throw new Error(label+".oto muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.oto)){
      if(k==="rate"){if(!calcIsNum(v)||v<=0||v>1000000)throw new Error(label+".oto.rate muss eine positive Zahl sein.");}
      else if(!CALC_OTO_TEXT.includes(k))throw new Error(label+".oto: unbekanntes Feld "+k+".");
      else if(typeof v!=="string"||v.length>(k==="link"?1000:200))throw new Error(label+".oto."+k+" ist ungültig.");
    }
    if(c.oto.date!=null&&!calcIsDate(c.oto.date))throw new Error(label+".oto.date muss ein Datum (JJJJ-MM-TT) sein.");
    if(c.oto.link&&!/^https?:\/\//i.test(c.oto.link))throw new Error(label+".oto.link muss mit http:// oder https:// beginnen.");
  }
  if(c.lists!=null){
    if(!isPlainObject(c.lists))throw new Error(label+".lists muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.lists)){
      if(!CALC_CHOICES[k])throw new Error(label+".lists: unbekannte Auswahlliste "+k+".");
      if(!Array.isArray(v)||v.length>CALC_LIST_MAX||v.some(x=>typeof x!=="string"||x.length>100))throw new Error(label+".lists."+k+" muss eine Liste mit höchstens "+CALC_LIST_MAX+" Einträgen sein.");
    }
  }
}
/* Fehlende Felder ergänzen, Zahlen in ihre Grenzen holen; liefert die Reparaturen im Format von describeRepairs */
function normalizeCalc(state){
  const fixed=[];
  const c=state.calc=deepMerge(calcDefaults(),state.calc||{});
  const clampField=(obj,f,min,max,label)=>{
    const v=Number(obj[f]);
    if(!Number.isFinite(v)){obj[f]=0;return;}
    const n=Math.min(max,Math.max(min,v));
    if(n!==v){fixed.push({label,from:fmt(v,2),to:fmt(n,2)});obj[f]=n;}
  };
  const clampYears=(obj,min,max,label)=>{for(const k of Object.keys(obj||{}))clampField(obj,k,min,max,label+" "+k);};
  for(const [k,[min,max]] of Object.entries(CALC_BASE_FIELDS))clampField(c.base,k,min,max,"Basisdaten "+k);
  if(!isPlainObject(c.base.raises))c.base.raises={};
  clampYears(c.base.raises,-20,50,"Tariferhöhung");
  for(const [k,[min,max]] of Object.entries(CALC_EVAL_FIELDS))clampField(c.eval,k,min,max,"Auswertung "+k);
  for(const key of Object.keys(CALC_LISTS)){
    const def=CALC_LISTS[key],list=getP(state,def.path);
    const rows=(Array.isArray(list)?list:[]).slice(0,CALC_MAX_ROWS).map(row=>Object.assign(calcNewRow(key),isPlainObject(row)?row:{}));
    rows.forEach((row,i)=>{
      for(const [f,type,a,b] of def.fields){
        const label=def.label+" Zeile "+(i+1);
        if(type==="num"||type==="pct")clampField(row,f,a,b,label);
        else if(type==="sel"&&!a.includes(row[f]))row[f]=a[0];
        else if(type==="check")row[f]=row[f]===true;
        else if(type==="years"){if(!isPlainObject(row[f]))row[f]={};clampYears(row[f],0,100000,label+" FTE");}
      }
    });
    setP(state,def.path,rows);
  }
  if(!(Number(c.oto.rate)>0))c.oto.rate=1;
  return fixed;
}

/* ---- Laufzeit ---- */
const CALC_DAY_MS=86400000;
function calcParseDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
  if(!m)return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  return d.getUTCMonth()===+m[2]-1?d:null;
}
const calcDayDiff=(a,b)=>Math.round((b-a)/CALC_DAY_MS);
// DATEDIF(a;b;"M"): volle Monate
function calcFullMonths(a,b){
  let m=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();
  if(b.getUTCDate()<a.getUTCDate())m--;
  return Math.max(0,m);
}
// Datum um n Monate verschieben (Monatsende begrenzt)
function calcAddMonths(iso,n){
  const d=calcParseDate(iso);if(!d)return iso;
  const y=d.getUTCFullYear(),m=d.getUTCMonth()+n,last=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  return new Date(Date.UTC(y,m,Math.min(d.getUTCDate(),last))).toISOString().slice(0,10);
}
/* Laufzeit und Monatsanteile je Kalenderjahr. Excel: erstes Jahr auf 0,1 Monat abgerundet, letztes aufgerundet,
   Schaltjahr = durch 4 teilbar, höchstens 10 Jahre, Personaldauer = abgerundete Summe. Korrigiert: tagesgenau je Monat
   (monthFrac: Anteil je Kalendermonat, für den Stichtag der Tariferhöhung). */
function calcPeriod(c,req){
  const start=calcParseDate(req.sop),end=calcParseDate(req.eop);
  const y0=start?start.getUTCFullYear():0;
  const P={ok:false,years:[],months:[],monthFrac:[],monthsTotal:0,monthsPersonnel:0,daysYear:start?calcDayDiff(Date.UTC(y0,0,1),Date.UTC(y0+1,0,1)):365,warn:[]};
  if(!start||!end){P.warn.push("Start und Ende der Leistung eingeben (Register Projekt & Basisdaten).");return P;}
  if(end<start){P.warn.push("Das Leistungsende liegt vor dem Start.");return P;}
  const y1=end.getUTCFullYear();
  if(y1-y0>=60){P.warn.push("Laufzeiten über 60 Jahre werden nicht berechnet.");return P;}
  if(c.excelMode){
    const total=calcFullMonths(start,new Date(end.getTime()+CALC_DAY_MS));
    const dy=y=>y%4===0?366:365;
    for(let y=y0;P.years.length<10;y++){
      let m;
      if(y0===y1)m=total;
      else if(y===y0)m=Math.floor((calcDayDiff(start,Date.UTC(y,11,31))+1)/dy(y)*120+1e-9)/10;
      else if(y!==y1)m=12;
      else m=Math.ceil((calcDayDiff(Date.UTC(y,0,1),end)+1)/dy(y)*120-1e-9)/10;
      P.years.push(y);P.months.push(m);P.monthFrac.push(null);
      if(y>=y1)break;
    }
    if(y1-y0+1>10)P.warn.push("Excel-kompatibel: Die Personalkosten berücksichtigen nur die ersten 10 Kalenderjahre.");
    P.monthsTotal=total;
    P.monthsPersonnel=Math.floor(P.months.reduce((a,b)=>a+b,0)+1e-9);
  }else{
    for(let y=y0;y<=y1;y++){
      const frac=[];
      for(let mo=0;mo<12;mo++){
        const ms=Date.UTC(y,mo,1),me=Date.UTC(y,mo+1,0),a=Math.max(ms,start.getTime()),b=Math.min(me,end.getTime());
        frac.push(b>=a?(calcDayDiff(a,b)+1)/(calcDayDiff(ms,me)+1):0);
      }
      P.years.push(y);P.months.push(frac.reduce((a,b)=>a+b,0));P.monthFrac.push(frac);
    }
    P.monthsTotal=P.monthsPersonnel=P.months.reduce((a,b)=>a+b,0);
  }
  P.ok=P.monthsTotal>0;
  if(!P.ok)P.warn.push("Die Laufzeit ist kürzer als ein Monat.");
  return P;
}

/* ---- Rechenkern ---- */
function calcNum(v,min,max){const n=Number(v);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):0;}
const calcNameKey=s=>String(s||"").trim().toLowerCase();
/* opts.factors: Faktoren der Sensitivitätsanalyse (wage, sal, fte, opex, nu, capex, rampup) */
function computeCalc(state,opts){
  opts=opts||{};
  const fac=Object.assign({wage:1,sal:1,fte:1,opex:1,nu:1,capex:1,rampup:1},opts.factors||{});
  const c=state.calc||calcDefaults(),req=state.request||{},b=c.base||{},ev=c.eval||{};
  const g=k=>calcNum(b[k],CALC_BASE_FIELDS[k][0],CALC_BASE_FIELDS[k][1]),pct=k=>g(k)/100;
  const evNum=k=>calcNum(ev[k]==null?calcDefaults().eval[k]:ev[k],CALC_EVAL_FIELDS[k][0],CALC_EVAL_FIELDS[k][1]);
  const P=calcPeriod(c,req),warn=P.warn.slice(),excel=!!c.excelMode;
  const gew=pct("profit"),ris=pct("risk"),hv=pct("hv"),bu=pct("bu"),nl=pct("nl"),verh=pct("negotiation"),raise=pct("raise");
  const umlg=hv+bu+nl,den=1-umlg-gew-ris,passMarkup=excel?0:pct("passMarkup");
  if(den<=0.0001)warn.push("Umlagen, Gewinn und Risiko ergeben zusammen 100 % oder mehr; die Zuschläge im Hundert sind nicht berechenbar.");
  if(verh>=0.9)warn.push("Die Verhandlungsmarge ist zu hoch.");
  const inH=x=>den>0.0001?x/den:0,withVerh=x=>verh<0.9?x/(1-verh):0;
  // Ø produktive Jahresstunden
  const grossDays=P.daysYear-g("weekendDays")-g("holidays");
  const presence=grossDays-g("vacation")-g("sick")-g("otherOff");
  if(presence<=0)warn.push("Keine Anwesenheitstage: Abwesenheiten prüfen.");
  const hWage=Math.max(0,presence*g("hoursWage")),hSal=Math.max(0,presence*g("hoursSalary"));
  const soz=presence>0?(g("holidays")+g("vacation")+g("sick")+g("otherOff"))/presence:0;
  const svRows=(Array.isArray(b.sv)?b.sv:[]).map(x=>({p:calcNum(x&&x.pct,0,100)/100,cap:excel?0:calcNum(x&&x.bbg,0,1e7)}));
  const sv=svRows.reduce((a,x)=>a+x.p,0);
  // SV-Anteil je Stunde; Sätze mit Beitragsbemessungsgrenze nur bis zur Grenze des Jahresentgelts je FTE
  const svOn=(T,hours)=>{const ann=T*hours;return T*svRows.reduce((a,x)=>a+x.p*(x.cap>0&&ann>x.cap?x.cap/ann:1),0);};
  const nY=P.years.length,weights=P.months.map(m=>m/12),wSum=weights.reduce((a,x)=>a+x,0);
  const durP=P.monthsPersonnel/12,durT=P.monthsTotal/12;
  // Tarifindex je Kalenderjahr: Erhöhung zum Stichtagsmonat, erstmals im Jahr nach dem Start, Satz je Jahr überschreibbar
  const raiseRate=y=>{const v=(b.raises||{})[String(y)];return calcIsNum(v)?calcNum(v,-20,50)/100:raise;};
  const raiseIdx=P.years.map((y,i)=>{
    if(excel)return Math.pow(1+raise,i);
    const M=Math.round(g("raiseMonth"))-1,frac=P.monthFrac[i]||[];
    let before=1;for(let k=1;k<i;k++)before*=1+raiseRate(P.years[k]);
    if(i===0)return 1;
    const after=before*(1+raiseRate(y));
    const tot=frac.reduce((a,x)=>a+x,0);
    if(!(tot>0))return after;
    return frac.reduce((a,x,mo)=>a+x*(mo>=M?after:before),0)/tot;
  });
  // Volumen je Jahr: Hochlauf im ersten Kalenderjahr, Wachstum ab dem zweiten
  const vol=P.years.map((y,i)=>excel?1:(i===0?pct("firstYearPct"):1)*Math.pow(1+pct("volumeGrowth"),i));
  const avgW=arr=>wSum>0?arr.reduce((a,x,i)=>a+x*weights[i],0)/wSum:0;

  // Tarifgruppen und Personalbedarf (Eingabehilfen, beide Modi)
  const grades=new Map();
  for(const gr of Array.isArray(c.grades)?c.grades:[]){const k=gr.kind+"|"+calcNameKey(gr.name);if(calcNameKey(gr.name)&&!grades.has(k))grades.set(k,calcNum(gr.rate,0,1e8));}
  const quals=new Map(),dupQuals=new Set();
  for(const [key,list] of [["salaries",c.salaries],["wages",c.wages]])(Array.isArray(list)?list:[]).forEach((row,i)=>{
    const k=calcNameKey(row.name);if(!k)return;
    if(quals.has(k))dupQuals.add(row.name.trim());else quals.set(k,{key,i});
  });
  const needFte=new Map(),need=(Array.isArray(c.need)?c.need:[]).map(row=>{
    const t=quals.get(calcNameKey(row.qual)),hDay=t&&t.key==="salaries"?g("hoursSalary"):g("hoursWage");
    const a=calcNum(row.a,0,1e9),bb=calcNum(row.b,0,1e9),allow=calcNum(row.allow,0,300)/100;
    const fte=row.mode==="Schicht"?a*bb*(1+allow):(bb>0&&hDay>0?a/(bb*hDay)*(1+allow):0);
    if(t){const k=t.key+":"+t.i;needFte.set(k,(needFte.get(k)||0)+fte);}
    return {name:String(row.name||""),qual:String(row.qual||""),target:t||null,fte,hDay};
  });

  // Personalkosten: Zuschlagskette 100 … 700 je Qualifikation, Kosten je Kalenderjahr
  function person(list,isWage){
    const key=isWage?"wages":"salaries",kind=isWage?"Lohn":"Gehalt";
    const zusBase=isWage?soz+pct("wageBonus")+pct("wageOther"):pct("salBonus")+pct("salOther");
    const special=isWage?pct("wageSpecial"):pct("salSpecial"),hours=isWage?hWage:hSal;
    const chain=(R,zus)=>{const Sz=R*zus,T=R+Sz,U=svOn(T,hours),V=T+U,W=inH(V)*umlg,X=V+W,Y=inH(V)*(gew+ris),Z=X+Y,AB=withVerh(Z),AA=AB-Z,AC=AB*special,AD=AB+AC;return {R,Sz,T,U,V,W,X,Y,Z,AA,AB,AC,AD};};
    const rows=(Array.isArray(list)?list:[]).map((row,ri)=>{
      const linked=needFte.has(key+":"+ri);
      const fteIn=(linked?needFte.get(key+":"+ri):calcNum(row.fte,0,1e5))*fac.fte;
      const gradeRate=row.grade?grades.get(kind+"|"+calcNameKey(row.grade)):undefined;
      const rate=(gradeRate!==undefined?gradeRate:calcNum(row.rate,0,1e8))*(isWage?fac.wage:fac.sal);
      const gross=calcNum(row.gross,0,500)/100,zus=zusBase+calcNum(row.extra,0,300)/100;
      const yearly=raiseIdx.map(ix=>rate*ix),toHour=v=>isWage?v:(hSal>0?v/hSal:0);
      const ovr=isPlainObject(row.fteYears)?row.fteYears:{};
      const yr=P.years.map((y,i)=>{
        const o=ovr[String(y)],fteY=excel?fteIn:(calcIsNum(o)?calcNum(o,0,1e5)*fac.fte:fteIn*vol[i]);
        const V=chain(toHour(yearly[i]),zus).V,F=fteY*(1+gross),AF=hours*F,ann=AF*V;
        return {fte:fteY,F,AF,V,ann,cost:ann*P.months[i]/12};
      });
      const R=toHour(wSum>0?avgW(yearly):rate),ch=chain(R,zus);
      let fte,F,AF,AG,AH;
      if(excel||!(durT>0)){
        fte=fteIn;F=fte*(1+gross);AF=hours*F;AG=AF*ch.V;AH=AG*durP;
      }else{
        AH=yr.reduce((a,x)=>a+x.cost,0);AG=AH/durT;
        fte=avgW(yr.map(x=>x.fte));F=avgW(yr.map(x=>x.F));AF=avgW(yr.map(x=>x.AF));
      }
      return Object.assign({name:String(row.name||""),fteIn,linked,rate,gradeRate,gross,yearly,yr,F,fte,AF,AG,AH,svEff:ch.T>0?ch.U/ch.T:0},ch);
    });
    const sum=k=>rows.reduce((a,x)=>a+x[k],0);
    const f=chain(1,zusBase);f.R=1;
    return {rows,fte:sum("fte"),F:sum("F"),AF:sum("AF"),AG:sum("AG"),AH:sum("AH"),hours,zus:zusBase,special,factors:f,
      yr:P.years.map((y,i)=>rows.reduce((a,x)=>a+x.yr[i].cost,0))};
  }
  const sal=person(c.salaries,false),wage=person(c.wages,true);

  // Sachkosten; korrigiert: Steigerung je Kalenderjahr, Einmalkosten mit Kalkulationszins als Annuität, Durchreichposten
  const mT=P.monthsTotal,costRaise=excel?0:pct("costRaise"),interest=excel?0:pct("interest");
  const escY=P.years.map((y,i)=>Math.pow(1+costRaise,i)),esc=wSum>0?avgW(escY):1;
  const annuity=interest>0&&durT>0?interest/(1-Math.pow(1+interest,-durT)):0;
  const costRows=(key,list)=>(Array.isArray(list)?list:[]).map(x=>{
    const q=calcNum(x.qty,0,1e7),p=calcNum(x.price,-1e10,1e10),pass=!excel&&x.pass===true,f=fac[key];
    if(key==="capex"||key==="rampup"){
      const nominal=q*p*f,pa=annuity?nominal*annuity:(mT>0?nominal/mT*12:0);
      return {q,p,pass,nominal,pa,lz:annuity?pa*durT:nominal,yr:P.months.map(m=>pa*m/12)};
    }
    const base=q*p*(key==="opex"?12:1)*f,yr=P.months.map((m,i)=>base*escY[i]*m/12);
    const lz=excel?base*durT:yr.reduce((a,v)=>a+v,0);
    return {q,p,pass,nominal:0,pa:excel?base:(durT>0?lz/durT:base),lz,yr};
  });
  const cost={};
  for(const key of CALC_COST_KEYS){
    const rows=costRows(key,c[key]),s=(arr,k)=>arr.reduce((a,x)=>a+x[k],0),pr=rows.filter(x=>x.pass);
    cost[key]={rows,pa:s(rows,"pa"),lz:s(rows,"lz"),nominal:s(rows,"nominal"),passPa:s(pr,"pa"),passLz:s(pr,"lz"),
      yr:P.years.map((y,i)=>rows.reduce((a,x)=>a+x.yr[i],0)),yrPass:P.years.map((y,i)=>pr.reduce((a,x)=>a+x.yr[i],0))};
  }

  // Summary: Zuschläge im Hundert auf die Projektkosten ohne Durchreichposten, Durchreichposten mit festem Aufschlag
  const hoursAll=sal.AF+wage.AF;
  const groups=[
    {key:"sal",label:"I-1. Personalkosten Gehälter",pa:sal.AG,lz:excel?sal.AG*durT:sal.AH,hours:sal.AF,passPa:0,passLz:0,yr:sal.yr},
    {key:"wage",label:"I-2. Personalkosten Löhne",pa:wage.AG,lz:excel?wage.AG*durT:wage.AH,hours:wage.AF,passPa:0,passLz:0,yr:wage.yr},
    ...CALC_COST_KEYS.map(k=>({key:k,label:{capex:"II-1. Investitionen/Einmalkosten",opex:"II-2. Monatliche Betriebskosten/Verbräuche",nu:"II-3. Nachunternehmerleistung",rampup:"II-4. Ramp-up-Kosten"}[k],
      pa:cost[k].pa,lz:cost[k].lz,hours:hoursAll,passPa:cost[k].passPa,passLz:cost[k].passLz,yr:cost[k].yr,yrPass:cost[k].yrPass}))
  ];
  const level=(K,Kp)=>{
    const base=inH(K-Kp),um=base*umlg,ge=base*gew,ri=base*ris,pm=Kp*passMarkup,uov=base+Kp+pm,ve=verh<0.9?verh*uov/(1-verh):0;
    return {K,Kp,um,sk:K+um,ge,ri,pm,uov,ve,umv:uov+ve,base};
  };
  const tot=k=>groups.reduce((a,x)=>a+x[k],0);
  const sum={pa:level(tot("pa"),tot("passPa")),lz:level(tot("lz"),tot("passLz"))};

  // OtO-Werte; korrigiert: HV+BU als Anteil am Umsatz ohne Verhandlung, Wechselkurs angewendet
  const fx=excel?1:(Number(c.oto&&c.oto.rate)>0?Number(c.oto.rate):1);
  const s=sum.pa,hvbu=hv+bu;
  const oto=(to,ebita)=>{
    const gp=excel?(to?(ebita/to+hvbu)*to:0):ebita+s.base*hvbu;
    return {to:to*fx,ebita:ebita*fx,gp:gp*fx,ebitaPct:to?ebita/to:0,gpPct:to?gp/to:0};
  };
  const offer=oto(s.umv,s.ge+s.pm+s.ve),walk=oto(s.uov,s.ge+s.pm);
  const fteNet=sal.fte+wage.fte;

  // Ergebnis je Kalenderjahr bei Festpreis (Angebotspreis p.a., optional mit Preisgleitung) und Cashflow
  const pg=evNum("priceIndex")/100,gI=P.years.map((y,i)=>Math.pow(1+pg,i));
  const gAvg=wSum>0?avgW(gI):1;
  const invest=cost.capex.nominal+cost.rampup.nominal;
  const years=P.years.map((y,i)=>{
    const m=P.months[i],pers=sal.yr[i]+wage.yr[i],mat=CALC_COST_KEYS.reduce((a,k)=>a+cost[k].yr[i],0);
    const Kp=CALC_COST_KEYS.reduce((a,k)=>a+cost[k].yrPass[i],0),K=pers+mat,L=level(K,Kp);
    const rev=s.umv*m/12*(gAvg>0?gI[i]/gAvg:1),ebita=rev-L.sk-L.ri;
    const amort=cost.capex.yr[i]+cost.rampup.yr[i],cash=rev-(L.sk-amort);
    return {year:y,months:m,pers,mat,K,sk:L.sk,ri:L.ri,rev,ebita,margin:rev?ebita/rev:0,costPrice:L.umv,amort,cash,cum:0};
  });
  // Amortisation, Kapitalwert und interne Verzinsung; Investitionen und Ramp-up zum Start
  let tEnd=0,payback=null,cum=-invest;
  const flows=[{t:0,v:-invest}];
  for(const x of years){
    const prev=cum;cum+=x.cash;x.cum=cum;
    if(payback===null&&invest>0&&prev<0&&cum>=0&&x.cash>0)payback=tEnd*12+x.months*(-prev/x.cash);
    tEnd+=x.months/12;flows.push({t:tEnd,v:x.cash});
  }
  if(invest<=0)payback=0;
  const disc=evNum("discount")/100,npvAt=r=>flows.reduce((a,f)=>a+f.v/Math.pow(1+r,f.t),0);
  let irr=null;
  if(invest>0){
    let lo=-0.99,hi=10,flo=npvAt(lo),fhi=npvAt(hi);
    if(flo*fhi<0){for(let k=0;k<200;k++){const mid=(lo+hi)/2,fm=npvAt(mid);if(flo*fm<=0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;}}irr=(lo+hi)/2;}
  }
  const minMargin=evNum("minMargin")/100;
  const floor=minMargin<1?(s.sk+s.ri)/(1-minMargin):0;
  return {period:P,warn,excel,
    rates:{gew,ris,hv,bu,nl,umlg,verh,raise,den,hvbu,costRaise,interest,esc,annuity,passMarkup,raiseIdx,vol},
    days:{grossDays,presence,hWage,hSal,soz,sv,grossSuggest:presence>0?grossDays/presence-1:0},
    sal,wage,cost,need,dupQuals:[...dupQuals],groups,sum,hoursAll,fteNet,fteGross:sal.F+wage.F,perFte:fteNet>0?s.umv/fteNet:0,
    years,cash:{invest,payback,npv:npvAt(disc),irr,discount:disc,final:cum},
    price:{floor,headroom:s.umv-floor,headroomPct:s.umv?(s.umv-floor)/s.umv:0,minMargin},
    eval:{priceIndex:pg,vkMin:evNum("vkMin"),vkMax:evNum("vkMax"),sensi:evNum("sensi")/100},
    oto:{offer,walk,invest:cost.capex.nominal*fx,leasing:cost.opex.pa*fx,fx,currency:(c.oto&&c.oto.currency)||"EUR"}};
}

/* ---- Sensitivität: Ein-Punkt-Variation; Wirkung auf den kostendeckenden Angebotspreis und auf das EBITA bei festem Preis ---- */
function calcSensitivity(state,base){
  const d=base.eval.sensi,fixed=base.sum.pa.umv,ebitaAt=r=>fixed-r.sum.pa.sk-r.sum.pa.ri,e0=ebitaAt(base),pct=v=>(v>0?"+":"−")+fmt(Math.abs(v)*100,0)+" %";
  const clone=fn=>{const st=JSON.parse(JSON.stringify(state));fn(st);return computeCalc(st);};
  const byFactor=(k,sg)=>computeCalc(state,{factors:{[k]:1+sg*d}});
  const drivers=[
    ["wage","Stundenlöhne",sg=>byFactor("wage",sg),pct(-d),pct(d)],
    ["sal","Gehälter",sg=>byFactor("sal",sg),pct(-d),pct(d)],
    ["fte","Personalbedarf (FTE)",sg=>byFactor("fte",sg),pct(-d),pct(d)],
    // Mehr Krankheitstage: gleiche Anwesenheit erfordert mehr Brutto-FTE (Brutto-Zuschlag im Verhältnis der Anwesenheitstage)
    ["sick","Krankheitstage",sg=>clone(st=>{
      const p0=base.days.presence,b=st.calc.base;b.sick=Math.max(0,(+b.sick||0)+sg*3);
      const p1=computeCalc(st).days.presence;
      if(p0>0&&p1>0)for(const row of st.calc.salaries.concat(st.calc.wages))row.gross=((1+(+row.gross||0)/100)*p0/p1-1)*100;
    }),"−3 Tage","+3 Tage"],
    ["raise","Personalkostensteigerung p.a.",sg=>clone(st=>{st.calc.base.raise=(+st.calc.base.raise||0)+sg;}),"−1 Pp.","+1 Pp."],
    ["opex","Betriebskosten",sg=>byFactor("opex",sg),pct(-d),pct(d)],
    ["nu","Nachunternehmer",sg=>byFactor("nu",sg),pct(-d),pct(d)],
    ["capex","Investitionen",sg=>byFactor("capex",sg),pct(-d),pct(d)],
    ["rampup","Ramp-up",sg=>byFactor("rampup",sg),pct(-d),pct(d)],
    ["term","Laufzeit",sg=>clone(st=>{st.request.eop=calcAddMonths(st.request.eop,sg*12);}),"−12 Monate","+12 Monate"]
  ];
  return drivers.map(([key,label,run,lowTxt,highTxt])=>{
    const lo=run(-1),hi=run(1),ok=x=>x.period.ok;
    return {key,label,lowTxt,highTxt,
      eLow:ok(lo)?ebitaAt(lo)-e0:0,eHigh:ok(hi)?ebitaAt(hi)-e0:0,
      pLow:ok(lo)?lo.sum.pa.umv-fixed:0,pHigh:ok(hi)?hi.sum.pa.umv-fixed:0};
  }).sort((a,b)=>Math.max(Math.abs(b.eLow),Math.abs(b.eHigh))-Math.max(Math.abs(a.eLow),Math.abs(a.eHigh)));
}

/* ---- Plausibilität ---- */
function calcChecks(state,r){
  const c=state.calc,out=[],warn=t=>out.push({sev:"warn",text:t}),info=t=>out.push({sev:"info",text:t});
  for(const w of r.warn)warn(w);
  const maxY=Math.max(...Object.keys(CALC_MIN_WAGE).map(Number)),minWage=y=>CALC_MIN_WAGE[Math.min(y,maxY)];
  let laterYears=false;
  r.wage.rows.forEach((x,i)=>{
    r.period.years.forEach((y,k)=>{
      if(y<2024||!(x.yearly[k]>0))return;
      if(y>maxY)laterYears=true;
      if(x.yearly[k]+1e-9<minWage(y))warn("Mindestlohn: „"+(x.name||"Lohn "+(i+1))+"“ liegt "+y+" mit "+fmt(x.yearly[k],2)+" €/h unter "+fmt(minWage(y),2)+" €/h.");
    });
  });
  if(laterYears&&r.wage.rows.length)info("Mindestlohn ab "+(maxY+1)+" noch nicht festgelegt; geprüft gegen "+fmt(CALC_MIN_WAGE[maxY],2)+" €/h.");
  for(const [key,res] of [["salaries",r.sal],["wages",r.wage]]){
    res.rows.forEach((x,i)=>{
      const where=CALC_LISTS[key].label+" Zeile "+(i+1)+(x.name?" („"+x.name+"“)":"");
      if(!x.name.trim())info(CALC_LISTS[key].label+" Zeile "+(i+1)+": ohne Bezeichnung.");
      if(!(x.fteIn>0))info(where+": ohne FTE.");
      if(x.fteIn>0&&x.gross===0&&r.days.grossSuggest>=0.05)(key==="wages"?warn:info)(where+": ohne FTE-Brutto-Zuschlag (Vorschlag "+calcPct(r.days.grossSuggest)+").");
      const row=c[key][i];
      if(row&&row.grade&&x.gradeRate===undefined)warn(where+": Tarifgruppe „"+row.grade+"“ nicht gefunden (Art "+(key==="wages"?"Lohn":"Gehalt")+").");
      if(key==="wages"&&x.fteIn>0&&(x.AB<r.eval.vkMin||x.AB>r.eval.vkMax))info(where+": VK-Satz "+fmt(x.AB,2)+" €/h außerhalb der Spanne "+fmt(r.eval.vkMin,0)+"–"+fmt(r.eval.vkMax,0)+" €/h.");
    });
  }
  for(const n of r.dupQuals)warn("Qualifikation „"+n+"“ mehrfach vorhanden; der Personalbedarf wird der ersten Zeile zugeordnet.");
  r.need.forEach((x,i)=>{
    if(!x.qual.trim())warn("Personalbedarf Zeile "+(i+1)+": keine Qualifikation zugeordnet.");
    else if(!x.target)warn("Personalbedarf Zeile "+(i+1)+": Qualifikation „"+x.qual+"“ nicht in Gehältern oder Löhnen gefunden.");
    if(!(x.fte>0))info("Personalbedarf Zeile "+(i+1)+(x.name?" („"+x.name+"“)":"")+": ergibt 0 FTE (Menge und Leistung bzw. Schichten und Besetzung prüfen).");
  });
  for(const key of CALC_COST_KEYS)(c[key]||[]).forEach((row,i)=>{if(!String(row.name||"").trim()&&row.price)info(CALC_LISTS[key].label+" Zeile "+(i+1)+": ohne Bezeichnung.");});
  if(r.period.ok&&r.sum.pa.umv>0){
    if(r.oto.offer.ebitaPct<r.price.minMargin)warn("EBITA-Marge des Angebots ("+calcPct(r.oto.offer.ebitaPct)+") unter der Mindestmarge ("+calcPct(r.price.minMargin)+").");
    const neg=r.years.filter(x=>x.months>0&&x.ebita<0).map(x=>x.year);
    if(neg.length)warn("Festpreis: negatives EBITA in "+neg.join(", ")+". Preisgleitung oder Aufschlag prüfen.");
    if(r.cash.invest>0&&r.cash.payback===null)warn("Investitionen und Ramp-up amortisieren sich nicht innerhalb der Laufzeit.");
  }
  if(!r.excel&&r.sal.rows.concat(r.wage.rows).some(x=>x.svEff<r.days.sv-1e-9))info("Beitragsbemessungsgrenzen senken den SV-Anteil bei mindestens einer Qualifikation (Personalkosten › Stundensätze).");
  return out;
}

/* ---- Darstellung ---- */
let CALC=null;
const calcEur=(n,d)=>fmt(n,d===undefined?0:d)+" €";
const calcPct=(n,d)=>fmt(n*100,d===undefined?2:d)+" %";
function calcFmtIn(v){return Number.isFinite(Number(v))?Number(v).toLocaleString("de-DE",{maximumFractionDigits:10}):"";}
// Deutsche Schreibweise: Punkt als Tausender-, Komma als Dezimaltrennzeichen; € und % werden ignoriert
function calcParse(text){
  let s=String(text==null?"":text).trim().replace(/[\s €%]/g,"");
  if(!s)return null;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const n=Number(s);
  return Number.isFinite(n)?n:NaN;
}
// .co: Text, .coh: HTML (Diagramme); beide werden bei Eingaben ohne Neuaufbau nachgeführt

/* Listentabelle: cols {h, f (Eingabefeld) | out(i) (Ausgabe), num, tip, calc(i) (Ausgabe statt Eingabe, wenn nicht null), list(i)};

      label:c.h+", Zeile "+(i+1),cls:t==="text"?(c.wide===false?"":"ci-name"):"",placeholder:t==="text"?(c.ph||c.h):"",list:c.list?c.list(i):undefined})+'</td>';
  }).join("")+'<td class="cact">'+calcRowBtns(key,i,list.length)+'</td></tr>').join("")||
    '<tr><td class="cn"></td><td colspan="'+(cols.length+1)+'" class="hint">Keine Einträge. Über „+ Zeile“ anlegen oder einen Bereich aus Excel kopieren und hier mit Strg+V einfügen.</td></tr>';
  const tf=foot?'<tfoot><tr><td class="cn"></td>'+foot.map(x=>x==null?'<td></td>':tdo(x)).join("")+'<td></td></tr></tfoot>':'';

const calcCard=(title,tip,inner,id)=>'<div class="card"'+(id?' id="'+id+'"':'')+'><h3>'+escH(title)+(tip?tipHtml(tip):'')+'</h3>'+inner+'</div>';
const calcWarnHtml=r=>'<p class="calc-warn">'+co(r.warn.join("\n"),"warnline")+'</p>';
function calcKvTable(rows){
  return '<div class="calc-scroll"><table class="calc-tab calc-kv"><tbody>'+rows.map(([label,inner,cls])=>'<tr'+(cls?' class="'+cls+'"':'')+'><th scope="row">'+escH(label)+'</th>'+(String(inner).startsWith("<td")?inner:'<td class="cin">'+inner+'</td>')+'</tr>').join("")+'</tbody></table></div>';
}
// Statische Tabelle für Ausgaben, Druck und Bericht: head [Text], rows [[Zelle]], num: Spalten rechtsbündig ab Index
function calcStaticTable(head,rows,o){
  o=o||{};const numFrom=o.numFrom==null?1:o.numFrom;
  const cell=(v,j,th)=>{const r=j>=numFrom;const cls=(r?' class="calc"':'');return th?'<th'+(r?' class="r"':'')+'>'+escH(v)+'</th>':(j===0?'<th scope="row">'+escH(v)+'</th>':'<td'+cls+'>'+co(v)+'</td>');};
  return '<div class="calc-scroll"><table class="calc-tab'+(o.cls?' '+o.cls:'')+'"><thead><tr>'+head.map((h,j)=>cell(h,j,true)).join("")+'</tr></thead><tbody>'+
    rows.map(r=>'<tr'+(r.cls?' class="'+r.cls+'"':'')+'>'+(r.cells||r).map((v,j)=>cell(v,j,false)).join("")+'</tr>').join("")+'</tbody></table></div>';
}
const calcKpi=(label,val,cls)=>'<div class="calc-kpi'+(cls?" "+cls:"")+'"><span>'+escH(label)+'</span>'+co(val,"kv")+'</div>';

/* ---- Diagramme (SVG, hell, auch im Druck) ---- */
const CALC_SVG_FONT='font-family="Segoe UI,Arial,sans-serif" font-size="11"';
const calcShort=v=>{const a=Math.abs(v);return (v<0?"−":"")+(a>=1e6?fmt(a/1e6,2)+" Mio.":a>=1e3?fmt(a/1e3,0)+" T":fmt(a,0))+" €";};
// Wasserfall von den Projektkosten bis zum Umsatz mit Verhandlung (p.a.)
function calcWaterfallSvg(r){
  const s=r.sum.pa,pers=r.groups[0].pa+r.groups[1].pa,mat=s.K-pers;
  const steps=[["Personalkosten",pers,"#2563eb"],["Sachkosten",mat,"#0d9488"],["Umlagen",s.um,"#64748b"],["Gewinn + Risiko",s.ge+s.ri+s.pm,"#16a34a"],["Verhandlung",s.ve,"#d97706"]];
  const total=s.umv;if(!(total>0))return '<p class="hint">Noch keine Werte für das Diagramm.</p>';
  const W=640,H=230,L=10,T=16,B=48,bw=(W-L*2)/(steps.length+1)-14,sc=(H-T-B)/total;
  let acc=0,out='';
  steps.forEach(([label,v,col],i)=>{
    const x=L+i*(bw+14),y=H-B-(acc+Math.max(v,0))*sc,h=Math.max(1,Math.abs(v)*sc);
    out+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+col+'" rx="2"/>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" fill="#0f172a">'+escH(calcShort(v))+'</text>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-B+14)+'" text-anchor="middle" fill="#475569">'+escH(label)+'</text>';
    acc+=v;
  });
  const x=L+steps.length*(bw+14),y=H-B-total*sc;
  out+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(total*sc).toFixed(1)+'" fill="#4338ca" rx="2"/>'+
    '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" fill="#0f172a" font-weight="700">'+escH(calcShort(total))+'</text>'+
    '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-B+14)+'" text-anchor="middle" fill="#475569">Umsatz</text>';
  return '<svg class="calc-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Wasserfall von den Projektkosten bis zum Umsatz pro Jahr" '+CALC_SVG_FONT+'><line x1="0" y1="'+(H-B)+'" x2="'+W+'" y2="'+(H-B)+'" stroke="#cbd5e1"/>'+out+'</svg>';
}
// EBITA je Kalenderjahr bei Festpreis
function calcYearBarsSvg(r){
  const ys=r.years.filter(x=>x.months>0);if(!ys.length)return '';
  // Skala von min(0, kleinster Wert) bis max(0, größter Wert)
  const W=640,H=200,T=18,B=36,hi=Math.max(0,...ys.map(x=>x.ebita)),lo=Math.min(0,...ys.map(x=>x.ebita)),span=Math.max(1,hi-lo);
  const sc=(H-T-B)/span,mid=T+hi*sc,bw=Math.min(70,(W-20)/ys.length-12);
  let out='<line x1="0" y1="'+mid+'" x2="'+W+'" y2="'+mid+'" stroke="#94a3b8"/>';
  ys.forEach((x,i)=>{
    const cx=10+i*(bw+12),h=Math.abs(x.ebita)*sc,y=x.ebita>=0?mid-h:mid;
    out+='<rect x="'+cx+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" fill="'+(x.ebita>=0?"#16a34a":"#dc2626")+'" rx="2"/>'+
      '<text x="'+(cx+bw/2).toFixed(1)+'" y="'+(x.ebita>=0?y-4:y+h+12).toFixed(1)+'" text-anchor="middle" fill="#0f172a">'+escH(calcPct(x.margin,1))+'</text>'+
      '<text x="'+(cx+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" fill="#475569">'+x.year+'</text>';
  });
  return '<svg class="calc-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="EBITA-Marge je Kalenderjahr bei Festpreis" '+CALC_SVG_FONT+'>'+out+'</svg>';
}
// Tornado: Wirkung auf das EBITA p.a. bei festem Angebotspreis
function calcTornadoSvg(rows){
  if(!rows.length)return '';
  const W=640,rowH=24,L=190,R=70,H=rows.length*rowH+30,max=Math.max(1,...rows.map(x=>Math.max(Math.abs(x.eLow),Math.abs(x.eHigh)))),cx=L+(W-L-R)/2,sc=(W-L-R)/2/max;
  let out='<line x1="'+cx+'" y1="4" x2="'+cx+'" y2="'+(H-22)+'" stroke="#475569"/>';
  rows.forEach((x,i)=>{
    const y=8+i*rowH;
    for(const [v,lab] of [[x.eLow,x.lowTxt],[x.eHigh,x.highTxt]]){
      const w=Math.abs(v)*sc,x0=v>=0?cx:cx-w;
      out+='<rect x="'+x0.toFixed(1)+'" y="'+y+'" width="'+Math.max(1,w).toFixed(1)+'" height="16" fill="'+(v>=0?"#16a34a":"#dc2626")+'" opacity=".85" rx="2"><title>'+escH(x.label+" "+lab+": "+calcShort(v))+'</title></rect>';
    }
    out+='<text x="'+(L-8)+'" y="'+(y+12)+'" text-anchor="end" fill="#0f172a">'+escH(x.label)+'</text>'+
      '<text x="'+(W-R+6)+'" y="'+(y+12)+'" fill="#475569">'+escH(calcShort(Math.max(Math.abs(x.eLow),Math.abs(x.eHigh))))+'</text>';
  });
  out+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" fill="#475569">Δ EBITA p.a. bei festem Angebotspreis</text>';
  return '<svg class="calc-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tornado-Diagramm der Sensitivitätsanalyse" '+CALC_SVG_FONT+'>'+out+'</svg>';
}

    (rows.map(x=>'<tr><td>'+escH(x.name||"–")+'</td>'+CALC_CHAIN.map(([,,k])=>tdo(e2(x[k]))).join("")+tdo(calcPct(x.svEff))+tdo(fmt(x.AF,1))+'</tr>').join("")||'<tr><td colspan="'+(CALC_CHAIN.length+3)+'" class="hint">Keine Einträge.</td></tr>')+

/* Register Summary */
function calcSummaryTables(r){
  const s=r.sum,P=r.period,c=S.calc,req=S.request||{},meta=S.meta||{},rt=r.rates,share=(a,b)=>b?calcPct(a/b):"–";
  const head='<table class="calc-tab calc-head"><tbody>'+
    '<tr><th>Projektname</th><td>'+co(meta.name||"–")+'</td><th>Start Leistung</th><td>'+co(fmtDate(req.sop)||"–")+'</td><th>Geschäftsbereich / Service-Line</th><td>'+co([req.businessUnit,req.serviceLine].filter(Boolean).join(" / ")||"–")+'</td></tr>'+
    '<tr><th>Kundenname</th><td>'+co(meta.kunde||"–")+'</td><th>Ende Leistung</th><td>'+co(fmtDate(req.eop)||"–")+'</td><th>Kalkulationsdatum</th><td>'+co(fmtDate(c.calcDate)||"–")+'</td></tr>'+
    '<tr><th>Projektstandort</th><td>'+co(req.serviceSite||"–")+'</td><th>Laufzeit [Monate]</th><td>'+co(P.ok?fmt(P.monthsTotal,P.monthsTotal%1?2:0):"–")+'</td><th>Rechenmodus · Version</th><td>'+co((r.excel?"Excel-kompatibel":"korrigiert")+" · "+(c.doc.version||"–")+" ("+(c.doc.status||"–")+")")+'</td></tr>'+
    '</tbody></table>';
  const rates='<table class="calc-tab calc-head"><tbody><tr><th>HV-Umlage</th>'+tdo(calcPct(rt.hv))+'<th>BU-Umlage</th>'+tdo(calcPct(rt.bu))+'<th>NL-Umlage</th>'+tdo(calcPct(rt.nl))+
    '<th>Gewinn</th>'+tdo(calcPct(rt.gew))+'<th>Risiko</th>'+tdo(calcPct(rt.ris))+'<th>Verhandlung</th>'+tdo(calcPct(rt.verh))+'</tr></tbody></table>';
  const checks=calcChecks(S,r),nWarn=checks.filter(x=>x.sev==="warn").length;
  const kpis='<div class="calc-kpis">'+calcKpi("TO p.a. mit Verhandlung",calcEur(s.pa.umv))+calcKpi("TO Laufzeit mit Verhandlung",calcEur(s.lz.umv))+calcKpi("Umsatz je Netto-FTE p.a.",calcEur(r.perFte))+
    calcKpi("EBITA-Marge Angebot",calcPct(r.oto.offer.ebitaPct))+calcKpi("Plausibilität",nWarn?nWarn+(nWarn===1?" Warnung":" Warnungen"):"ohne Warnung",nWarn?"bad":"good")+'</div>';
  const fte='<table class="calc-tab"><thead><tr><th></th><th class="r">Ø FTE netto</th><th class="r">Ø FTE brutto</th><th class="r">Produktive Jahresstunden</th></tr></thead><tbody>'+
    '<tr><th scope="row">FTE Gehälter</th>'+tdo(fmt(r.sal.fte,2))+tdo(fmt(r.sal.F,2))+tdo(fmt(r.sal.AF))+'</tr>'+
    '<tr><th scope="row">FTE Löhne</th>'+tdo(fmt(r.wage.fte,2))+tdo(fmt(r.wage.F,2))+tdo(fmt(r.wage.AF))+'</tr>'+
    '<tr class="hl"><th scope="row">∑ FTE</th>'+tdo(fmt(r.fteNet,2))+tdo(fmt(r.fteGross,2))+tdo(fmt(r.hoursAll))+'</tr></tbody></table>';
  const ph=(v,h)=>h>0?calcEur(v/h,2):"–",H=r.hoursAll;
  const line=(label,pct,pa,lz,perH,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><th scope="row">'+escH(label)+'</th>'+tdo(pct)+tdo(calcEur(pa))+tdo(calcEur(lz))+tdo(perH)+'</tr>';
  const main='<table class="calc-tab calc-sum"><thead><tr><th>Summary Kalkulation</th><th class="r">%-Anteile</th><th class="r">Pro Jahr (p.a.)</th><th class="r">Laufzeit</th><th class="r">Je produktive Stunde</th></tr></thead><tbody>'+
    r.groups.map(g=>line(g.label,share(g.lz,s.lz.sk),g.pa,g.lz,ph(g.pa,g.hours))).join("")+
    line("Projektkosten",share(s.lz.K,s.lz.sk),s.pa.K,s.lz.K,ph(s.pa.K,H),"hl")+
    (s.pa.Kp?line("davon Durchreichposten",share(s.lz.Kp,s.lz.sk),s.pa.Kp,s.lz.Kp,ph(s.pa.Kp,H),"sub"):"")+
    line("Unternehmensumlagen (HV/BU/NL)",share(s.lz.um,s.lz.sk),s.pa.um,s.lz.um,ph(s.pa.um,H),"sub")+
    line("∑ Selbstkosten",share(s.lz.sk,s.lz.sk),s.pa.sk,s.lz.sk,ph(s.pa.sk,H),"hl")+
    line("Gewinn",share(s.lz.ge,s.lz.uov),s.pa.ge,s.lz.ge,ph(s.pa.ge,H),"sub")+
    line("Risiko",share(s.lz.ri,s.lz.uov),s.pa.ri,s.lz.ri,ph(s.pa.ri,H),"sub")+
    (s.pa.Kp?line("Aufschlag Durchreichposten",share(s.lz.pm,s.lz.uov),s.pa.pm,s.lz.pm,ph(s.pa.pm,H),"sub"):"")+
    line("Umsatz ohne Verhandlung",share(s.lz.uov,s.lz.sk),s.pa.uov,s.lz.uov,ph(s.pa.uov,H),"hl")+
    line("Verhandlung",share(s.lz.ve,s.lz.umv),s.pa.ve,s.lz.ve,ph(s.pa.ve,H),"sub")+
    line("Umsatz mit Verhandlung",share(s.lz.umv,s.lz.sk),s.pa.umv,s.lz.umv,ph(s.pa.umv,H),"top")+
    '</tbody></table><p class="hint">%-Anteile: Kostenpositionen und Umlagen bezogen auf die Selbstkosten, Gewinn, Risiko und Aufschlag auf den Umsatz ohne Verhandlung, Verhandlung auf den Umsatz mit Verhandlung, Umsätze auf die Selbstkosten. Personalkosten je Stunde auf die eigenen produktiven Stunden, übrige Positionen auf alle produktiven Stunden.</p>';
  const o=r.oto,cur=" "+o.currency,m=v=>fmt(v,0)+cur;
  const otoTab=(title,x,withVerh)=>'<table class="calc-tab calc-oto"><thead><tr><th>'+escH(title)+'</th><th class="r">%-Anteile</th><th class="r">pro Jahr (p.a.)</th></tr></thead><tbody>'+
    '<tr><th scope="row">Umsatz '+(withVerh?"mit":"ohne")+' Verhandlung</th><td></td>'+tdo(m(x.to))+'</tr>'+
    '<tr><th scope="row">EBITA (Gewinn'+(withVerh?" + Verhandlung":"")+')</th>'+tdo(calcPct(x.ebitaPct))+tdo(m(x.ebita))+'</tr>'+
    '<tr><th scope="row">Gross Profit (EBITA + HV + BU)</th>'+tdo(calcPct(x.gpPct))+tdo(m(x.gp))+'</tr></tbody></table>';
  const sc=h=>'<div class="calc-scroll">'+h+'</div>';
  return {head:sc(head),rates:sc(rates),kpis,fte:sc(fte),main:sc(main),waterfall:calcWaterfallSvg(r),oto:'<div class="calc-grid">'+sc(otoTab("OtO-Wert Angebots-TO",o.offer,true))+sc(otoTab("OtO-Wert Walkaway-Price",o.walk,false))+'</div>'};
}
function calcSummaryHtml(r){
  const t=calcSummaryTables(r);
  return calcWarnHtml(r)+calcCard("Summary Kalkulation","Keine Eingaben in diesem Register. Alle Werte aus Projekt & Basisdaten, Personal- und Sachkosten.",
    t.head+t.rates+t.kpis+'<div class="rowbtns"><button type="button" class="btn" id="calc-print-summary">Summary drucken</button></div>')+
    calcCard("Kosten und Umsatz","",t.main)+calcCard("Kostenaufbau pro Jahr","Von den Projektkosten bis zum Umsatz mit Verhandlung.",coh(t.waterfall))+
    '<div class="calc-grid">'+calcCard("Personaleinsatz","Ø über die Laufzeit.",t.fte)+calcCard("OtO-Werte","Angebots-TO mit Verhandlung, Walkaway-Price ohne Verhandlung.",t.oto)+'</div>'+
    '<details class="calc-det card"><summary>Rechenweg</summary><ol class="calc-steps">'+
    '<li>Personalkosten je Kalenderjahr = produktive Jahresstunden × Brutto-FTE des Jahres × kalkulatorischer Satz des Jahres (Position 300) × Monatsanteil; p.a. = Summe ÷ Laufzeit in Jahren.</li>'+
    '<li>Sachkosten p.a.: Investitionen und Ramp-up auf die Laufzeit verteilt (linear oder als Annuität), Betriebskosten × 12, Nachunternehmer je Jahr, jeweils mit Steigerung.</li>'+
    '<li>Basis = Projektkosten ohne Durchreichposten ÷ (1 − Umlagen − Gewinn − Risiko); Umlagen, Gewinn und Risiko = Basis × Satz; Durchreichposten mit eigenem Aufschlag.</li>'+
    '<li>Umsatz mit Verhandlung = Umsatz ohne Verhandlung ÷ (1 − Verhandlungsmarge).</li>'+
    '<li>EBITA = Gewinn + Aufschlag Durchreichposten (+ Verhandlung beim Angebots-TO); Gross Profit = EBITA + HV- und BU-Umlage.</li></ol></details>';
}

/* Register Auswertung */
function calcEvalTables(r,sens,checks){
  const yrs=r.years.filter(x=>x.months>0),tot=k=>yrs.reduce((a,x)=>a+x[k],0),totRev=tot("rev"),totE=tot("ebita");
  const years=calcStaticTable(["Jahr","Monate","Personalkosten","Sachkosten","Selbstkosten","Risiko","Umsatz (Festpreis)","EBITA","EBITA-Marge","Kostendeckender Preis","Über-/Unterdeckung"],
    yrs.map(x=>[String(x.year),fmt(x.months,x.months%1?2:0),calcEur(x.pers),calcEur(x.mat),calcEur(x.sk),calcEur(x.ri),calcEur(x.rev),calcEur(x.ebita),calcPct(x.margin,1),calcEur(x.costPrice),calcEur(x.rev-x.costPrice)])
      .concat([{cls:"hl",cells:["Summe",fmt(tot("months"),0),calcEur(tot("pers")),calcEur(tot("mat")),calcEur(tot("sk")),calcEur(tot("ri")),calcEur(totRev),calcEur(totE),calcPct(totRev?totE/totRev:0,1),calcEur(tot("costPrice")),calcEur(totRev-tot("costPrice"))]}]));
  const c=r.cash,payback=c.invest<=0?"keine Einmalkosten":c.payback===null?"nicht innerhalb der Laufzeit":fmt(c.payback,1)+" Monate";
  const cash=calcStaticTable(["Zeitpunkt","Einzahlung","Auszahlung","Cashflow","Kumuliert"],
    [{cls:"sub",cells:["Start (Investitionen, Ramp-up)",calcEur(0),calcEur(c.invest),calcEur(-c.invest),calcEur(-c.invest)]}].concat(yrs.map(x=>[String(x.year),calcEur(x.rev),calcEur(x.rev-x.cash),calcEur(x.cash),calcEur(x.cum)])));
  const cashKpi='<div class="calc-kpis">'+calcKpi("Kapitalbindung zum Start",calcEur(c.invest))+calcKpi("Amortisation",payback,c.invest>0&&c.payback===null?"bad":"")+
    calcKpi("Kapitalwert ("+calcPct(c.discount,1)+")",calcEur(c.npv),c.npv<0?"bad":"")+calcKpi("Interne Verzinsung",c.irr===null?"–":calcPct(c.irr,1))+'</div>';
  const p=r.price;
  const price='<div class="calc-kpis">'+calcKpi("Angebotspreis p.a.",calcEur(r.sum.pa.umv))+calcKpi("Preisuntergrenze p.a. (EBITA-Marge "+calcPct(p.minMargin,1)+")",calcEur(p.floor))+
    calcKpi("Verhandlungsspielraum p.a.",calcEur(p.headroom)+" ("+calcPct(p.headroomPct,1)+")",p.headroom<0?"bad":"good")+calcKpi("Selbstkosten + Risiko p.a.",calcEur(r.sum.pa.sk+r.sum.pa.ri))+'</div>';

// Feldwert lesen und speichern; liefert false bei ungültiger Zahl
function calcStoreField(el){
  const path=el.dataset.cf,type=el.dataset.ct;
  let v;
  if(type==="check")v=el.checked;
  else if(type==="sel")v=el.value;
  else if(type==="text"||type==="date"){
    v=String(el.value).slice(0,el.maxLength>0?el.maxLength:200);
    if(type==="date"&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
  }else{
    const n=calcParse(el.value);
    if(Number.isNaN(n)){el.classList.add("bad");return false;}
    el.classList.remove("bad");
    // Jahreswerte (FTE je Jahr, Tariferhöhung je Jahr): leer = Vorgabe, Eintrag entfällt
    const ym=/^(.*)\.(\d{4})$/.exec(path);
    if(ym&&/\.(fteYears|raises)$/.test(ym[1])){
      const obj=getP(S,ym[1]);
      if(n===null){if(obj)delete obj[ym[2]];delete el.dataset.clamped;return true;}
    }
    const min=el.dataset.min!==undefined?Number(el.dataset.min):-Infinity,max=el.dataset.max!==undefined?Number(el.dataset.max):Infinity;
    v=n===null?(path==="calc.oto.rate"?1:0):Math.min(max,Math.max(min,n));
    if(n!==null&&v!==n)el.dataset.clamped=fmt(v,v%1?2:0);else delete el.dataset.clamped;
    if(ym&&/\.(fteYears|raises)$/.test(ym[1])&&!isPlainObject(getP(S,ym[1])))setP(S,ym[1],{});
  }
  if(path.startsWith("request.")){
    S.request=S.request||{};
    const k=path.slice(8),t=String(v).trim();
    if(t)S.request[k]=t;else delete S.request[k];
  }else if(path.startsWith("meta.")){S.meta[path.slice(5)]=v;}
  else setP(S,path,v);
  calcSharedChanged(path);
  return true;
}

/* Zellbereich aus Excel einfügen: Tabulator trennt Spalten, Zeilenumbruch Zeilen; fehlende Zeilen werden angelegt */
function calcPaste(ev){
  const el=ev.target;
  if(!el.dataset||el.dataset.cl===undefined||!el.dataset.cf)return;
  const text=(ev.clipboardData&&ev.clipboardData.getData("text/plain"))||"";
  const lines=text.replace(/\r/g,"").replace(/\n+$/,"").split("\n");
  if(lines.length<2&&!/\t/.test(text))return;
  ev.preventDefault();
  const key=el.dataset.cl,def=CALC_LISTS[key],i0=+el.dataset.ci,c0=+el.dataset.cc;
  const fields=def.fields.filter(f=>f[1]!=="years"),start=fields.findIndex(f=>f===def.fields[c0]);
  const list=calcList(key),rowsNeeded=Math.min(CALC_MAX_ROWS,i0+lines.length);
  pushUndo("Einfügen in "+def.label);
  while(list.length<rowsNeeded)list.push(calcNewRow(key));
  let bad=0;
  lines.forEach((line,r)=>{
    const row=list[i0+r];if(!row)return;
    line.split("\t").forEach((cell,k)=>{
      const fd=fields[start+k];if(!fd)return;
      const t=fd[1],raw=cell.trim();
      if(t==="text"){row[fd[0]]=raw.slice(0,200);return;}
      if(t==="date"){const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(raw);row[fd[0]]=m?m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):(/^\d{4}-\d{2}-\d{2}$/.test(raw)?raw:"");return;}
      if(t==="check"){row[fd[0]]=/^(x|ja|j|1|wahr|true|yes)$/i.test(raw);return;}
      if(t==="sel"){const hit=fd[2].find(o=>o.toLowerCase()===raw.toLowerCase());if(hit)row[fd[0]]=hit;else if(raw)bad++;return;}
      const n=calcParse(raw);
      if(n===null)row[fd[0]]=0;else if(Number.isNaN(n))bad++;else row[fd[0]]=Math.min(fd[3],Math.max(fd[2],n));
    });
  });
  calcRerenderAll();persistState();
  showNotice(lines.length+(lines.length===1?" Zeile":" Zeilen")+" in "+def.label+" eingefügt"+(bad?"; "+bad+" Werte passten nicht zur Spalte und wurden übersprungen.":"."),5000);
}
function calcRowAction(btn){

function calcKeydown(ev){
  const el=ev.target;
  if(!el.dataset||el.dataset.cl===undefined||!el.dataset.cf||ev.altKey||ev.ctrlKey||ev.metaKey||el.tagName==="SELECT")return;
  const down=ev.key==="Enter"&&!ev.shiftKey||ev.key==="ArrowDown",up=ev.key==="ArrowUp"||ev.key==="Enter"&&ev.shiftKey;
  if(!down&&!up)return;
  const key=el.dataset.cl,i=+el.dataset.ci,cc=el.dataset.cc,n=calcList(key).length;
  const target=up?i-1:i+1;
  if(target<0)return;
  ev.preventDefault();
  // Wie in Excel: Zielzelle markiert, Eingabe überschreibt
  const focusRow=r=>{const f=document.querySelector('[data-cl="'+key+'"][data-ci="'+r+'"][data-cc="'+cc+'"]');if(f){f.focus();try{f.select();}catch(e){}}};
  if(target<n){focusRow(target);return;}
  if(ev.key!=="Enter"||n>=CALC_MAX_ROWS)return;
  el.blur(); // übernimmt den Wert (change) vor dem Neuaufbau
  pushUndo("Zeile angelegt ("+CALC_LISTS[key].label+")");
  calcList(key).push(calcNewRow(key));
  calcRerenderAll();persistState();focusRow(target);
}

function calcCopyText(text,okMsg){
  const fallback=()=>{
    const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();
    showNotice(ok?okMsg:"Kopieren nicht möglich. Bitte die Werte im Druckfenster markieren und kopieren.",5000);
  };
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>showNotice(okMsg,5000),fallback);
  else fallback();
}

/* ---- Vorlagen: Basisdaten, Tarifgruppen, Auswahllisten, Auswertung ---- */
const CALC_TPL_KEY="kalkulationstool-vorlage";
function calcTemplateFrom(c){return {tool:"Kalkulationstool-Vorlage",toolVersion:APP_VERSION,base:c.base,grades:c.grades,lists:c.lists,eval:c.eval};}
function calcValidateTemplate(t){
  if(!isPlainObject(t)||t.tool!=="Kalkulationstool-Vorlage")throw new Error("Die Datei ist keine Vorlage des Kalkulationstools.");
  assertSafeImportTree(t,0);
  for(const k of Object.keys(t))if(!["tool","toolVersion","base","grades","lists","eval"].includes(k))throw new Error("Unbekanntes Feld "+k+" in der Vorlage.");
  validateCalc({base:t.base,grades:t.grades,lists:t.lists,eval:t.eval},"Vorlage");
  return t;
}
function calcApplyTemplate(c,t){
  const next=deepMerge(calcDefaults(),{base:t.base||{},lists:t.lists||{},eval:t.eval||{}});
  c.base=next.base;c.lists=next.lists;c.eval=next.eval;
  if(Array.isArray(t.grades))c.grades=JSON.parse(JSON.stringify(t.grades));
  const tmp={calc:c};normalizeCalc(tmp);return tmp.calc;
}
function calcDefaultTemplate(){
  try{const raw=localStorage.getItem(CALC_TPL_KEY);return raw?calcValidateTemplate(JSON.parse(raw)):null;}catch(e){return null;}
}
// Neue Kalkulation: Standardvorlage, falls hinterlegt
function calcNewCalc(){
  const c=calcDefaults(),t=calcDefaultTemplate();
  return t?calcApplyTemplate(c,t):c;
}
function calcTemplateSave(){
  const t=calcTemplateFrom(S.calc);
  downloadBlob(new Blob([JSON.stringify(t,null,2)],{type:"application/json"}),"Kalkulationsvorlage.json");
  showNotice("Vorlage gespeichert (Basisdaten, Tarifgruppen, Auswahllisten, Auswertung).",5000);
}
function calcTemplateLoadText(txt){
  try{
    let t;try{t=JSON.parse(txt);}catch(e){throw new Error("Die Datei ist kein gültiges JSON.");}
    calcValidateTemplate(t);
    pushUndo("Vorlage geladen");
    S.calc=calcApplyTemplate(S.calc,t);
    calcRerenderAll();persistState();
    showNotice("Vorlage übernommen. Projektdaten, Personal- und Sachkosten bleiben unverändert.",5000);
    return true;
  }catch(e){alert("Vorlage wurde nicht übernommen: "+e.message);return false;}
}
function calcTemplateDefault(clear){
  try{
    if(clear)localStorage.removeItem(CALC_TPL_KEY);
    else localStorage.setItem(CALC_TPL_KEY,JSON.stringify(calcTemplateFrom(S.calc)));
    showNotice(clear?"Standardvorlage entfernt.":"Basisdaten, Tarifgruppen, Auswahllisten und Auswertung gelten ab jetzt als Standard für neue Kalkulationen in diesem Browser.",5000);
  }catch(e){alert("Die Vorlage konnte im Browser nicht gespeichert werden.");}
  calcRerenderAll();
}

/* ---- Excel-Export (.xlsx, ohne Bibliothek: Office Open XML in einem ZIP ohne Kompression) ---- */
const CALC_CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),d=typeof f.data==="string"?enc.encode(f.data):f.data,crc=calcCrc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,d);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(8,0x0800,true);cd.setUint16(14,0x21,true);
    cd.setUint32(16,crc,true);cd.setUint32(20,d.length,true);cd.setUint32(24,d.length,true);cd.setUint16(28,name.length,true);cd.setUint32(42,offset,true);
    central.push(new Uint8Array(cd.buffer),name);
    offset+=30+name.length+d.length;
  }
  const size=central.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function calcAuditVal(v,type){
  if(v==null||v==="")return "–";
  if(typeof v==="boolean")return v?"ja":"nein";
  if(type==="date")return fmtDate(v);
  if(typeof v==="number"){const dec=(String(v).split(".")[1]||"").length;return fmt(v,Math.min(4,dec))+(type==="pct"?" %":"");}
  return String(v);
}
function calcAuditRow(def,r){
  return def.fields.filter(([f,t])=>t!=="years"&&f!=="note"&&f!=="name"&&r[f]!==""&&r[f]!=null&&r[f]!==false&&r[f]!==0)
    .map(([f,t])=>(CALC_FIELD_LABELS[f]||f)+" "+calcAuditVal(r[f],t)).join("; ")||"leer";

// Unterschiede zwischen zwei Ständen als lesbare Einträge
function calcAuditDiff(a,b){
  const out=[],push=(area,item,field,from,to)=>out.push({area,item,field,from,to});
  const scalars=(area,labels,x,y,typeOf)=>{for(const k of Object.keys(labels)){const u=(x||{})[k],v=(y||{})[k];if(JSON.stringify(u)!==JSON.stringify(v))push(area,"",labels[k],calcAuditVal(u,typeOf(k)),calcAuditVal(v,typeOf(k)));}};
  scalars("Projektdaten",{name:"Projektname",kunde:"Kundenname"},a.meta,b.meta,()=>"text");
  scalars("Projektdaten",CALC_REQ_LABELS,a.request,b.request,k=>k==="sop"||k==="eop"?"date":"text");
  const ca=a.calc||{},cb=b.calc||{};
  if((ca.calcDate||"")!==(cb.calcDate||""))push("Projektdaten","","Datum Kalkulation",calcAuditVal(ca.calcDate,"date"),calcAuditVal(cb.calcDate,"date"));
  if(!!ca.excelMode!==!!cb.excelMode)push("Rechenmodus","","Excel-kompatibel",calcAuditVal(!!ca.excelMode),calcAuditVal(!!cb.excelMode));
  scalars("Basisdaten",CALC_BASE_LABELS,ca.base,cb.base,k=>CALC_BASE_PCT.has(k)?"pct":"num");
  const ra=(ca.base||{}).raises||{},rb=(cb.base||{}).raises||{};
  for(const y of new Set([...Object.keys(ra),...Object.keys(rb)]))if(ra[y]!==rb[y])push("Basisdaten","Tariferhöhung "+y,"Satz",calcAuditVal(ra[y],"pct"),calcAuditVal(rb[y],"pct"));
  scalars("Auswertung",CALC_EVAL_LABELS,ca.eval,cb.eval,k=>["priceIndex","discount","minMargin","sensi"].includes(k)?"pct":"num");
  scalars("Dokumentation",CALC_DOC_LABELS,ca.doc,cb.doc,k=>k==="reviewDate"?"date":"text");
  scalars("OtO-Werte",CALC_OTO_LABELS,ca.oto,cb.oto,k=>k==="date"?"date":k==="rate"?"num":"text");
  for(const [k,label] of Object.entries(CALC_CHOICES)){const u=((ca.lists||{})[k]||[]).join(", "),v=((cb.lists||{})[k]||[]).join(", ");if(u!==v)push("Auswahllisten",label,"Einträge",u||"–",v||"–");}
  for(const key of CALC_AUDIT_LISTS){
    const def=CALC_LISTS[key],la=getP(a,def.path)||[],lb=getP(b,def.path)||[],area=def.label,nm=(r,i)=>String(r&&r.name||"").trim()||"Zeile "+(i+1);
    const ja=la.map(r=>JSON.stringify(r)),jb=lb.map(r=>JSON.stringify(r));
    if(ja.join("\n")===jb.join("\n"))continue;
    if(la.length===lb.length&&[...ja].sort().join("\n")===[...jb].sort().join("\n")){push(area,"","Reihenfolge geändert","","");continue;}
    // Unveränderte Zeilen über den Inhalt zuordnen; übrige paarweise als Änderung, Rest als angelegt bzw. entfernt
    const left=new Map();ja.forEach(j=>left.set(j,(left.get(j)||0)+1));
    const added=[];lb.forEach((r,i)=>{const j=jb[i];if(left.get(j))left.set(j,left.get(j)-1);else added.push([r,i]);});
    const removed=[];la.forEach((r,i)=>{const j=ja[i];if(left.get(j)>0){left.set(j,left.get(j)-1);removed.push([r,i]);}});
    const pairs=Math.min(added.length,removed.length);
    for(let k=0;k<pairs;k++){
      const [rowA]=removed[k],[rowB,i]=added[k];
      for(const [f,t] of def.fields){
        if(t==="years"){
          const ya=rowA[f]||{},yb=rowB[f]||{};
          for(const y of new Set([...Object.keys(ya),...Object.keys(yb)]))if(ya[y]!==yb[y])push(area,nm(rowB,i),"FTE "+y,calcAuditVal(ya[y]),calcAuditVal(yb[y]));
        }else if(JSON.stringify(rowA[f])!==JSON.stringify(rowB[f]))push(area,nm(f==="name"&&String(rowA.name||"").trim()?rowA:rowB,i),CALC_FIELD_LABELS[f]||f,calcAuditVal(rowA[f],t),calcAuditVal(rowB[f],t));
      }
    }
    for(const [r,i] of removed.slice(pairs))push(area,nm(r,i),"Zeile entfernt",calcAuditRow(def,r),"–");
    for(const [r,i] of added.slice(pairs))push(area,nm(r,i),"Zeile angelegt","–",calcAuditRow(def,r));
  }
  return out;
}
function calcAuditUserName(){

// Änderung protokollieren: prev = Stand davor (Objekt), action = Anlass (leer: Feldeingabe, nur bei Unterschieden)
function calcAuditCommit(prev,action){
  if(!prev||!S.calc)return 0;
  const diff=calcAuditDiff(prev,S);
  if(!diff.length&&!action)return 0;
  let delta=null;
  try{if(prev.calc){const d=computeCalc(S).sum.pa.umv-computeCalc(prev).sum.pa.umv;delta=Math.abs(d)<0.005?0:d;}}catch(e){}
  const base={ts:new Date().toISOString(),user:calcAuditUserName(),version:String((S.calc.doc||{}).version||""),action:action||"Eingabe",note:""};
  let entries;
  if(diff.length>15){
    const areas=[...new Set(diff.map(x=>x.area))];
    entries=[Object.assign({},base,{area:areas.length===1?areas[0]:"Mehrere Bereiche",item:"",field:diff.length+" Änderungen",from:"",to:areas.join(", ")})];
  }else if(!diff.length)entries=[Object.assign({},base,{area:"",item:"",field:"",from:"",to:""})];
  else entries=diff.map(x=>Object.assign({},base,x));
  entries.forEach((e,i)=>{e.delta=i===0?delta:null;});
  const log=Array.isArray(S.audit)?S.audit:[];
  S.audit=log.concat(entries);
  if(S.audit.length>CALC_AUDIT_MAX)S.audit=S.audit.slice(-CALC_AUDIT_MAX);
  return entries.length;
}
function validateAudit(list){
  if(list==null)return;
  if(!Array.isArray(list)||list.length>CALC_AUDIT_MAX)throw new Error("Das Änderungsprotokoll darf höchstens "+CALC_AUDIT_MAX+" Einträge enthalten.");
  list.forEach((e,i)=>{
    if(!isPlainObject(e))throw new Error("Änderungsprotokoll, Eintrag "+(i+1)+" ist ungültig.");
    for(const [k,v] of Object.entries(e)){
      if(!CALC_AUDIT_FIELDS.includes(k))throw new Error("Änderungsprotokoll, Eintrag "+(i+1)+": unbekanntes Feld "+k+".");
      if(k==="delta"?!(v===null||calcIsNum(v)):(typeof v!=="string"||v.length>2000))throw new Error("Änderungsprotokoll, Eintrag "+(i+1)+": "+k+" ist ungültig.");
    }
  });
}

  const rows=calcAuditRowsFiltered(),shown=rows.slice(0,CALC_AUDIT_SHOW);
