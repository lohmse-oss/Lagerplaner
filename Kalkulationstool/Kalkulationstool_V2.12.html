let HELP_ON=true;
const helpLang=()=>APP_LANG==="en"?"en":"de";
function helpClosed(){try{return new Set(JSON.parse(localStorage.getItem("kalkulation-help-closed")||"[]"));}catch(e){return new Set();}}
function calcHelpBox(n){
  const h=CALC_HELP[n];if(!h)return "";
  const x=h[helpLang()],open=!helpClosed().has(n);
  return '<details class="help-box" data-help="'+n+'" data-no-i18n'+(open?' open':'')+'><summary><span class="help-ico" aria-hidden="true">?</span>'+escH(x.t)+'</summary><div class="help-body">'+
    '<ol>'+x.steps.map(s=>'<li>'+escH(s)+'</li>').join("")+'</ol>'+(x.tips&&x.tips.length?'<ul class="help-tips">'+x.tips.map(s=>'<li>'+escH(s)+'</li>').join("")+'</ul>':'')+'</div></details>';
}
function calcGuideHtml(print){
  const g=CALC_GUIDE[helpLang()];
  const sec=s=>'<section class="guide-sec"><h4>'+escH(s.h)+'</h4>'+(s.p||[]).map(t=>'<p>'+escH(t)+'</p>').join("")+
    (s.ul?'<ul>'+s.ul.map(t=>'<li>'+escH(t)+'</li>').join("")+'</ul>':'')+(s.ol?'<ol>'+s.ol.map(t=>'<li>'+escH(t)+'</li>').join("")+'</ol>':'')+'</section>';
  if(print)return '<p>'+escH(g.sub)+'</p>'+g.sec.map(s=>sec(s).replace(/<h4>/g,"<h2>").replace(/<\/h4>/g,"</h2>")).join("");
  return '<div class="card guide" id="calc-guide" data-no-i18n><div class="guide-head"><h3>'+escH(g.t)+'</h3><button type="button" class="btn" id="calc-guide-print">'+escH(APP_LANG==="en"?"Print procedure":"Anweisung drucken")+'</button></div>'+
    '<p class="hint">'+escH(g.sub)+'</p>'+g.sec.map((s,i)=>'<details class="guide-det"'+(i===2?' open':'')+'><summary>'+escH(s.h)+'</summary>'+sec(s).replace(/<h4>[^<]*<\/h4>/,"")+'</details>').join("")+'</div>';
}
function calcGuidePrint(){openPrintWindow(CALC_GUIDE[helpLang()].t,'<div data-no-i18n>'+calcGuideHtml(true)+'</div>');}
function setHelp(on){
  HELP_ON=!!on;document.body.classList.toggle("help-off",!HELP_ON);
  const b=$("btn-help");if(b)b.setAttribute("aria-pressed",String(HELP_ON));
  try{localStorage.setItem("kalkulation-help",HELP_ON?"1":"0");}catch(e){}
}
function bindHelp(){
  let on=true;try{on=localStorage.getItem("kalkulation-help")!=="0";}catch(e){}
  setHelp(on);
  $("btn-help").addEventListener("click",()=>setHelp(!HELP_ON));
  // Auf- und Zuklappen je Register merken
  document.addEventListener("toggle",ev=>{
    const d=ev.target;if(!d.matches||!d.matches("details.help-box"))return;
    const s=helpClosed();if(d.open)s.delete(d.dataset.help);else s.add(d.dataset.help);
    try{localStorage.setItem("kalkulation-help-closed",JSON.stringify([...s]));}catch(e){}
  },true);
  document.addEventListener("click",ev=>{if(ev.target.closest("#calc-guide-print"))calcGuidePrint();});
}

/* Register Projekt & Basisdaten */
function calcProjectHtml(r){
  const P=r.period,b="calc.base.",pin=(k,label)=>calcInput(b+k,"pct",{min:CALC_BASE_FIELDS[k][0],max:CALC_BASE_FIELDS[k][1],label});
  const nin=(k,label)=>calcInput(b+k,"num",{min:CALC_BASE_FIELDS[k][0],max:CALC_BASE_FIELDS[k][1],label});
  const jump='<nav class="basis-jump" aria-label="Bereiche der Basisdaten"><a href="#calc-card-project">Projekt</a><a href="#calc-card-pricing">Zuschläge</a><a href="#calc-card-worktime">Arbeitszeit</a><a href="#calc-card-escalation">Steigerungen</a><a href="#calc-card-social">Sozialversicherung</a></nav>';
  const proj=calcCard("Projektdaten","Allgemeine Projektdaten. Start und Ende der Leistung bestimmen die Laufzeit und die Monatsanteile je Kalenderjahr. Projektdaten lassen sich über Datei › Projektdaten aus Lagerplaner-Planungsdatei übernehmen.",
    '<div class="calc-form">'+
    calcField("Projektname",calcInput("meta.name","text",{label:"Projektname"}))+calcField("Kundenname",calcInput("meta.kunde","text",{label:"Kundenname"}))+
    calcField("Projektstandort",calcInput("request.serviceSite","text",{label:"Projektstandort"}))+calcField("Kundenkontakt",calcInput("request.contact","text",{label:"Kundenkontakt"}))+
    calcField("Geschäftsbereich",calcInput("request.businessUnit","text",{label:"Geschäftsbereich"}))+calcField("Service-Line",calcInput("request.serviceLine","text",{label:"Service-Line",list:"calc-dl-serviceLines"}),"Auswahl aus der Liste Service-Lines (unten erweiterbar) oder freie Eingabe.")+
    calcField("Start Leistung (SOP)",calcInput("request.sop","date",{label:"Start Leistung"}))+calcField("Ende Leistung (EOP)",calcInput("request.eop","date",{label:"Ende Leistung"}))+
    calcField("Laufzeit [Monate]",'<input class="ci num" type="text" inputmode="numeric" data-calc-duration="1" aria-label="Laufzeit in Monaten" title="Ganze Monate ab Start; setzt das Leistungsende" value="'+(P.ok?escH(fmt(P.monthsTotal,P.monthsTotal%1?2:0)):"")+'"'+(S.request&&S.request.sop?'':' disabled')+'>',"Eingabe in ganzen Monaten setzt das Ende der Leistung auf den Vortag des Monatstags (z. B. 01.03.2027 + 60 Monate = 29.02.2032). Erfordert den Start.")+calcOutField("Laufzeit [Jahre]",P.ok?fmt(P.monthsTotal/12,2):"–")+
    calcField("Datum Kalkulation",calcInput("calc.calcDate","date",{label:"Datum Kalkulation"}))+calcField("Bearbeiter",calcInput("request.calculator","text",{label:"Bearbeiter"}))+
    '</div>'+calcCurrencyHtml(r)+calcWarnHtml(r)+
    '<div class="rowbtns"><button type="button" class="btn" id="calc-example">Beispielkalkulation laden</button><button type="button" class="btn danger" id="calc-reset">Kalkulation zurücksetzen</button></div>');
  const mode=calcCard("Rechenmodus","",
    '<label class="calc-check">'+calcInput("calc.excelMode","check",{label:"Excel-kompatibel rechnen"})+' <b>Excel-kompatibel rechnen</b></label>'+
    '<p class="hint">Aus: Es gelten die Korrekturen und Erweiterungen gegenüber der Excel-Vorlage. 1) Monatsanteile je Kalenderjahr tagesgenau, beliebig viele Jahre, eine einheitliche Laufzeit für Personal- und Sachkosten. 2) Gross Profit des Angebots-TO mit HV und BU als Anteil am Umsatz ohne Verhandlung. 3) Wechselkurs wirkt auf die OtO-Werte. 4) SV-Anteil je Satz mit Beitragsbemessungsgrenze. 5) Tariferhöhung zum Stichtag mit Satz je Jahr, Personalhochlauf und Volumenwachstum, FTE je Kalenderjahr. 6) Sachkostensteigerung, Kalkulationszins für Einmalkosten, Durchreichposten mit eigenem Aufschlag.<br>An: rechnet wie die Excel-Vorlage V1.0, zum Abgleich mit bestehenden Kalkulationen. Personalbedarf, Tarifgruppen und Zuschläge je Zeile wirken in beiden Modi.</p>');

  ],[null,fmt(res.rows.reduce((a,x)=>a+x.fteIn,0),2),null,null,null,null,fmt(res.F,2),null,null,null,calcEur(res.AG),calcEur(res.AH),null],

    (rows.map(x=>'<tr><td>'+escH(x.name||"–")+'</td>'+CALC_CHAIN.map(([,,k])=>tdo(e2(x[k]))).join("")+tdo(calcPct(x.svEff))+tdo(fmt(x.AF,1))+'</tr>').join("")||'<tr><td colspan="'+(CALC_CHAIN.length+3)+'" class="hint">Keine Einträge.</td></tr>')+

// Feldwert lesen und speichern; liefert false bei ungültiger Zahl
function calcStoreField(el){
  const path=el.dataset.cf,type=el.dataset.ct;
  if(el.dataset.cl!==undefined&&!calcMaterializeRow(path))return false;
  let v;
  if(type==="check")v=el.checked;
  else if(type==="sel")v=el.value;
  else if(type==="nsel")v=Number(el.value)||0;
  else if(type==="text"||type==="date"){
    v=String(el.value).slice(0,el.maxLength>0?el.maxLength:200);
    if(type==="date"&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
  }else{
    const n=calcParse(el.value);
    if(Number.isNaN(n)){el.classList.add("bad");return false;}
    el.classList.remove("bad");
    // Jahreswerte (FTE je Jahr, Tariferhöhung je Jahr): leer = Vorgabe, Eintrag entfällt
    const ym=/^(.*)\.(\d{4})$/.exec(path);
    if(ym&&/\.(fteYears|raises)$/.test(ym[1])){
      const obj=getP(S,ym[1]);
      if(n===null){if(obj)delete obj[ym[2]];delete el.dataset.clamped;return true;}
    }
    const min=el.dataset.min!==undefined?Number(el.dataset.min):-Infinity,max=el.dataset.max!==undefined?Number(el.dataset.max):Infinity;
    v=n===null?(path==="calc.oto.rate"?1:0):Math.min(max,Math.max(min,n));
    if(n!==null&&v!==n)el.dataset.clamped=fmt(v,v%1?2:0);else delete el.dataset.clamped;
    if(ym&&/\.(fteYears|raises)$/.test(ym[1])&&!isPlainObject(getP(S,ym[1])))setP(S,ym[1],{});
  }
  if(path==="calc.country")v=String(v).trim().toUpperCase().slice(0,3);
  if(path.startsWith("md.")){const m=/^md\.(\w+)\.(\d+)\./.exec(path);if(m){const row=(MD[m[1]]||[])[+m[2]];if(row)row.updated=new Date().toISOString();}}
  if(path==="calc.currency.code"){
    v=String(v).trim().toUpperCase()||"EUR";
    if(!/^[A-Z]{3}$/.test(v)){el.classList.add("bad");return false;}
    el.classList.remove("bad");if(el.value!==v)el.value=v;
    if(v==="EUR")S.calc.currency.rate=1;
  }
  if(path.startsWith("request.")){
    S.request=S.request||{};
    const k=path.slice(8),t=String(v).trim();
    if(t)S.request[k]=t;else delete S.request[k];
  }else if(path.startsWith("meta.")){S.meta[path.slice(5)]=v;}
  else setP(S,path,v);
  calcSharedChanged(path);
  return true;
}

/* Zellbereich aus Excel einfügen: Tabulator trennt Spalten, Zeilenumbruch Zeilen; fehlende Zeilen werden angelegt */
function calcPaste(ev){
  const el=ev.target;
  if(!el.dataset||el.dataset.cl===undefined||!el.dataset.cf)return;
  const text=(ev.clipboardData&&ev.clipboardData.getData("text/plain"))||"";
  const lines=text.replace(/\r/g,"").replace(/\n+$/,"").split("\n");
  if(lines.length<2&&!/\t/.test(text))return;
  ev.preventDefault();
  const key=el.dataset.cl,def=CALC_LISTS[key],i0=+el.dataset.ci,c0=+el.dataset.cc;
  const fields=def.fields.filter(f=>f[1]!=="years"),start=fields.findIndex(f=>f===def.fields[c0]);
  const list=calcList(key),rowsNeeded=Math.min(CALC_MAX_ROWS,i0+lines.length);
  pushUndo("Einfügen in "+def.label);
  while(list.length<rowsNeeded)list.push(calcNewRow(key));
  let bad=0;
  lines.forEach((line,r)=>{
    const row=list[i0+r];if(!row)return;
    line.split("\t").forEach((cell,k)=>{
      const fd=fields[start+k];if(!fd)return;
      const t=fd[1],raw=cell.trim();
      if(t==="text"){row[fd[0]]=raw.slice(0,200);return;}
      if(t==="date"){const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(raw);row[fd[0]]=m?m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):(/^\d{4}-\d{2}-\d{2}$/.test(raw)?raw:"");return;}
      if(t==="check"){row[fd[0]]=/^(x|ja|j|1|wahr|true|yes)$/i.test(raw);return;}
      if(t==="sel"){const hit=fd[2].find(o=>o.toLowerCase()===raw.toLowerCase());if(hit)row[fd[0]]=hit;else if(raw)bad++;return;}
      const n=calcParse(raw);
      if(n===null)row[fd[0]]=0;else if(Number.isNaN(n))bad++;else row[fd[0]]=Math.min(fd[3],Math.max(fd[2],n));
    });
  });
  calcRerenderAll();persistState();
  showNotice(lines.length+(lines.length===1?" Zeile":" Zeilen")+" in "+def.label+" eingefügt"+(bad?"; "+bad+" Werte passten nicht zur Spalte und wurden übersprungen.":"."),5000);
}
function calcRowAction(btn){
  const act=btn.dataset.calcAct,key=btn.dataset.cl,def=CALC_LISTS[key],list=calcList(key),i=+btn.dataset.ci;
  if(act==="add"){
    if(list.length>=CALC_MAX_ROWS){alert("Höchstens "+CALC_MAX_ROWS+" Zeilen je Liste.");return;}
    pushUndo("Zeile angelegt ("+def.label+")");list.push(calcNewRow(key));
  }else if(act==="del"){pushUndo("Zeile gelöscht ("+def.label+")");list.splice(i,1);}
  else if(act==="dup"){
    if(list.length>=CALC_MAX_ROWS){alert("Höchstens "+CALC_MAX_ROWS+" Zeilen je Liste.");return;}
    pushUndo("Zeile dupliziert ("+def.label+")");list.splice(i+1,0,JSON.parse(JSON.stringify(list[i])));
  }else if(act==="up"||act==="down"){
    const j=act==="up"?i-1:i+1;if(j<0||j>=list.length)return;
    pushUndo("Zeile verschoben ("+def.label+")");[list[i],list[j]]=[list[j],list[i]];
  }
  setP(S,def.path,list);
  calcRerenderAll();persistState();
  // Neue Zeile: Fokus ins erste Feld
  if(act==="add"||act==="dup"){
    const row=act==="add"?list.length-1:i+1;
    const f=document.querySelector('[data-cl="'+key+'"][data-ci="'+row+'"][data-cc="0"]');if(f)f.focus();
  }
}

/* Tastatur in Listentabellen wie in Excel: Enter und Pfeil ab in die nächste Zeile (Enter in der letzten legt eine an), Pfeil auf zurück */
function calcKeydown(ev){
  const el=ev.target;
  if(!el.dataset||el.dataset.cl===undefined||!el.dataset.cf||ev.altKey||ev.ctrlKey||ev.metaKey||el.tagName==="SELECT")return;
  const down=ev.key==="Enter"&&!ev.shiftKey||ev.key==="ArrowDown",up=ev.key==="ArrowUp"||ev.key==="Enter"&&ev.shiftKey;
  if(!down&&!up)return;
  const key=el.dataset.cl,i=+el.dataset.ci,cc=el.dataset.cc,n=calcRowsShown(calcList(key).length);
  const target=up?i-1:i+1;
  if(target<0)return;
  ev.preventDefault();
  // Wie in Excel: Zielzelle markiert, Eingabe überschreibt
  const focusRow=r=>{const f=document.querySelector('[data-cl="'+key+'"][data-ci="'+r+'"][data-cc="'+cc+'"]');if(f){f.focus();try{f.select();}catch(e){}}};
  if(target<n){focusRow(target);return;}
  if(ev.key!=="Enter"||n>=CALC_MAX_ROWS||calcList(key).length<n)return; // letzte Leerzeile: neue Zeilen entstehen mit der Eingabe
  el.blur(); // übernimmt den Wert (change) vor dem Neuaufbau
  pushUndo("Zeile angelegt ("+CALC_LISTS[key].label+")");
  calcList(key).push(calcNewRow(key));
  calcRerenderAll();persistState();focusRow(target);
}

const CALC_CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

const calcAuditUd=v=>CALC_AUDIT_TOOL_VALUES.has(String(v))?"":"ud";
function calcAuditVal(v,type){
  if(v==null||v==="")return "–";

  if(type==="date")return fmtDate(v);
  if(type==="residualMode")return Number(v)===1?"Übernahme durch den Kunden":"Verwertung zum Restwert";

  return String(v);
}
function calcAuditRow(def,r){

    .map(([f,t])=>(CALC_FIELD_LABELS[f]||f)+" "+calcAuditVal(r[f],t)).join("; ")||"leer";

// Unterschiede zwischen zwei Ständen als lesbare Einträge
function calcAuditDiff(a,b){
  const out=[],push=(area,item,field,from,to)=>out.push({area,item,field,from,to});
  const scalars=(area,labels,x,y,typeOf)=>{for(const k of Object.keys(labels)){const u=(x||{})[k],v=(y||{})[k];if(JSON.stringify(u)!==JSON.stringify(v))push(area,"",labels[k],calcAuditVal(u,typeOf(k)),calcAuditVal(v,typeOf(k)));}};
  scalars("Projektdaten",{name:"Projektname",kunde:"Kundenname"},a.meta,b.meta,()=>"text");
  scalars("Projektdaten",CALC_REQ_LABELS,a.request,b.request,k=>k==="sop"||k==="eop"?"date":"text");
  const ca=a.calc||{},cb=b.calc||{};
  if((ca.calcDate||"")!==(cb.calcDate||""))push("Projektdaten","","Datum Kalkulation",calcAuditVal(ca.calcDate,"date"),calcAuditVal(cb.calcDate,"date"));
  if(!!ca.excelMode!==!!cb.excelMode)push("Rechenmodus","","Excel-kompatibel",calcAuditVal(!!ca.excelMode),calcAuditVal(!!cb.excelMode));
  scalars("Projektdaten",{code:"Kalkulationswährung",rate:"Wechselkurs (1 EUR = x)",date:"Kursdatum"},ca.currency,cb.currency,k=>k==="date"?"date":k==="rate"?"num":"text");
  scalars("Basisdaten",CALC_BASE_LABELS,ca.base,cb.base,k=>k==="residualMode"?"residualMode":CALC_BASE_PCT.has(k)?"pct":"num");
  const ra=(ca.base||{}).raises||{},rb=(cb.base||{}).raises||{};
  for(const y of new Set([...Object.keys(ra),...Object.keys(rb)]))if(ra[y]!==rb[y])push("Basisdaten","Tariferhöhung "+y,"Satz",calcAuditVal(ra[y],"pct"),calcAuditVal(rb[y],"pct"));
  scalars("Auswertung",CALC_EVAL_LABELS,ca.eval,cb.eval,k=>["priceIndex","discount","minMargin","sensi"].includes(k)?"pct":"num");
  scalars("Dokumentation",CALC_DOC_LABELS,ca.doc,cb.doc,k=>k==="reviewDate"?"date":"text");
  scalars("OtO-Werte",CALC_OTO_LABELS,ca.oto,cb.oto,k=>k==="date"?"date":k==="rate"?"num":"text");
  for(const [k,label] of Object.entries(CALC_CHOICES)){const u=((ca.lists||{})[k]||[]).join(", "),v=((cb.lists||{})[k]||[]).join(", ");if(u!==v)push("Auswahllisten",label,"Einträge",u||"–",v||"–");}
  for(const key of CALC_AUDIT_LISTS){
    const def=CALC_LISTS[key],la=getP(a,def.path)||[],lb=getP(b,def.path)||[],area=def.label,nm=(r,i)=>String(r&&r.name||"").trim()||"Zeile "+(i+1);
    const ja=la.map(r=>JSON.stringify(r)),jb=lb.map(r=>JSON.stringify(r));
    if(ja.join("\n")===jb.join("\n"))continue;
    if(la.length===lb.length&&[...ja].sort().join("\n")===[...jb].sort().join("\n")){push(area,"","Reihenfolge geändert","","");continue;}
    // Unveränderte Zeilen über den Inhalt zuordnen; übrige paarweise als Änderung, Rest als angelegt bzw. entfernt
    const left=new Map();ja.forEach(j=>left.set(j,(left.get(j)||0)+1));
    const added=[];lb.forEach((r,i)=>{const j=jb[i];if(left.get(j))left.set(j,left.get(j)-1);else added.push([r,i]);});
    const removed=[];la.forEach((r,i)=>{const j=ja[i];if(left.get(j)>0){left.set(j,left.get(j)-1);removed.push([r,i]);}});
    const pairs=Math.min(added.length,removed.length);
    for(let k=0;k<pairs;k++){
      const [rowA]=removed[k],[rowB,i]=added[k];
      for(const [f,t] of def.fields){
        if(t==="years"){
          const ya=rowA[f]||{},yb=rowB[f]||{};
          for(const y of new Set([...Object.keys(ya),...Object.keys(yb)]))if(ya[y]!==yb[y])push(area,nm(rowB,i),"FTE "+y,calcAuditVal(ya[y]),calcAuditVal(yb[y]));
        }else if(JSON.stringify(rowA[f])!==JSON.stringify(rowB[f]))push(area,nm(f==="name"&&String(rowA.name||"").trim()?rowA:rowB,i),CALC_FIELD_LABELS[f]||f,calcAuditVal(rowA[f],t),calcAuditVal(rowB[f],t));
      }
    }
    for(const [r,i] of removed.slice(pairs))push(area,nm(r,i),"Zeile entfernt",calcAuditRow(def,r),"–");
    for(const [r,i] of added.slice(pairs))push(area,nm(r,i),"Zeile angelegt","–",calcAuditRow(def,r));
  }
  return out;
}
function calcAuditUserName(){

// Änderung protokollieren: prev = Stand davor (Objekt), action = Anlass (leer: Feldeingabe, nur bei Unterschieden)
function calcAuditCommit(prev,action){
  if(!prev||!S.calc)return 0;
  const diff=calcAuditDiff(prev,S);
  if(!diff.length&&!action)return 0;
  let delta=null;
  try{if(prev.calc){const d=computeCalc(S).sum.pa.umv-computeCalc(prev).sum.pa.umv;delta=Math.abs(d)<0.005?0:d;}}catch(e){}
  const base={ts:new Date().toISOString(),user:calcAuditUserName(),version:String((S.calc.doc||{}).version||""),action:action||"Eingabe",note:""};
  let entries;
  if(diff.length>15){
    const areas=[...new Set(diff.map(x=>x.area))];
    entries=[Object.assign({},base,{area:areas.length===1?areas[0]:"Mehrere Bereiche",item:"",field:diff.length+" Änderungen",from:"",to:areas.join(", ")})];
  }else if(!diff.length)entries=[Object.assign({},base,{area:"",item:"",field:"",from:"",to:""})];
  else entries=diff.map(x=>Object.assign({},base,x));
  entries.forEach((e,i)=>{e.delta=i===0?delta:null;});
  const log=Array.isArray(S.audit)?S.audit:[];
  S.audit=log.concat(entries);
  if(S.audit.length>CALC_AUDIT_MAX)S.audit=S.audit.slice(-CALC_AUDIT_MAX);
  return entries.length;
}
function validateAudit(list){
  if(list==null)return;
  if(!Array.isArray(list)||list.length>CALC_AUDIT_MAX)throw new Error("Das Änderungsprotokoll darf höchstens "+CALC_AUDIT_MAX+" Einträge enthalten.");
  list.forEach((e,i)=>{
    if(!isPlainObject(e))throw new Error("Änderungsprotokoll, Eintrag "+(i+1)+" ist ungültig.");
    for(const [k,v] of Object.entries(e)){
      if(!CALC_AUDIT_FIELDS.includes(k))throw new Error("Änderungsprotokoll, Eintrag "+(i+1)+": unbekanntes Feld "+k+".");
      if(k==="delta"?!(v===null||calcIsNum(v)):(typeof v!=="string"||v.length>2000))throw new Error("Änderungsprotokoll, Eintrag "+(i+1)+": "+k+" ist ungültig.");
    }
  });
}

// Projektkopf: Felder mit denselben Schlüsseln wie die Projekt- und Anfragedaten des Lagerplaners
const CALC_REQUEST_FIELDS={serviceSite:"text",contact:"text",businessUnit:"text",serviceLine:"text",sop:"date",eop:"date",calculator:"text",sfId:"text"};
function defaults(){
  return {schemaVersion:1,tool:"Kalkulationstool",toolVersion:APP_VERSION,meta:{name:"",kunde:""},request:{},calc:calcDefaults(),variants:[],audit:[]};
}
let S=defaults();
function validateRequestFields(req,label){
  if(req==null)return;
  if(!isPlainObject(req))throw new Error(label+" muss ein Objekt sein.");
  for(const [k,v] of Object.entries(req)){
    if(!CALC_REQUEST_FIELDS[k])throw new Error(label+": unbekanntes Feld "+k+".");
    if(typeof v!=="string"||v.length>200)throw new Error(label+"."+k+" muss Text mit höchstens 200 Zeichen sein.");
    if(CALC_REQUEST_FIELDS[k]==="date"&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))throw new Error(label+"."+k+" muss ein Datum (JJJJ-MM-TT) sein.");
  }
}
function validateFile(obj){
  if(!isPlainObject(obj))throw new Error("Die Datei muss ein JSON-Objekt enthalten.");
  assertSafeImportTree(obj,0);
  const allowed=new Set(Object.keys(defaults()));
  for(const k of Object.keys(obj))if(!allowed.has(k))throw new Error("Unbekanntes Feld "+k+". Ist das eine Kalkulationsdatei?");
  if(obj.meta!=null){
    if(!isPlainObject(obj.meta))throw new Error("meta muss ein Objekt sein.");
    for(const [k,v] of Object.entries(obj.meta))if(!["name","kunde"].includes(k)||typeof v!=="string"||v.length>200)throw new Error("meta."+k+" ist ungültig.");
  }
  for(const k of ["tool","toolVersion"])if(obj[k]!=null&&(typeof obj[k]!=="string"||obj[k].length>50))throw new Error(k+" ist ungültig.");
  validateRequestFields(obj.request,"Projektdaten");
  validateCalc(obj.calc,"Kalkulation");
  validateAudit(obj.audit);
  if(obj.variants!=null){
    if(!Array.isArray(obj.variants)||obj.variants.length>CALC_MAX_VARIANTS)throw new Error("Höchstens "+CALC_MAX_VARIANTS+" Varianten.");
    obj.variants.forEach((v,i)=>{
      const where="Variante "+(i+1);
      if(!isPlainObject(v)||typeof v.name!=="string"||v.name.length>80||(v.date!=null&&(typeof v.date!=="string"||v.date.length>40))||!isPlainObject(v.data))throw new Error(where+" ist ungültig.");
      for(const k of Object.keys(v))if(!["name","date","data"].includes(k))throw new Error(where+": unbekanntes Feld "+k+".");
      for(const k of Object.keys(v.data))if(!["meta","request","calc"].includes(k))throw new Error(where+": unbekanntes Feld "+k+".");
      if(v.data.meta!=null)for(const [k,x] of Object.entries(v.data.meta))if(!["name","kunde"].includes(k)||typeof x!=="string"||x.length>200)throw new Error(where+": meta."+k+" ist ungültig.");
      validateRequestFields(v.data.request,where+" · Projektdaten");
      validateCalc(v.data.calc,where+" · Kalkulation");
    });
  }
  return obj;
}
// Datei oder Browserstand übernehmen; liefert die Reparaturen
// Stände V2.3 bis V2.10 legten Investitionszeilen mit Nutzungsdauer 1 und Startjahr 1 an (Mindestwert 1);
// das verteilte die Investition auf das erste Jahr. Unveränderte Vorgaben werden auf 0 = über die Laufzeit zurückgesetzt.
function calcMigrateCapex(calc,ver,fixed,where){
  if(!/^V2\.([3-9]|10)$/.test(String(ver||"")))return;
  (calc.capex||[]).forEach((row,i)=>{
    if(Number(row.usefulLife)===1&&Number(row.startYear)<=1&&!(Number(row.residual)>0)&&(row.procurement||"Kauf")==="Kauf"){
      row.usefulLife=0;row.startYear=0;
      fixed.push({label:where+"Investitionen Zeile "+(i+1)+" Nutzungsdauer (Vorgabe aus "+ver+")",from:"1",to:"0 = über die Laufzeit"});
    }
  });
}
function stateFrom(obj){
  const next=deepMerge(defaults(),obj);
  next.request=Object.assign({},obj.request||{});
  const fixed=normalizeCalc(next);
  calcMigrateCapex(next.calc,obj.toolVersion,fixed,"");
  // Varianten ebenfalls vervollständigen, damit Vergleich und Laden mit allen Feldern rechnen
  next.variants=(next.variants||[]).map(v=>{const d={meta:Object.assign({name:"",kunde:""},v.data.meta||{}),request:Object.assign({},v.data.request||{}),calc:v.data.calc||{}};normalizeCalc(d);calcMigrateCapex(d.calc,obj.toolVersion,fixed,"Variante „"+v.name+"“: ");return {name:v.name,date:v.date||"",data:d};});
  return {next,fixed};
}
// Änderungsprotokoll: Aktionen mit Rückgängig-Schritt werden beim nächsten Speichern als Unterschied protokolliert
let CALC_AUDIT_PENDING=null;
function calcAuditFlush(){
  if(!CALC_AUDIT_PENDING)return;
  const p=CALC_AUDIT_PENDING;CALC_AUDIT_PENDING=null;
  try{if(calcAuditCommit(p.prev,p.label)){STALE_PANELS.add("dokumentation");setTimeout(renderVisiblePanels,0);}}catch(e){console.warn("Änderungsprotokoll:",e);}
}
let CALC_LAST_JSON="";
function persistState(){
  calcAuditFlush();
  mdPersistIfChanged();
  S.toolVersion=APP_VERSION;
  let j;try{j=JSON.stringify(S);}catch(e){return false;}
  if(j===CALC_LAST_JSON)return true;
  CALC_LAST_JSON=j;
  if(!FILE_LOADING)fileMarkDirty(true);
  try{localStorage.setItem(LS_KEY,j);return true;}
  catch(e){console.warn("Kalkulation konnte nicht im Browser gespeichert werden:",e);return false;}
}
const UNDO=[],UNDO_MAX=30;
function pushUndo(label){
  let snap;
  try{snap=JSON.parse(JSON.stringify(S));}catch(e){return;}
  UNDO.push({label,state:snap,md:JSON.parse(JSON.stringify(MD))});
  calcAuditFlush();CALC_AUDIT_PENDING={label,prev:snap};
  if(UNDO.length>UNDO_MAX)UNDO.shift();
  updateUndoBtn();
}
function updateUndoBtn(){
  const b=$("btn-undo");

  b.title=tr(UNDO.length?"Rückgängig: "+UNDO[UNDO.length-1].label:"Rückgängig (Strg+Z)");

function undoLast(){

// Feldänderungen: Stand beim Betreten merken, beim Verlassen mit geändertem Wert als Rückgängig-Schritt ablegen
let UNDO_FOCUS_SNAP=null,UNDO_FOCUS_MD=null,UNDO_FOCUS_LABEL="",UNDO_FOCUS_EL=null;
function bindFieldUndoTracking(){
  document.addEventListener("focusin",e=>{
    const t=e.target;
    if(!t||!t.matches||!t.matches("input,select,textarea")||!t.closest("#panels"))return;
    try{UNDO_FOCUS_SNAP=JSON.stringify(S);UNDO_FOCUS_MD=JSON.stringify(MD);}catch(err){UNDO_FOCUS_SNAP=null;return;}
    UNDO_FOCUS_LABEL="Feldänderung ("+(t.getAttribute("aria-label")||"Feld")+")";
    UNDO_FOCUS_EL=t;
  });
  document.addEventListener("change",e=>{
    const t=e.target;
    if(!t||!t.matches||!t.matches("input,select,textarea"))return;
    if(t!==UNDO_FOCUS_EL&&!t.closest("#panels"))return;
    if(UNDO_FOCUS_SNAP===null)return;
    let now=null,nowMd=null;
    try{now=JSON.stringify(S);nowMd=JSON.stringify(MD);}catch(err){}
    if(nowMd!==null&&nowMd!==UNDO_FOCUS_MD&&now===UNDO_FOCUS_SNAP){
      // nur Stammdaten geändert: Rückgängig-Schritt ohne Protokolleintrag der Kalkulation
      try{UNDO.push({label:UNDO_FOCUS_LABEL,state:JSON.parse(UNDO_FOCUS_SNAP),md:JSON.parse(UNDO_FOCUS_MD)});if(UNDO.length>UNDO_MAX)UNDO.shift();updateUndoBtn();}catch(err){}
      UNDO_FOCUS_MD=nowMd;
    }
    if(now!==null&&now!==UNDO_FOCUS_SNAP){
      try{UNDO.push({label:UNDO_FOCUS_LABEL,state:JSON.parse(UNDO_FOCUS_SNAP),md:UNDO_FOCUS_MD?JSON.parse(UNDO_FOCUS_MD):undefined});if(UNDO.length>UNDO_MAX)UNDO.shift();updateUndoBtn();}catch(err){}
      UNDO_FOCUS_MD=nowMd;
      // Feldänderung protokollieren (ohne Eintrag, wenn nur Kommentare des Protokolls geändert wurden)
      try{if(calcAuditCommit(JSON.parse(UNDO_FOCUS_SNAP),"")){persistState();STALE_PANELS.add("dokumentation");setTimeout(renderVisiblePanels,0);}}catch(err){console.warn("Änderungsprotokoll:",err);}
      UNDO_FOCUS_SNAP=JSON.stringify(S);
    }
  });
}

/* ============================ Stammdaten ============================

   Nur aktuelle Werte, je Eintrag gültig von/bis. Die Kalkulation übernimmt Werte als Kopie; Zurückschreiben und Zusammenführen

    ["procurement","sel",["Kauf","Leasing","Miete"]],["usefulLife","num",0,100],...MD_VALID,["note","text"]]},

};
Object.assign(CALC_LISTS,MD_LISTS);
const MD_KEYS=Object.keys(MD_LISTS);
// Schlüssel je Eintrag für Zurückschreiben und Zusammenführen
const mdNorm=v=>String(v==null?"":v).trim().toLowerCase();
const MD_ID={mdCountries:x=>mdNorm(x.code),mdStaff:x=>[x.country,x.kind,x.name].map(mdNorm).join("|"),mdGrades:x=>[x.country,x.kind,x.name].map(mdNorm).join("|"),
  mdCosts:x=>[x.country,x.list,x.name].map(mdNorm).join("|"),mdRates:x=>[x.currency,x.validFrom].map(mdNorm).join("|")};
function mdDefaults(){return {tool:"Kalkulationstool-Stammdaten",toolVersion:APP_VERSION,updated:"",countries:[],staff:[],grades:[],costs:[],rates:[]};}
let MD=mdDefaults();
const MD_FILE={name:"",handle:null,dirty:false};
const mdList=key=>MD[MD_LISTS[key].path.slice(3)];
const mdToday=()=>new Date().toISOString().slice(0,10);
// Stichtag für die Gültigkeit: Kalkulationsdatum, sonst heute
const mdRefDate=()=>(S&&S.calc&&S.calc.calcDate&&calcIsDate(S.calc.calcDate)?S.calc.calcDate:mdToday());
const mdValid=(x,d)=>(!x.validFrom||x.validFrom<=d)&&(!x.validTo||d<=x.validTo);
const mdStatus=(x,d)=>!x.validFrom&&!x.validTo?"gültig":x.validTo&&d>x.validTo?"abgelaufen":x.validFrom&&d<x.validFrom?"ab "+fmtDate(x.validFrom):"gültig";
const mdRowEmpty=(key,x)=>!String(x.name||x.code||x.currency||"").trim();
// Prüfung einer Stammdatendatei
function mdValidate(obj){
  if(!isPlainObject(obj)||obj.tool!=="Kalkulationstool-Stammdaten")throw new Error("Die Datei ist keine Stammdatendatei des Kalkulationstools.");
  assertSafeImportTree(obj,0);
  const allowed=new Set(["tool","toolVersion","updated","countries","staff","grades","costs","rates"]);
  for(const k of Object.keys(obj))if(!allowed.has(k))throw new Error("Unbekanntes Feld "+k+" in den Stammdaten.");
  for(const key of MD_KEYS){
    const def=MD_LISTS[key],list=obj[def.path.slice(3)];
    if(list==null)continue;
    if(!Array.isArray(list)||list.length>CALC_MD_MAX)throw new Error("Stammdaten."+def.path.slice(3)+" muss eine Liste mit höchstens "+CALC_MD_MAX+" Einträgen sein.");
    const fields=new Map(def.fields.map(f=>[f[0],f]));
    list.forEach((row,i)=>{
      const where="Stammdaten."+def.path.slice(3)+", Zeile "+(i+1);
      if(!isPlainObject(row))throw new Error(where+" ist ungültig.");
      for(const [f,v] of Object.entries(row)){
        if(f==="updated"){if(typeof v!=="string"||v.length>40)throw new Error(where+": updated ist ungültig.");continue;}
        if(key==="mdCountries"&&(f==="base"||f==="eval")){validateCalc({[f]:v},where);continue;}
        const fd=fields.get(f);
        if(!fd)throw new Error(where+": unbekanntes Feld "+f+".");
        const t=fd[1],bad=t==="text"?(typeof v!=="string"||v.length>200):t==="date"?(v!==""&&!calcIsDate(v)):t==="check"?typeof v!=="boolean":t==="sel"?(typeof v!=="string"||v.length>40):!calcIsNum(v);
        if(bad)throw new Error(where+": "+f+" ist ungültig.");
      }
    });
  }
  return obj;
}
const CALC_MD_MAX=CALC_MAX_ROWS;
function mdNormalize(obj){
  const m=Object.assign(mdDefaults(),{updated:typeof obj.updated==="string"?obj.updated:""});
  for(const key of MD_KEYS){
    const def=MD_LISTS[key],name=def.path.slice(3);
    m[name]=(Array.isArray(obj[name])?obj[name]:[]).map(row=>{
      const r=Object.assign(calcNewRow(key),row);
      for(const [f,t,a,b] of def.fields){
        if(t==="num"||t==="pct"){const n=Number(r[f]);r[f]=Number.isFinite(n)?Math.min(b,Math.max(a,n)):0;}
        else if(t==="sel"&&!a.includes(r[f]))r[f]=a[0];
        else if(t==="date"&&r[f]&&!calcIsDate(r[f]))r[f]="";
      }
      if(key==="mdCountries"&&r.base){const tmp={calc:{base:r.base}};normalizeCalc(tmp);r.base=tmp.calc.base;}
      return r;
    });
  }
  return m;
}
let MD_LAST_JSON="";
// Geänderte Stammdaten: im Browser sichern und als ungespeichert markieren
function mdPersistIfChanged(){
  let j;try{j=JSON.stringify(MD);}catch(e){return;}
  if(j===MD_LAST_JSON)return;
  MD_LAST_JSON=j;MD_FILE.dirty=true;mdFileStore();
  try{localStorage.setItem(MD_KEY,j);}catch(e){console.warn("Stammdaten nicht im Browser gespeichert:",e);}
}
function mdPersist(){try{MD.toolVersion=APP_VERSION;MD_LAST_JSON=JSON.stringify(MD);localStorage.setItem(MD_KEY,MD_LAST_JSON);}catch(e){console.warn("Stammdaten nicht im Browser gespeichert:",e);}}
function mdTouch(){MD.updated=new Date().toISOString();MD_FILE.dirty=true;mdPersist();STALE_PANELS.add("stammdaten");}
// Neue Zeilen in den Stammdaten: Land der Kalkulation vorbelegen
const mdNewRowDefaults=(key,row)=>{if("country" in row&&S&&S.calc&&S.calc.country)row.country=S.calc.country;return row;};

/* ---- Verwendung in der Kalkulation ---- */
// Passender gültiger Eintrag: gleiches Land vor „alle Länder“ (Land leer)
function mdFind(key,pred){
  const d=mdRefDate(),cty=mdNorm(S.calc.country),list=mdList(key).filter(x=>pred(x)&&mdValid(x,d)&&(!mdNorm(x.country)||mdNorm(x.country)===cty));
  return list.find(x=>mdNorm(x.country)===cty)||list[0]||null;
}
// Bezeichnung in einer Kalkulationszeile gewählt: leere Felder aus den Stammdaten füllen
function mdApplyRow(key,i){
  const row=calcList(key)[i];if(!row)return;
  const nm=mdNorm(row.name);if(!nm)return;
  const filled=[];
  const set=(f,v,label)=>{if(v==null||v===""||v===0||v===false)return;const cur=row[f];if(cur==null||cur===""||cur===0||cur===false){row[f]=v;filled.push(label);}};
  if(key==="salaries"||key==="wages"){
    const kind=key==="wages"?"Lohn":"Gehalt",e=mdFind("mdStaff",x=>x.kind===kind&&mdNorm(x.name)===nm);if(!e)return;
    if(e.grade){
      const has=(S.calc.grades||[]).some(g=>g.kind===kind&&mdNorm(g.name)===mdNorm(e.grade));
      const g=has?null:mdFind("mdGrades",x=>x.kind===kind&&mdNorm(x.name)===mdNorm(e.grade));
      if(g)S.calc.grades.push(Object.assign(calcNewRow("grades"),{name:g.name,kind,rate:g.rate,note:"Stammdaten"+(g.note?": "+g.note:"")}));
      if(has||g)set("grade",e.grade,"Tarifgruppe");
    }
    set("rate",e.rate,"Satz");set("gross",e.gross,"FTE-Brutto-Zuschlag");set("extra",e.extra,"Zuschlag Zeile");
    set("note","Stammdaten"+(e.note?": "+e.note:""),"Quelle");
  }else if(MD_COST_LIST[key]){
    const e=mdFind("mdCosts",x=>x.list===MD_COST_LIST[key]&&mdNorm(x.name)===nm);if(!e)return;
    set("price",e.price,"Preis");set("category",e.category,"Kategorie");set("pass",e.pass,"Durchreichposten");
    if(key==="capex"){if(e.procurement!=="Kauf")set("procurement",e.procurement,"Beschaffung");set("usefulLife",e.usefulLife,"Nutzungsdauer");}
    set("note","Stammdaten"+(e.note?": "+e.note:""),"Quelle");
  }
  if(filled.length)showNotice("Aus den Stammdaten übernommen: "+filled.join(", ")+".",4000);
}
// Länderprofil in die Kalkulation übernehmen: Basisdaten, Auswertung, Währung mit gültigem Kurs, Tarifgruppen des Landes
function mdApplyCountry(){
  const code=mdNorm(S.calc.country),d=mdRefDate();
  if(!code){alert("Bitte zuerst das Land der Kalkulation eintragen.");return;}
  // Ohne Länderprofil: nur die gültigen Tarifgruppen des Landes ergänzen
  const p=mdList("mdCountries").find(x=>mdNorm(x.code)===code&&mdValid(x,d))||null;
  const gradesOf=mdList("mdGrades").filter(x=>(mdNorm(x.country)===code||!mdNorm(x.country))&&mdValid(x,d));
  if(!p&&!gradesOf.length){alert("Kein gültiges Länderprofil für „"+S.calc.country+"“ in den Stammdaten.");return;}
  pushUndo("Länderprofil übernommen ("+S.calc.country+")");
  const done=[];
  if(p&&isPlainObject(p.base)){S.calc.base=JSON.parse(JSON.stringify(p.base));done.push("Basisdaten");}
  if(p&&isPlainObject(p.eval)){S.calc.eval=Object.assign(S.calc.eval||{},JSON.parse(JSON.stringify(p.eval)));done.push("Auswertung");}
  const cur=p?String(p.currency||"EUR").trim().toUpperCase()||"EUR":"";
  if(p&&/^[A-Z]{3}$/.test(cur)){
    const r=cur==="EUR"?null:mdList("mdRates").filter(x=>mdNorm(x.currency)===mdNorm(cur)&&x.rate>0&&mdValid(x,d)).sort((a,b)=>String(b.validFrom).localeCompare(String(a.validFrom)))[0];
    S.calc.currency={code:cur,rate:cur==="EUR"?1:(r?r.rate:S.calc.currency.rate||1),date:cur==="EUR"?"":(r?(r.validFrom||""):S.calc.currency.date||"")};
    done.push("Währung "+cur+(r?" (Kurs "+fmt(r.rate,4)+")":""));
  }
  let ng=0;
  for(const g of gradesOf)
    if(!S.calc.grades.some(x=>x.kind===g.kind&&mdNorm(x.name)===mdNorm(g.name))){S.calc.grades.push(Object.assign(calcNewRow("grades"),{name:g.name,kind:g.kind,rate:g.rate,note:"Stammdaten"+(g.note?": "+g.note:"")}));ng++;}
  if(ng)done.push(ng+" Tarifgruppen");
  normalizeCalc(S);calcRerenderAll();persistState();
  showNotice("Länderprofil "+String(S.calc.country)+" übernommen: "+(done.join(", ")||"keine Werte hinterlegt")+(p?"":" (kein Länderprofil, nur Tarifgruppen)")+".",6000);
}
// Werte einer Kalkulationsliste in die Stammdaten schreiben (neu oder aktualisieren)
function mdTakeFromCalc(key){
  const cty=String(S.calc.country||"").trim().toUpperCase(),now=new Date().toISOString(),stat={neu:0,akt:0,gleich:0};
  const put=(mkey,entry)=>{
    const list=mdList(mkey),id=MD_ID[mkey](entry),i=list.findIndex(x=>MD_ID[mkey](x)===id);
    if(i<0){list.push(Object.assign(calcNewRow(mkey),entry,{updated:now}));stat.neu++;return;}
    const cur=list[i],next=Object.assign({},cur,entry);
    if(JSON.stringify(Object.assign({},cur,{updated:""}))===JSON.stringify(Object.assign({},next,{updated:""}))){stat.gleich++;return;}
    list[i]=Object.assign(next,{updated:now});stat.akt++;
  };
  pushUndo("In Stammdaten übernommen ("+CALC_LISTS[key].label+")");
  const rows=calcList(key).filter(x=>String(x.name||"").trim());
  if(key==="salaries"||key==="wages"){
    const kind=key==="wages"?"Lohn":"Gehalt";
    for(const x of rows)put("mdStaff",{country:cty,kind,name:x.name.trim(),grade:x.grade||"",rate:x.rate,gross:x.gross,extra:x.extra||0});
  }else if(key==="grades"){
    for(const x of rows)put("mdGrades",{country:cty,kind:x.kind,name:x.name.trim(),rate:x.rate});
  }else{
    for(const x of rows){const e={country:cty,list:MD_COST_LIST[key],name:x.name.trim(),category:x.category||"",price:x.price,pass:!!x.pass};
      if(key==="capex")Object.assign(e,{procurement:x.procurement||"Kauf",usefulLife:x.usefulLife||0});put("mdCosts",e);}
  }
  mdTouch();calcRerenderAll();persistState();
  showNotice("Stammdaten ("+CALC_LISTS[key].label+(cty?", "+cty:", alle Länder")+"): "+stat.neu+" neu, "+stat.akt+" aktualisiert, "+stat.gleich+" unverändert.",6000);
}
// Basisdaten, Auswertung, Währung und Kurs der Kalkulation als Länderprofil speichern
function mdSaveCountry(){
  let code=String(S.calc.country||"").trim().toUpperCase();
  if(!code){code=String(prompt("Land (Kürzel, z. B. DE, HU, CZ, PL, GB):","")||"").trim().toUpperCase();if(!code)return;S.calc.country=code;}
  if(!/^[A-Z]{2,3}$/.test(code)){alert("Das Land braucht ein Kürzel aus zwei oder drei Buchstaben, z. B. DE oder HU.");return;}
  pushUndo("Als Länderprofil gespeichert ("+code+")");
  const now=new Date().toISOString(),cu=calcCurrency(S.calc),list=mdList("mdCountries"),i=list.findIndex(x=>mdNorm(x.code)===mdNorm(code));
  const entry={code,currency:cu.code,base:JSON.parse(JSON.stringify(S.calc.base)),eval:JSON.parse(JSON.stringify(S.calc.eval||{})),updated:now};
  if(i<0)list.push(Object.assign(calcNewRow("mdCountries"),entry,{name:code}));else Object.assign(list[i],entry);
  if(cu.code!=="EUR"){
    const rates=mdList("mdRates"),j=rates.findIndex(x=>mdNorm(x.currency)===mdNorm(cu.code)&&(x.validFrom||"")===(cu.date||""));
    const r={currency:cu.code,rate:cu.rate,validFrom:cu.date||"",updated:now};
    if(j<0)rates.push(Object.assign(calcNewRow("mdRates"),r));else Object.assign(rates[j],r);
  }
  mdTouch();calcRerenderAll();persistState();
  showNotice("Länderprofil "+code+" in den Stammdaten gespeichert (Basisdaten, Auswertung, Währung"+(cu.code!=="EUR"?" und Kurs":"")+").",5000);
}
// Andere Stammdatendatei zusammenführen: neue Einträge ergänzen, bei Abweichung gilt der zuletzt geänderte
function mdMergeText(txt){
  try{
    let obj;try{obj=JSON.parse(txt);}catch(e){throw new Error("Die Datei ist kein gültiges JSON.");}
    const other=mdNormalize(mdValidate(obj)),stat={neu:0,akt:0,gleich:0,eigen:0};
    pushUndo("Stammdaten zusammengeführt");
    for(const key of MD_KEYS){
      const name=MD_LISTS[key].path.slice(3),list=MD[name];
      for(const x of other[name]){
        if(mdRowEmpty(key,x))continue;
        const id=MD_ID[key](x),i=list.findIndex(y=>MD_ID[key](y)===id);
        if(i<0){list.push(x);stat.neu++;continue;}
        const strip=o=>JSON.stringify(Object.assign({},o,{updated:""}));
        if(strip(list[i])===strip(x)){stat.gleich++;continue;}
        if(String(x.updated||"")>String(list[i].updated||"")){list[i]=x;stat.akt++;}else stat.eigen++;
      }
    }
    mdTouch();calcRerenderAll();persistState();
    showNotice("Stammdaten zusammengeführt: "+stat.neu+" neu, "+stat.akt+" aktualisiert, "+stat.gleich+" gleich, "+stat.eigen+" eigene neuere Einträge behalten.",7000);
    return true;
  }catch(e){alert("Stammdaten wurden nicht übernommen: "+e.message);return false;}
}
function mdLoadText(txt,name,handle){
  try{
    let obj;try{obj=JSON.parse(txt);}catch(e){throw new Error("Die Datei ist kein gültiges JSON.");}
    const next=mdNormalize(mdValidate(obj));
    if(MD_FILE.dirty&&!confirm("Ungespeicherte Änderungen an den Stammdaten verwerfen und die Datei öffnen?"))return false;
    pushUndo("Stammdaten geöffnet");
    MD=next;MD_FILE.name=name||"";MD_FILE.handle=handle||null;MD_FILE.dirty=false;mdPersist();mdFileStore();
    calcRerenderAll();
    showNotice("Stammdaten geöffnet: "+MD_KEYS.map(k=>mdList(k).length+" "+CALC_LISTS[k].label).join(", ")+".",6000);
    return true;
  }catch(e){alert("Stammdaten wurden nicht übernommen: "+e.message);return false;}
}
function mdFileStore(){try{localStorage.setItem(MD_KEY+"-file",JSON.stringify({name:MD_FILE.name,dirty:MD_FILE.dirty}));}catch(e){}}
const mdJson=()=>{MD.toolVersion=APP_VERSION;return JSON.stringify(MD,null,2);};
async function mdSave(as){
  if(!as&&MD_FILE.handle){
    try{const w=await MD_FILE.handle.createWritable();await w.write(new Blob([mdJson()],{type:"application/json"}));await w.close();MD_FILE.dirty=false;mdFileStore();STALE_PANELS.add("stammdaten");renderVisiblePanels();showNotice("Stammdaten gespeichert: "+MD_FILE.name,4000);return true;}
    catch(e){if(e&&e.name==="AbortError")return false;console.warn("Stammdaten: Schreiben fehlgeschlagen",e);}
  }
  if(window.showSaveFilePicker&&(as||!MD_FILE.name)){
    try{
      const h=await window.showSaveFilePicker({suggestedName:MD_FILE.name||"stammdaten_kalkulation.json",types:FILE_TYPES});
      const w=await h.createWritable();await w.write(new Blob([mdJson()],{type:"application/json"}));await w.close();
      MD_FILE.name=h.name;MD_FILE.handle=h;MD_FILE.dirty=false;mdFileStore();STALE_PANELS.add("stammdaten");renderVisiblePanels();
      showNotice("Stammdaten gespeichert: "+h.name,4000);return true;
    }catch(e){if(e&&e.name==="AbortError")return false;console.warn("Stammdaten: Speichern unter nicht möglich",e);}
  }
  let name=MD_FILE.name||"stammdaten_kalkulation.json";
  if(as){const n=prompt(i18nText("Dateiname für die Stammdaten:"),name);if(n===null)return false;name=n.trim().replace(/[\\/:*?"<>|]+/g,"_")||name;if(!/\.json$/i.test(name))name+=".json";}
  downloadBlob(new Blob([mdJson()],{type:"application/json"}),name);
  MD_FILE.name=name;MD_FILE.handle=null;MD_FILE.dirty=false;mdFileStore();STALE_PANELS.add("stammdaten");renderVisiblePanels();
  showNotice("Stammdaten als „"+name+"“ gespeichert (Download-Ordner).",5000);
  return true;
}
async function mdOpen(){
  if(window.showOpenFilePicker){
    try{const [h]=await window.showOpenFilePicker({types:FILE_TYPES,multiple:false});const f=await h.getFile();mdLoadText(await f.text(),f.name,h);return;}
    catch(e){if(e&&e.name==="AbortError")return;console.warn("Stammdaten: Dateiauswahl nicht möglich",e);}
  }
  $("file-md").click();
}
function mdClear(){
  if(!confirm("Alle Stammdaten in diesem Browser leeren? Gespeicherte Dateien bleiben unverändert (Rückgängig bleibt möglich)."))return;
  pushUndo("Stammdaten geleert");MD=mdDefaults();MD_FILE.name="";MD_FILE.handle=null;MD_FILE.dirty=false;mdPersist();mdFileStore();calcRerenderAll();
}
function mdInit(){
  try{const raw=localStorage.getItem(MD_KEY);if(raw)MD=mdNormalize(mdValidate(JSON.parse(raw)));}catch(e){console.warn("Stammdaten im Browser nicht lesbar:",e);}
  try{const f=JSON.parse(localStorage.getItem(MD_KEY+"-file")||"null");if(isPlainObject(f)){MD_FILE.name=typeof f.name==="string"?f.name:"";MD_FILE.dirty=f.dirty===true;}}catch(e){}
  const pick=(id,fn)=>$(id).addEventListener("change",ev=>{const inp=ev.target,f=inp.files&&inp.files[0];inp.value="";if(!f)return;const rd=new FileReader();rd.onload=()=>fn(String(rd.result),f.name);rd.readAsText(f);});
  pick("file-md",(t,n)=>mdLoadText(t,n,null));pick("file-md-merge",t=>mdMergeText(t));
  document.addEventListener("click",ev=>{
    const b=ev.target.closest("[data-md]");if(!b)return;
    const a=b.dataset.md;
    if(a==="open")mdOpen();else if(a==="save")mdSave(false);else if(a==="save-as")mdSave(true);else if(a==="merge")$("file-md-merge").click();
    else if(a==="clear")mdClear();else if(a==="country-apply")mdApplyCountry();else if(a==="country-save")mdSaveCountry();
    else if(a==="take")mdTakeFromCalc(b.dataset.cl);
  });
}

// Fehlende oder ungültige Werte als „–“
function kpiFmt(v,t){
  if(v==null||!Number.isFinite(Number(v)))return "–";
  v=Number(v);
  if(t==="money")return calcEur(v);if(t==="eur")return calcEurFix(v);if(t==="pct")return calcPct(v);if(t==="months")return fmt(v,1)+" Monate";return fmt(v,2);
}
function jumpToKpiSource(tab,source){
 showTab(tab);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const panel=$("panel-"+tab),target=panel&&panel.querySelector(`[data-kpi-source~="${source}"]`);
  const dest=target||panel;if(!dest)return;
  dest.scrollIntoView({behavior:"smooth",block:"center"});
  dest.classList.remove("kpi-source-flash");void dest.offsetWidth;dest.classList.add("kpi-source-flash");
  setTimeout(()=>dest.classList.remove("kpi-source-flash"),2300);
 }));
}

function renderVisiblePanels(){
  for(const n of [...STALE_PANELS]){
    const panel=$("panel-"+n);
    if(!panel||!panel.classList.contains("on"))continue;
    STALE_PANELS.delete(n);
    renderCalcPanel(n);
  }
  renderKpiSidebar();
}
function refreshAll(){
  for(const n of CALC_TABS)STALE_PANELS.add(n);
  renderVisiblePanels();updateHeader();
}
function updateHeader(){
  const m=S.meta||{},t=[m.name,m.kunde].filter(Boolean).join(" · ");
  const p=$("hdr-proj");p.textContent=t||i18nText("Neue Kalkulation");p.classList.toggle("ud",!!t);
  $("hdr-file").hidden=!FILE.name&&!FILE.dirty;
  $("hdr-file-name").textContent=FILE.name||"";
  $("hdr-dirty").hidden=!FILE.dirty;
  document.title=(FILE.dirty?"● ":"")+(m.name?m.name+" · ":"")+tr("Kalkulationstool")+" "+APP_VERSION;

function showTab(n){
  if(!CALC_TABS.includes(n))return;
  for(const b of document.querySelectorAll("#tabs [data-tab]")){
    const on=b.dataset.tab===n;
    b.setAttribute("aria-selected",on?"true":"false");b.tabIndex=on?0:-1;
  }
  for(const k of CALC_TABS)$("panel-"+k).classList.toggle("on",k===n);
  STALE_PANELS.add(n);renderVisiblePanels();
}
function initTabs(){
  const nav=$("tabs");
  nav.addEventListener("click",ev=>{const b=ev.target.closest("[data-tab]");if(b)showTab(b.dataset.tab);});
  document.addEventListener("click",ev=>{const b=ev.target.closest("[data-go-tab]");if(b)showTab(b.dataset.goTab);});
  nav.addEventListener("keydown",ev=>{
    if(!["ArrowLeft","ArrowRight","Home","End"].includes(ev.key))return;
    const tabs=[...nav.querySelectorAll("[data-tab]")],i=tabs.indexOf(document.activeElement);if(i<0)return;
    ev.preventDefault();
    const j=ev.key==="Home"?0:ev.key==="End"?tabs.length-1:(i+(ev.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;
    showTab(tabs[j].dataset.tab);tabs[j].focus();
  });
}


/* ---- Sprache: Deutsch und Englisch ----
   Übersetzt werden nur Texte der Oberfläche, nie Eingaben und Nutzerdaten (Eingabefelder, .ud, [data-no-i18n]).
   Treffer exakt je Text (ohne Leerraum am Rand); Texte mit Zahlen oder „Zitaten“ über Vorlagen mit Platzhaltern {0}, {1} …,
   in die die Originalwerte unverändert zurückgesetzt werden. Zahlen und Datumsangaben folgen der Sprache (de-DE / en-GB). */
const I18N_ORIG=new WeakMap();
// Kalkulationswährung: Beträge werden mit „€“ erzeugt und in der Anzeige durch das Kürzel ersetzt
function calcCurrency(c){const x=(c&&c.currency)||{},code=/^[A-Z]{3}$/.test(x.code||"")?x.code:"EUR";return {code,rate:code==="EUR"?1:(Number(x.rate)>0?Number(x.rate):1),date:x.date||""};}
const calcCurSym=()=>{const c=calcCurrency(S&&S.calc).code;return c==="EUR"?"€":c;};
const curText=t=>{const c=calcCurSym();return c==="€"||t==null?t:String(t).replace(/€/g,c);};
const ui=t=>curText(tr(t));
const I18N_TOKEN=/„[^“]*“|"[^"]*"|[-−+]?\d(?:[\d.,/]*\d)?/g; // Zahlen und Datumsangaben (15.10.2026 bzw. 15/10/2026) als ein Platzhalter
function i18nTemplate(text){const vals=[];const key=text.replace(I18N_TOKEN,m=>{vals.push(m);return "{"+(vals.length-1)+"}";});return {key,vals};}
// Text der Oberfläche übersetzen; unbekannte Texte bleiben deutsch
function tr(text){
  if(APP_LANG==="de"||text==null)return text;
  const str=String(text),t=str.trim();if(!t)return str;
  let out=I18N_EN[t];
  if(out===undefined&&/\d|„|"/.test(t)){
    const {key,vals}=i18nTemplate(t),tpl=I18N_EN[key];
    if(tpl!==undefined)out=tpl.replace(/\{(\d+)\}/g,(m,i)=>{const v=vals[+i];if(v===undefined)return m;return v[0]==="„"?"“"+v.slice(1,-1)+"”":v;});
  }
  if(out===undefined&&t.includes("\n"))out=t.split("\n").map(x=>tr(x)).join("\n");
  // Meldung mit Präfix („Datei wurde nicht übernommen: …“), technische Meldungen, Titel mit Projektname („Kalkulation – Name“)
  const i=t.indexOf(": ");
  if(out===undefined&&i>0&&I18N_EN[t.slice(0,i)]!==undefined)out=I18N_EN[t.slice(0,i)]+": "+tr(t.slice(i+2));
  if(out===undefined)for(const [rx,fn] of I18N_EN_RX){const m=rx.exec(t);if(m){out=fn(m);break;}}
  if(out===undefined){
    const j=t.indexOf(" – ");
    if(j>0&&I18N_EN[t.slice(0,j)]!==undefined)out=I18N_EN[t.slice(0,j)]+" – "+t.slice(j+3);
    else{const m=/^(.+), Zeile (\d+)$/.exec(t);if(m){const x=tr(m[1]);if(x!==m[1]||I18N_EN[m[1]]!==undefined)out=x+", row "+m[2];}}
  }
  if(out===undefined)return str;
  const lead=str.match(/^\s*/)[0],trail=str.match(/\s*$/)[0];
  return lead+out+trail;
}
const i18nText=tr;
const I18N_ATTRS=["title","aria-label","placeholder","data-tip"];
const i18nSkip=el=>!el||!!el.closest(".ud,[data-no-i18n],script,style,textarea");
function applyLanguage(root){
  root=root||document.body;
  const de=APP_LANG==="de";
  const walker=(root.ownerDocument||document).createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=walker.nextNode())){
    if(i18nSkip(n.parentElement))continue;
    let orig=I18N_ORIG.get(n);
    // Vom Code geänderte Texte gelten als neues deutsches Original
    if(orig===undefined||n.nodeValue!==orig.out)orig={de:n.nodeValue,out:n.nodeValue};
    const v=curText(de?orig.de:tr(orig.de));
    if(n.nodeValue!==v)n.nodeValue=v;
    orig.out=v;I18N_ORIG.set(n,orig);
  }
  const els=[...(root.matches&&root.matches("[title],[aria-label],[placeholder],[data-tip]")?[root]:[]),...root.querySelectorAll("[title],[aria-label],[placeholder],[data-tip]")];
  for(const e of els){
    if(e.closest(".ud,[data-no-i18n]"))continue;
    for(const a of I18N_ATTRS){
      if(!e.hasAttribute(a))continue;
      const k="data-de-"+a,cur=e.getAttribute(a);
      if(!e.hasAttribute(k)||e.getAttribute("data-out-"+a)!==cur)e.setAttribute(k,cur);
      const v=curText(de?e.getAttribute(k):tr(e.getAttribute(k)));
      if(cur!==v)e.setAttribute(a,v);
      e.setAttribute("data-out-"+a,v);
    }
  }
}
function setLanguage(lang){
  APP_LANG=lang==="en"?"en":"de";APP_LOCALE=APP_LANG==="en"?"en-GB":"de-DE";
  try{localStorage.setItem("kalkulation-language",APP_LANG);}catch(e){}
  document.documentElement.lang=APP_LANG;
  for(const b of document.querySelectorAll(".lang-switch [data-lang]"))b.setAttribute("aria-pressed",String(b.dataset.lang===APP_LANG));
  for(const n of CALC_TABS)STALE_PANELS.add(n);
  if(S&&S.calc)renderVisiblePanels();
  if($("hdr-file"))updateHeader();
  applyLanguage(document.body);
  if(typeof syncStickyOffsets==="function")syncStickyOffsets();
}
function bindLanguage(){
  let lang="de";try{lang=localStorage.getItem("kalkulation-language")||"de";}catch(e){}
  for(const b of document.querySelectorAll(".lang-switch [data-lang]"))b.addEventListener("click",()=>setLanguage(b.dataset.lang));
  APP_LANG=lang==="en"?"en":"de";APP_LOCALE=APP_LANG==="en"?"en-GB":"de-DE";
  document.documentElement.lang=APP_LANG;
  for(const b of document.querySelectorAll(".lang-switch [data-lang]"))b.setAttribute("aria-pressed",String(b.dataset.lang===APP_LANG));
}

ark pass-through items.","Summary:": "Summary:","Kostenaufbau bis zum Umsatz mit Verhandlung.": "Cost build-up to revenue incl. negotiation.","Auswertung:": "Analysis:","Ergebnis je Jahr bei Festpreis, Cashflow, Sensitivität, Preisuntergrenze, Varianten und Plausibilität.": "Result per year at a fixed price, cash flow, sensitivity, price floor, variants and plausibility.","OtO-Werte:": "OtO values:","Kopiervorlage für das OtO-Formular. Die Vertragsprüfung erfolgt separat.": "Template to copy into the OtO form. The contract review takes place separately.","Dokumentation:": "Documentation:","Version und Freigabe, Versionshistorie mit Kennzahlen und das automatische Änderungsprotokoll der Kalkulationsinhalte.": "Version and approval, version history with key figures and the automatic change log of the calculation contents.","Eingabefeld": "Input field","Ausgabefeld": "Output field","Zwischensumme": "Subtotal","aus Personalbedarf oder Tarifgruppe": "from staffing need or pay group","Hinweis: Das Werkzeug unterstützt die Projektkalkulation; alle Eingaben und Ergebnisse sind vom Anwender eigenverantwortlich auf Richtigkeit und Plausibilität zu prüfen.": "Note: the tool supports project costing; users are responsible for checking all inputs and results for correctness and plausibility.","Bereiche der Basisdaten": "Base data sections","Allgemeine Projektdaten. Start und Ende der Leistung bestimmen die Laufzeit und die Monatsanteile je Kalenderjahr. Projektdaten lassen sich über Datei › Projektdaten aus Lagerplaner-Planungsdatei übernehmen.": "General project data. Service start and end determine the term and the monthly shares per calendar year. Project data can be imported via File › Project data from Lagerplaner planning file.","Auswahl aus der Liste Service-Lines (unten erweiterbar) oder freie Eingabe.": "Choose from the service lines list (extendable below) or enter freely.","Start Leistung": "Service start","Ende Leistung": "Service end","Eingabe in ganzen Monaten setzt das Ende der Leistung auf den Vortag des Monatstags (z. B. {0} + {1} Monate = {2}). Erfordert den Start.": "Entering whole months sets the service end to the day before the same day of the month (e.g. {0} + {1} months = {2}). Requires the start.","Ganze Monate ab Start; setzt das Leistungsende": "Whole months from start; sets the service end","Laufzeit in Monaten": "Term in months","Gewinn, Risiko und Umlagen werden im Hundert auf die Projektkosten aufgeschlagen: Kosten ÷ ({0} − Summe der Sätze) × Satz. Die Verhandlungsmarge kommt anschließend auf den Umsatz ohne Verhandlung.": "Profit, risk and allocations are added to the project costs on a margin basis: costs ÷ ({0} − sum of rates) × rate. The negotiation margin is then applied to revenue before negotiation.","Zulässig: {0} bis {1} %": "Allowed: {0} to {1} %","Zulässig: {0} bis {1}": "Allowed: {0} to {1}","Risiko": "Risk","Konzernumlage HV": "Group allocation HV","Umlage BU": "BU allocation","Umlage NL": "NL allocation","Tage pro Jahr aus dem Startjahr. Die produktiven Stunden sind die Bezugsgröße für die Stundensätze und die Personalkosten.": "Days per year from the start year. The productive hours are the basis for the hourly rates and the personnel costs.","Samstage und Sonntage": "Saturdays and Sundays","Sonstige Abwesenheitstage": "Other absence days","Arbeitsstunden Lohnempfänger": "Working hours of wage earners","Arbeitsstunden Gehaltsempfänger": "Working hours of salaried staff","Die Löhne und Gehälter steigen jeweils zum Stichtagsmonat, erstmals im Kalenderjahr nach dem Start; je Jahr lässt sich ein eigener Satz eintragen (leer = allgemeiner Satz). Hochlauf: Anteil der FTE im ersten Kalenderjahr. Volumenwachstum: Steigerung der FTE je Jahr ab dem zweiten Jahr. Einzelwerte je Qualifikation unter Personalkosten › FTE je Kalenderjahr. Ohne Wirkung im Excel-kompatiblen Modus außer der allgemeinen Steigerung.": "Wages and salaries rise at the reference month, for the first time in the calendar year after the start; a separate rate can be entered per year (empty = general rate). Ramp-up: share of FTE in the first calendar year. Volume growth: increase in FTE per year from the second year. Individual values per qualification under Personnel costs › FTE per calendar year. No effect in Excel-compatible mode except the general increase.","Personalkostensteigerung": "Personnel cost increase","Stichtagsmonat der Tariferhöhung": "Reference month of the pay increase","Hochlauf erstes Kalenderjahr": "Ramp-up first calendar year","Volumenwachstum": "Volume growth","Diese Sätze beruhen auf dem deutschen Sozialversicherungssystem. Für andere Länder oder zur Vereinfachung die Einzelsätze auf {0} setzen und einen Gesamtwert über die sonstigen Zuschläge oder eine eigene SV-Zeile abbilden. Der Zuschlag für Sondertätigkeiten wird separat aufgeschlagen, sodass Sätze mit und ohne Zuschlag sichtbar sind. Zuschläge je Qualifikation (Schicht, Nacht) unter Personalkosten.": "These rates are based on the German social security system. For other countries, or to simplify, set the individual rates to {0} and map a total via the other mark-ups or a separate social security row. The mark-up for special activities is added separately, so rates with and without it are visible. Mark-ups per qualification (shift, night) under Personnel costs.","Urlaubsgeld und Prämie Gehalt": "Holiday pay and bonus, salaries","Urlaubsgeld und Prämie Lohn": "Holiday pay and bonus, wages","Sonstige Zuschläge Gehalt": "Other mark-ups, salaries","Sonstige Zuschläge Lohn": "Other mark-ups, wages","Zuschlag Sondertätigkeiten Gehalt": "Special activities mark-up, salaries","Zuschlag Sondertätigkeiten Lohn": "Special activities mark-up, wages","Der SV-Anteil Arbeitgeber (Position {0}) ist die Summe dieser Sätze. Mit Beitragsbemessungsgrenze (BBG) gilt ein Satz nur bis zur Grenze des Jahresentgelts je FTE; {1} = ohne Grenze. Vorbelegt sind die Grenzen {2} (KV/PV {3} €, RV/AV {4} € im Jahr); bitte jährlich prüfen. Im Excel-kompatiblen Modus gelten keine Grenzen.": "The employer social security share (item {0}) is the sum of these rates. With a contribution ceiling (BBG), a rate applies only up to the ceiling of the annual pay per FTE; {1} = no ceiling. Pre-filled are the {2} ceilings (health/care {3} €, pension/unemployment {4} € per year); please check annually. No ceilings apply in Excel-compatible mode.","Nach oben": "Move up","Nach unten": "Move down","Zeile duplizieren": "Duplicate row","Zeile löschen": "Delete row","Steigerung je Kalenderjahr ab dem zweiten Jahr der Laufzeit. Der Kalkulationszins verteilt Investitionen und Ramp-up als Annuität (Tilgung und Zins) auf die Laufzeit statt linear. Durchreichposten (Spalte unter Sachkosten) erhalten statt Umlagen, Gewinn und Risiko nur den Aufschlag für Durchreichposten. Ohne Wirkung im Excel-kompatiblen Modus.": "Increase per calendar year from the second year of the term. The imputed interest spreads investments and ramp-up over the term as an annuity (repayment and interest) instead of linearly. Pass-through items (column under Material costs) receive only the pass-through mark-up instead of allocations, profit and risk. No effect in Excel-compatible mode.","Sachkostensteigerung": "Material cost increase","Kalkulationszins": "Imputed interest","Aufschlag Durchreichposten": "Pass-through mark-up","Eine Vorlage enthält Basisdaten (Zuschläge, Arbeitszeit, SV-Sätze, Tariferhöhungen, Sachkostenparameter), Tarifgruppen, Auswahllisten und die Einstellungen der Auswertung, etwa je Land oder Gesellschaft. Projektdaten sowie Personal- und Sachkosten bleiben beim Laden erhalten.": "A template contains base data (mark-ups, working time, social security rates, pay increases, material cost parameters), pay groups, selection lists and the analysis settings, e.g. per country or company. Project data and personnel and material costs are kept when loading.","Einträge je Zeile. Sie stehen in den Feldern Service-Line, Status, Abrechnungsart und Freigabes function setViewMode(mode){
  const detail=mode==="detail";
  document.body.classList.toggle("view-standard",!detail);
  document.body.classList.toggle("view-detail",detail);
  const a=$("view-standard"),b=$("view-detail");
  if(a)a.setAttribute("aria-pressed",String(!detail));
  if(b)b.setAttribute("aria-pressed",String(detail));
  try{localStorage.setItem("kalkulation-view-mode",detail?"detail":"standard");}catch(e){}
}
function bindViewMode(){
  $("view-standard").addEventListener("click",()=>setViewMode("standard"));
  $("view-detail").addEventListener("click",()=>setViewMode("detail"));
  let mode="standard";try{mode=localStorage.getItem("kalkulation-view-mode")||"standard"}catch(e){}
  setViewMode(mode);
}

// Speichern: in die geöffnete bzw. zuletzt gespeicherte Datei; ohne Dateizugriff als Download unter dem bekannten Namen
async function saveFile(){
  if(FILE.handle){
    try{await fileWrite(FILE.handle);fileSet(FILE.handle.name,FILE.handle);showNotice("Gespeichert: "+FILE.name,4000);return true;}
    catch(e){if(e&&e.name==="AbortError")return false;console.warn("Schreiben in die Datei fehlgeschlagen:",e);}
  }
  if(!FILE.name&&window.showSaveFilePicker)return saveFileAs();
  const name=FILE.name||fileDefaultName();
  downloadBlob(new Blob([fileJson()],{type:"application/json"}),name);
  fileSet(name,null);
  showNotice("Kalkulation als Datei „"+name+"“ gespeichert (Download-Ordner). Der Stand bleibt zusätzlich im Browser dieses Geräts erhalten.",5000);
  return true;
}
// Speichern unter: Dateiname und Ablageort wählen; Browser ohne Dateiauswahl fragen den Namen ab und laden herunter
async function saveFileAs(){
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:FILE.name||fileDefaultName(),types:FILE_TYPES});
      await fileWrite(h);fileSet(h.name,h);
      showNotice("Gespeichert unter: "+h.name,4000);return true;
    }catch(e){if(e&&e.name==="AbortError")return false;console.warn("Speichern unter nicht möglich, Download stattdessen:",e);}
  }
  let name=prompt(i18nText("Dateiname für die Kalkulation:"),FILE.name||fileDefaultName());
  if(name===null)return false;
  name=name.trim().replace(/[\\/:*?"<>|]+/g,"_")||fileDefaultName();
  if(!/\.json$/i.test(name))name+=".json";
  downloadBlob(new Blob([fileJson()],{type:"application/json"}),name);
  fileSet(name,null);
  showNotice("Kalkulation als „"+name+"“ gespeichert (Download-Ordner).",5000);
  return true;
}
// Öffnen: mit Dateizugriff, damit Speichern dieselbe Datei aktualisiert; sonst Dateiauswahl
async function openFile(){
  if(window.showOpenFilePicker){
    try{
      const [h]=await window.showOpenFilePicker({types:FILE_TYPES,multiple:false});
      const f=await h.getFile();
      if(loadText(await f.text()))fileSet(f.name,h);
      return;
    }catch(e){if(e&&e.name==="AbortError")return;console.warn("Dateiauswahl nicht möglich:",e);}
  }
  $("file-in").click();
}
function hasContent(){
  const c=S.calc||{};
  return ["salaries","wages","capex","opex","nu","rampup"].some(k=>(c[k]||[]).length)||!!(S.meta.name||S.meta.kunde);
}
function loadText(txt){
  try{
    if(typeof txt!=="string"||txt.length>10000000)throw new Error("Datei ist größer als 10 MB oder kein Text.");
    let obj;
    try{obj=JSON.parse(txt);}catch(e){throw new Error("Die Datei ist kein gültiges JSON.");}
    if(isPlainObject(obj)&&(Array.isArray(obj.items)||Array.isArray(obj.positionen)))throw new Error("Das ist eine Lagerplaner-Planungsdatei. Projektdaten daraus übernehmen Sie über Datei › Projektdaten aus Lagerplaner-Planungsdatei.");
    validateFile(obj);
    if(hasContent()&&!confirm("Aktuelle Kalkulation durch die Datei ersetzen?"))return false;
    const {next,fixed}=stateFrom(obj);
    pushUndo("Kalkulation geöffnet");
    S=next;refreshAll();FILE_LOADING=true;persistState();FILE_LOADING=false;
    if(fixed.length)showNotice("Kalkulation geöffnet: "+fixed.length+(fixed.length===1?" Wert lag":" Werte lagen")+" außerhalb des zulässigen Bereichs und wurde"+(fixed.length===1?"":"n")+" angepasst.\n"+describeRepairs(fixed));
    return true;
  }catch(e){alert("Datei wurde nicht übernommen: "+e.message);return false;}
}
// Brücke zum Lagerplaner: nur Projektname, Kunde und die Projekt- und Anfragedaten
function loadLagerplanerText(txt){
  try{
    let obj;
    try{obj=JSON.parse(txt);}catch(e){throw new Error("Die Datei ist kein gültiges JSON.");}
    if(!isPlainObject(obj)||!isPlainObject(obj.meta))throw new Error("Keine Lagerplaner-Planungsdatei (Projektdaten fehlen).");
    assertSafeImportTree(obj,0);
    const req=isPlainObject(obj.request)?obj.request:{},take={};
    for(const [k,type] of Object.entries(CALC_REQUEST_FIELDS)){
      const v=req[k];
      if(typeof v==="string"&&v.length<=200&&(type!=="date"||/^\d{4}-\d{2}-\d{2}$/.test(v)))take[k]=v;
    }
    const name=typeof obj.meta.name==="string"?obj.meta.name.slice(0,200):"",kunde=typeof obj.meta.kunde==="string"?obj.meta.kunde.slice(0,200):"";
    pushUndo("Projektdaten aus Lagerplaner übernommen");
    if(name)S.meta.name=name;
    if(kunde)S.meta.kunde=kunde;
    Object.assign(S.request,take);
    refreshAll();persistState();
    showNotice("Projektdaten übernommen: "+[name&&"Projektname",kunde&&"Kunde",...Object.keys(take)].filter(Boolean).length+" Felder. Personal- und Sachkosten bleiben unverändert.",6000);
    return true;
  }catch(e){alert("Projektdaten wurden nicht übernommen: "+e.message);return false;}
}
function newCalc(){
  if(hasContent()&&!confirm("Neue Kalkulation beginnen? Der aktuelle Stand wird ersetzt (Rückgängig bleibt möglich)."))return;
  pushUndo("Neue Kalkulation");
  S=defaults();S.calc=calcNewCalc();refreshAll();FILE_LOADING=true;persistState();FILE_LOADING=false;fileSet("",null);
}
function initFileMenu(){
  const dd=$("dd-file"),btn=$("btn-dd-file");
  const close=()=>{dd.classList.remove("open");btn.setAttribute("aria-expanded","false");};
  btn.addEventListener("click",()=>{const open=!dd.classList.contains("open");dd.classList.toggle("open",open);btn.setAttribute("aria-expanded",String(open));if(open)$("btn-new").focus();});
  document.addEventListener("click",ev=>{if(!dd.contains(ev.target))close();});
  dd.addEventListener("keydown",ev=>{
    if(ev.key==="Escape"){close();btn.focus();return;}
    if(ev.key!=="ArrowDown"&&ev.key!=="ArrowUp")return;
    const items=[...dd.querySelectorAll("[role=menuitem]")],i=items.indexOf(document.activeElement);
    ev.preventDefault();items[(i+(ev.key==="ArrowDown"?1:-1)+items.length)%items.length].focus();
  });
  const pick=(input,fn)=>input.addEventListener("change",()=>{
    const f=input.files&&input.files[0];input.value="";if(!f)return;
    const rd=new FileReader();rd.onload=()=>fn(String(rd.result),f.name);rd.readAsText(f);
  });
  $("btn-new").addEventListener("click",()=>{close();newCalc();});
  $("btn-open").addEventListener("click",()=>{close();openFile();});
  $("btn-save").addEventListener("click",()=>{close();saveFile();});
  $("btn-save-as").addEventListener("click",()=>{close();saveFileAs();});
  $("btn-save-quick").addEventListener("click",()=>saveFile());
  $("btn-open-lp").addEventListener("click",()=>{close();$("file-lp").click();});
  $("btn-export-xlsx").addEventListener("click",()=>{close();calcExportXlsx();});
  $("btn-report").addEventListener("click",()=>{close();calcReport();});
  pick($("file-in"),(txt,name)=>{if(loadText(txt))fileSet(name,null);});pick($("file-lp"),loadLagerplanerText);pick($("file-tpl"),calcTemplateLoadText);
  $("btn-undo").addEventListener("click",undoLast);
  document.addEventListener("keydown",ev=>{
    if((ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&ev.key.toLowerCase()==="z"&&!(ev.target&&ev.target.matches&&ev.target.matches("input,textarea"))){ev.preventDefault();undoLast();}
    if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&ev.key.toLowerCase()==="s"){ev.preventDefault();if(ev.target&&ev.target.blur&&ev.target.matches&&ev.target.matches("input,textarea"))ev.target.blur();if(ev.shiftKey)saveFileAs();else saveFile();}
    if((ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&!ev.altKey&&ev.key.toLowerCase()==="o"){ev.preventDefault();openFile();}
  });
}

/* ============================ Start ============================ */
(function init(){
  $("app-ver").textContent=APP_VERSION;$("app-ver-foot").textContent=APP_VERSION;
  bindViewMode();
  bindLanguage();
  bindHelp();
  let saved=null;
  S.calc=calcNewCalc();
  try{saved=localStorage.getItem(LS_KEY);}catch(e){}
  if(saved!==null){
    try{
      const obj=validateFile(JSON.parse(saved));
      const {next,fixed}=stateFrom(obj);S=next;
      if(fixed.length)showNotice("Gespeicherter Stand: "+fixed.length+" Werte angepasst.\n"+describeRepairs(fixed));
    }catch(e){
      try{localStorage.setItem(LS_KEY+"-backup",saved);}catch(e2){}
      console.warn("Gespeicherter Stand nicht ladbar; Sicherungskopie unter "+LS_KEY+"-backup.",e);
    }
  }
  mdInit();
  try{const f=JSON.parse(localStorage.getItem("kalkulation-file")||"null");if(isPlainObject(f)){FILE.name=typeof f.name==="string"?f.name.slice(0,200):"";FILE.dirty=f.dirty===true;}}catch(e){}
  initTabs();initFileMenu();initCalc();bindFieldUndoTracking();
  updateHeader();updateUndoBtn();
  try{CALC_LAST_JSON=JSON.stringify(S);MD_LAST_JSON=JSON.stringify(MD);}catch(e){}
  showTab("home");
  applyLanguage(document.body);
})();
</script>
