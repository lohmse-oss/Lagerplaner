<!doctype html>
<html lang="de" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulationstool V2.12</title>
<style>
/* ============================ Grundlagen ============================ */
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --side:#0f172a; --acc:#2563eb; --amber:#f59e0b; --red:#dc2626; --teal:#0f766e; --header-h:52px;
  font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);font-size:13px}
body{display:flex;flex-direction:column;min-height:100vh}
table{border-collapse:collapse;width:100%}
th{background:#f8fafc;text-align:left;font-size:10.5px;color:var(--mut);padding:4px 5px;border:1px solid var(--line)}
td{border:1px solid var(--line);padding:1px 2px;line-height:1.25}
td.calc{background:#f8fafc;text-align:right;font-size:11.5px;padding:2px 5px;white-space:nowrap}
tr:hover td{background:#f8fafc}
.hint{font-size:11px;color:#64748b;line-height:1.45}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Knöpfe: primär (.acc), sekundär (.btn), Werkzeug (.btn-quiet) */
.btn{background:#fff;color:#1e293b;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:500}
.btn:hover{background:#f1f5f9;border-color:#94a3b8}
.btn:disabled{opacity:.45;cursor:default;background:#fff;border-color:#cbd5e1}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn.danger{color:#b91c1c;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#f87171}
.btn.btn-quiet{background:transparent;color:#334155;border-color:transparent}
.btn.btn-quiet:hover{background:#e2e8f0;border-color:transparent}
.btn:focus-visible,#tabs button:focus-visible,.dd-list button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.tt{position:relative;display:inline-block;margin-left:7px;color:var(--acc);font-weight:700;cursor:help;font-size:13px;line-height:1;vertical-align:baseline}
.tt::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 7px);background:#0f172a;color:#e2e8f0;padding:9px 11px;border-radius:8px;font-size:11.5px;font-weight:400;line-height:1.55;width:min(440px,70vw);white-space:normal;text-align:left;display:none;z-index:80;box-shadow:0 10px 28px rgba(15,23,42,.3);pointer-events:none}
/* Ausgeblendete Tooltips dürfen die Seitenbreite nicht vergrößern */
.tt:hover::after,.tt:focus-visible::after{display:block}
/* Kopfzeile */
header{position:sticky;top:0;z-index:110;background:var(--side);color:#fff;padding:10px 16px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(15,23,42,.18)}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em;white-space:nowrap}
header h1 .v{color:var(--amber);font-weight:600;margin-left:4px}
.hdr-title{display:flex;align-items:baseline;gap:6px 14px;min-width:0;flex:1 1 260px;flex-wrap:wrap}
header .proj{color:#cbd5e1;font-size:12.5px;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;gap:8px;align-items:baseline}
#hdr-proj{overflow:hidden;text-overflow:ellipsis}
.hdr-file{color:#94a3b8;font-size:11.5px;display:inline-flex;gap:4px;align-items:baseline;overflow:hidden;text-overflow:ellipsis}
.hdr-file::before{content:"·"}
.hdr-dirty{color:var(--amber);font-size:12px}
.hdr-group{display:flex;gap:6px;align-items:center}
header .btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
header .btn.acc:hover{background:#1d4ed8}
.seg{display:inline-flex;align-items:center;gap:2px;padding:2px;background:#1e293b;border:1px solid #334155;border-radius:8px}
.seg button{border:0;background:transparent;color:#cbd5e1;padding:5px 9px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;line-height:1.2}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{background:#f8fafc;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg button:focus-visible{outline:2px solid #93c5fd;outline-offset:1px}
.dd-list kbd{float:right;margin-left:14px;font:inherit;font-size:11px;color:#64748b}
header .btn{background:#1e293b;color:#e2e8f0;border-color:#334155}
header .btn:hover{background:#334155}
header .btn:disabled{background:#1e293b;border-color:#334155}
.hdr-actions{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-left:auto;justify-content:flex-end}
.dd{position:relative}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:90;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.2);padding:6px;min-width:280px}
.dd.open .dd-menu{display:block}
.dd-list button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;font-size:12.5px;color:var(--ink);cursor:pointer}
.dd-list button:hover{background:#f1f5f9}
.dd-sep{height:1px;background:var(--line);margin:5px 2px}
/* Register */
#tabs{position:sticky;top:var(--header-h);z-index:100;display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
#tabs button{border:1px solid #99f6e4;border-bottom:none;background:#f0fdfa;color:#115e59;border-radius:9px 9px 0 0;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
#tabs button[aria-selected="true"]{background:var(--card);color:var(--teal);border-color:#0d9488;box-shadow:inset 0 -3px 0 currentColor}
main{flex:1;padding:12px 14px 24px;min-width:0}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
footer{font-size:11px;color:#94a3b8;background:var(--side);padding:6px 16px;text-align:center}
.toast{position:fixed;right:18px;bottom:18px;z-index:95;background:var(--card);border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.25);padding:11px 15px;font-size:12px;color:var(--ink);max-width:430px;cursor:pointer;white-space:pre-line}
@media(max-width:760px){
  header{padding:8px 12px}
  .hdr-actions{margin-left:0}
  .dd-menu{right:auto;left:0}
  main{padding:10px 10px 20px}
  #tabs{padding:8px 10px 0}
}
@media print{header,#tabs,footer,.rowbtns{display:none!important}}
/* ============================ Kalkulation ============================ */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:0 12px;align-items:start}
.calc-grid-wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.calc-grid>*{min-width:0}
.calc-scroll{position:relative;overflow-x:auto;max-width:100%;min-width:0}
.calc-tab{font-size:12px;margin:2px 0 6px}
.calc-tab th{text-transform:none;letter-spacing:0;font-size:11px;white-space:normal;vertical-align:bottom}
.calc-tab th small{font-weight:400}
.calc-tab th.r{text-align:right}
.calc-tab td{padding:2px 5px;height:28px}
.calc-tab td.cn{width:30px;text-align:center;color:var(--mut)}
.calc-tab td.cact,.calc-tab th.cact{white-space:nowrap;width:1%}
.calc-tab td.cin{padding:2px 3px;background:#fffbeb}
.calc-tab tfoot td{font-weight:700;background:#f1f5f9}
.calc-tab tr.hl>*{background:#e0e7ff;font-weight:700}
.calc-tab tr.top>*{background:#c7d2fe;font-weight:700}
.calc-tab tr.sub>th{font-weight:400;padding-left:18px}
.calc-kv tbody th{text-align:left;font-weight:400;color:#334155;font-size:12px;background:#fff;white-space:normal}
.calc-kv td{width:160px}
.calc-head th{background:#f8fafc;width:auto}
.calc-head td{min-width:90px}
td input.ci,input.ci{width:100%;min-width:72px;height:24px;background:#fefce8;border:1px solid #fde68a;border-radius:4px;padding:2px 6px;font-size:12px;color:var(--ink)}
input.ci.num{text-align:right}
input.ci.ci-name{min-width:170px}
input.ci:focus,td input.ci:focus{outline:none;border-color:var(--acc);background:#fff}
input.ci.bad{border-color:var(--red);background:#fef2f2}
.btn.ca{padding:1px 6px;min-width:24px;font-size:12px}
.calc-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 12px;margin-bottom:6px}
.calc-form .mf{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut)}
.calc-form .mf.wide{grid-column:1/-1}
input.ci:disabled{background:#f3f3f3;border-color:var(--line);color:var(--mut)}
input.ci::placeholder{color:#a8a29e}
.calc-form textarea{width:100%;font:12px/1.4 inherit;border:1px solid #fde68a;background:#fefce8;border-radius:6px;padding:4px 6px;resize:vertical}
.calc-form .cout{display:block;height:24px;line-height:22px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:#f3f3f3;color:var(--ink);font-size:12px;text-align:right}
.calc-check{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:4px}
.calc-check input{width:16px;height:16px;accent-color:var(--acc)}
.calc-warn{margin:0}
.co.warnline{display:block;color:#b45309;white-space:pre-line;font-size:12px}
.co.warnline:not(:empty){margin:4px 0 8px;padding:6px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px}
.calc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}
.calc-kpi{border:1px solid #c7d2fe;border-radius:8px;padding:8px 10px;background:#eef2ff;font-size:11.5px;color:#3730a3}
.calc-kpi .kv{display:block;font-size:17px;font-weight:700;color:var(--ink);margin-top:2px}
.calc-det{margin:6px 0}
.calc-capex-detail{margin-top:14px;padding-top:10px;border-top:1px solid #e2e8f0}
.calc-capex-detail h4{margin:0 0 4px;font-size:13px}
.calc-tab td.calc.tl{text-align:left}
.calc-tab tr.ghost td.cn{color:#cbd5e1}
.calc-tab tr.ghost .ci{background:#fff;border-color:#e2e8f0}
.calc-tab tr.ghost .ci:focus{background:#fffbeb;border-color:#f59e0b}
input[data-cf="calc.currency.code"]{text-transform:uppercase}
.kpi-value.long{font-size:14px}
.calc-tab input[data-cf$=".category"]{min-width:130px}
body.view-detail .standard-only{display:none!important}
/* Inline-Hilfe und Verfahrensanweisung */
body.help-off .help-box{display:none}
#btn-help[aria-pressed="true"]{background:#f8fafc;color:#0f172a;border-color:#f8fafc}
.help-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:2px 14px;margin:0 0 12px;color:#1e3a8a}
.help-box summary{cursor:pointer;font-weight:600;font-size:12.5px;padding:8px 0;display:flex;align-items:center;gap:8px;list-style:none}
.help-box summary::-webkit-details-marker{display:none}
.help-box summary::after{content:"▾";margin-left:auto;color:#3b82f6}
.help-box:not([open]) summary::after{content:"▸"}
.help-ico{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#2563eb;color:#fff;font-size:11px;align-items:center;justify-content:center;flex:0 0 auto}
.help-body{font-size:12px;line-height:1.55;padding:0 0 10px}
.help-body ol{margin:0 0 6px;padding-left:20px}.help-body li{margin:2px 0}
.help-tips{margin:4px 0 0;padding-left:18px;color:#334155}
.guide{margin-top:12px}.guide-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.guide-head h3{margin:0}
.guide-det{border-top:1px solid var(--line);padding:2px 0}
.guide-det>summary{cursor:pointer;font-weight:600;font-size:13px;padding:9px 0}
.guide-sec{font-size:12.5px;line-height:1.6;padding:0 0 8px}.guide-sec p{margin:0 0 6px}.guide-sec ol,.guide-sec ul{margin:0;padding-left:20px}.guide-sec li{margin:3px 0}
.calc-det>summary{cursor:pointer;font-size:12px;font-weight:600;color:#334155;padding:4px 0}
.calc-steps{margin:4px 0 8px;padding-left:20px;font-size:12px;line-height:1.5}
.calc-legend{font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.calc-legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.calc-legend .sw-in{background:#fefce8;border-color:#fde68a}.calc-legend .sw-out{background:#f3f3f3}.calc-legend .sw-hl{background:#e0e7ff}
.calc-link{font-weight:600;color:var(--acc)}
.calc-audit td{white-space:normal;vertical-align:top;font-size:11.5px;padding:3px 5px}
.calc-audit td.calc-old{color:#94a3b8;text-decoration:line-through}
.calc-audit td.cin{min-width:180px}
.calc-tab td.linked{background:#dcfce7}
.calc-tab td.cc{text-align:center}
.calc-tab td.cc input{width:16px;height:16px;accent-color:var(--acc)}
select.ci{width:100%;min-width:80px;height:24px;background:#fefce8;border:1px solid #fde68a;border-radius:4px;font-size:12px;color:var(--ink)}
.calc-legend .sw-link{background:#dcfce7}
.calc-kpi.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.calc-kpi.good{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.calc-sub{margin:12px 0 6px;font-size:12.5px}
.calc-svg{display:block;width:100%;max-width:760px;height:auto;margin:8px 0}
.calc-checks{margin:0;padding-left:18px;font-size:12px;line-height:1.6}
.calc-checks li.warn{color:#b45309}
.calc-checks li.info{color:#64748b}
.calc-var{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
input.ci.calc-var-name{width:240px;flex:0 1 240px}

/* Landingpage und Eingabeführung */
.home-hero{background:linear-gradient(120deg,#0f172a,#164e63);color:#fff;border-radius:14px;padding:24px;margin-bottom:12px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}
.home-hero h2{font-size:24px;margin:0 0 8px}.home-hero p{color:#cbd5e1;margin:0;line-height:1.55}
.home-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.home-actions .btn{padding:9px 14px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.home-tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;color:var(--ink)}
.home-tile:hover{border-color:#0d9488;box-shadow:0 4px 14px rgba(15,23,42,.08)}.home-tile b{display:block;margin-bottom:5px}.home-tile span{font-size:11.5px;color:var(--mut);line-height:1.4}
.home-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:12px 0}.home-status .calc-kpi{margin:0}
.basis-jump{position:sticky;top:calc(var(--header-h) + 49px);z-index:70;display:flex;gap:6px;overflow-x:auto;padding:7px 8px;margin:0 0 10px;background:rgba(241,245,249,.96);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(4px)}
.basis-jump a{white-space:nowrap;text-decoration:none;color:#334155;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:5px 9px;font-size:11.5px}.basis-jump a:hover{border-color:#0d9488;color:#0f766e}
.calc-form .mf>span:first-child{font-weight:600;color:#475569}.calc-form .mf:has(input[required])>span:first-child::after{content:" *";color:var(--red)}
.calc-form input,.calc-form select,.calc-form textarea{transition:border-color .15s,box-shadow .15s}.calc-form input:focus,.calc-form select:focus,.calc-form textarea:focus{box-shadow:0 0 0 3px rgba(37,99,235,.12)}
@media(max-width:760px){.home-hero{grid-template-columns:1fr;padding:18px}.home-actions{justify-content:flex-start}.basis-jump{top:calc(var(--header-h) + 43px)}}

/* Standard- und Detailansicht */
.scope-note{margin:10px 0 0;padding:8px 10px;border-left:3px solid #f59e0b;background:#fffbeb;color:#78350f;border-radius:4px;font-size:12px}
body.view-standard .detail-only{display:none!important}
/* KPI- und Statusseitenleiste V2.10 */
.app-shell{flex:1 0 auto;width:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start;max-width:1720px;margin:0 auto;padding:0 14px}
.app-shell main{min-width:0;padding-left:0;padding-right:0}
.kpi-sidebar{position:sticky;top:calc(var(--header-h) + 12px);max-height:calc(100vh - var(--header-h) - 24px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:0 4px 18px rgba(15,23,42,.08)}
.kpi-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.kpi-head h2{font-size:15px;margin:0}.kpi-config-btn{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:5px 8px;cursor:pointer;font:inherit;font-size:11px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi-card{border:1px solid #e2e8f0;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;border-radius:9px;padding:9px;background:#f8fafc;min-height:66px}.kpi-card:hover,.kpi-card:focus{border-color:#2563eb;box-shadow:0 3px 10px rgba(37,99,235,.15);transform:translateY(-1px);outline:0}.kpi-card.fixed{border-left:3px solid #0d9488}.kpi-card.variable{border-left:3px solid #64748b}.kpi-label{font-size:10.5px;color:#64748b;line-height:1.2}.kpi-value{font-size:15px;font-weight:700;color:#0f172a;margin-top:6px;overflow-wrap:anywhere}
.kpi-status{margin-top:10px;padding:9px;border-radius:8px;font-size:12px}.kpi-status.ok{background:#ecfdf5;color:#065f46}.kpi-status.warn{background:#fff7ed;color:#9a3412}.kpi-picker{display:none;margin-top:10px;border-top:1px solid #e2e8f0;padding-top:9px}.kpi-picker.open{display:block}.kpi-picker label{display:flex;gap:7px;align-items:flex-start;font-size:11px;margin:6px 0}.kpi-picker-note{font-size:10px;color:#64748b;margin:0 0 7px}
.kpi-source-flash{animation:kpiSourceFlash 2.2s ease-out}@keyframes kpiSourceFlash{0%,35%{outline:3px solid #f59e0b;background:#fffbeb}100%{outline-color:transparent}}
@media(max-width:860px){.app-shell{grid-template-columns:1fr}.kpi-sidebar{position:relative;top:auto;max-height:none;grid-row:1}.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){.app-shell{padding:0 8px}.kpi-grid{grid-template-columns:1fr 1fr}}
</style>


</head>
<body>
<header>
  <div class="hdr-title">
    <h1>Kalkulationstool<span class="v" id="app-ver">V2.12</span></h1>
    <span class="proj"><span id="hdr-proj" class="ud">Neue Kalkulation</span><span class="hdr-file" id="hdr-file" hidden><span class="ud" id="hdr-file-name"></span><span class="hdr-dirty" id="hdr-dirty" hidden title="Ungespeicherte Änderungen seit dem letzten Speichern als Datei" aria-label="Ungespeicherte Änderungen">●</span></span></span>
  </div>
  <div class="hdr-actions">
    <div class="hdr-group" role="group" aria-label="Bearbeiten und Datei">
      <button type="button" class="btn" id="btn-undo" disabled title="Rückgängig (Strg+Z)">↶ Rückgängig</button>
      <button type="button" class="btn acc" id="btn-save-quick" title="Speichern (Strg+S)">Speichern</button>
      <div class="dd" id="dd-file">
        <button type="button" class="btn" id="btn-dd-file" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-file">Datei ▾</button>
        <div class="dd-menu dd-list" id="menu-file" role="menu" aria-label="Datei">
          <button type="button" role="menuitem" id="btn-new">Neue Kalkulation</button>
          <button type="button" role="menuitem" id="btn-open">Öffnen … <kbd>Strg+O</kbd></button>
          <div class="dd-sep" role="separator"></div>
          <button type="button" role="menuitem" id="btn-save">Speichern <kbd>Strg+S</kbd></button>
          <button type="button" role="menuitem" id="btn-save-as">Speichern unter … <kbd>Strg+Umschalt+S</kbd></button>
          <div class="dd-sep" role="separator"></div>
          <button type="button" role="menuitem" id="btn-export-xlsx">Als Excel-Datei exportieren</button>

  checkObj(c.doc,label+".doc",(k,v)=>CALC_DOC_TEXT.includes(k)&&typeof v==="string"&&v.length<=(k==="note"?1000:200)&&(k!=="reviewDate"||calcIsDate(v)));
  if(c.oto!=null){
    if(!isPlainObject(c.oto))throw new Error(label+".oto muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.oto)){
      if(k==="rate"){if(!calcIsNum(v)||v<=0||v>1000000)throw new Error(label+".oto.rate muss eine positive Zahl sein.");} // Altfeld bis V2.11
      else if(!CALC_OTO_TEXT.includes(k))throw new Error(label+".oto: unbekanntes Feld "+k+".");
      else if(typeof v!=="string"||v.length>(k==="link"?1000:200))throw new Error(label+".oto."+k+" ist ungültig.");
    }
    if(c.oto.date!=null&&!calcIsDate(c.oto.date))throw new Error(label+".oto.date muss ein Datum (JJJJ-MM-TT) sein.");
    if(c.oto.link&&!/^https?:\/\//i.test(c.oto.link))throw new Error(label+".oto.link muss mit http:// oder https:// beginnen.");
  }
  if(c.country!=null&&(typeof c.country!=="string"||c.country.length>3))throw new Error(label+".country ist ungültig.");
  if(c.currency!=null){
    if(!isPlainObject(c.currency))throw new Error(label+".currency muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.currency)){
      if(k==="code"){if(typeof v!=="string"||!/^[A-Za-z]{3}$/.test(v.trim()))throw new Error(label+".currency.code muss ein Währungskürzel mit drei Buchstaben sein.");}
      else if(k==="rate"){if(!calcIsNum(v)||v<=0||v>1000000)throw new Error(label+".currency.rate muss eine positive Zahl sein.");}
      else if(k==="date"){if(v!==""&&!calcIsDate(v))throw new Error(label+".currency.date muss ein Datum (JJJJ-MM-TT) sein.");}
      else throw new Error(label+".currency: unbekanntes Feld "+k+".");
    }
  }
  if(c.lists!=null){
    if(!isPlainObject(c.lists))throw new Error(label+".lists muss ein Objekt sein.");
    for(const [k,v] of Object.entries(c.lists)){
      if(!CALC_CHOICES[k])throw new Error(label+".lists: unbekannte Auswahlliste "+k+".");
      if(!Array.isArray(v)||v.length>CALC_LIST_MAX||v.some(x=>typeof x!=="string"||x.length>100))throw new Error(label+".lists."+k+" muss eine Liste mit höchstens "+CALC_LIST_MAX+" Einträgen sein.");
    }
  }
}
/* Fehlende Felder ergänzen, Zahlen in ihre Grenzen holen; liefert die Reparaturen im Format von describeRepairs */
function normalizeCalc(state){
  const fixed=[];
  const c=state.calc=deepMerge(calcDefaults(),state.calc||{});
  const clampField=(obj,f,min,max,label)=>{
    const v=Number(obj[f]);
    if(!Number.isFinite(v)){obj[f]=0;return;}
    const n=Math.min(max,Math.max(min,v));
    if(n!==v){fixed.push({label,from:fmt(v,2),to:fmt(n,2)});obj[f]=n;}
  };
  const clampYears=(obj,min,max,label)=>{for(const k of Object.keys(obj||{}))clampField(obj,k,min,max,label+" "+k);};
  for(const [k,[min,max]] of Object.entries(CALC_BASE_FIELDS))clampField(c.base,k,min,max,"Basisdaten "+k);
  if(!isPlainObject(c.base.raises))c.base.raises={};
  clampYears(c.base.raises,-20,50,"Tariferhöhung");
  for(const [k,[min,max]] of Object.entries(CALC_EVAL_FIELDS))clampField(c.eval,k,min,max,"Auswertung "+k);
  for(const key of Object.keys(CALC_LISTS)){
    const def=CALC_LISTS[key];if(def.md)continue;
    const list=getP(state,def.path);
    const rows=(Array.isArray(list)?list:[]).slice(0,CALC_MAX_ROWS).map(row=>{
      const r=Object.assign(calcNewRow(key),isPlainObject(row)?row:{});
      for(const f of CALC_LEGACY_FIELDS[key]||[])delete r[f];
      return r;
    });
    rows.forEach((row,i)=>{
      for(const [f,type,a,b] of def.fields){
        const label=def.label+" Zeile "+(i+1);
        if(type==="num"||type==="pct")clampField(row,f,a,b,label);
        else if(type==="sel"&&!a.includes(row[f]))row[f]=a[0];
        else if(type==="check")row[f]=row[f]===true;
        else if(type==="years"){if(!isPlainObject(row[f]))row[f]={};clampYears(row[f],0,100000,label+" FTE");}
      }
    });
    setP(state,def.path,rows);
  }
  // Bis V2.11: Wechselkurs der Angebotswährung im OtO; die OtO-Werte stehen jetzt in EUR
  if("rate" in c.oto){
    const old=Number(c.oto.rate);
    if(Number.isFinite(old)&&old!==1&&String(c.oto.currency||"EUR").toUpperCase()!=="EUR")
      fixed.push({label:"OtO-Wechselkurs der Angebotswährung "+c.oto.currency,from:fmt(old,4),to:"entfällt, OtO-Werte in EUR"});
    delete c.oto.rate;
  }
  const cu=c.currency;
  cu.code=String(cu.code||"EUR").trim().toUpperCase().slice(0,3)||"EUR";
  if(!/^[A-Z]{3}$/.test(cu.code))cu.code="EUR";
  if(cu.code==="EUR")cu.rate=1;
  else if(!(Number(cu.rate)>0))cu.rate=1;
  if(typeof cu.date!=="string"||(cu.date&&!calcIsDate(cu.date)))cu.date="";
  return fixed;
}

/* ---- Laufzeit ---- */
const CALC_DAY_MS=86400000;
function calcParseDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
  if(!m)return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  return d.getUTCMonth()===+m[2]-1?d:null;
}
const calcDayDiff=(a,b)=>Math.round((b-a)/CALC_DAY_MS);
// DATEDIF(a;b;"M"): volle Monate
function calcFullMonths(a,b){
  let m=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();
  if(b.getUTCDate()<a.getUTCDate())m--;
  return Math.max(0,m);
}
// Datum um n Monate verschieben (Monatsende begrenzt)
function calcAddMonths(iso,n){
  const d=calcParseDate(iso);if(!d)return iso;
  const y=d.getUTCFullYear(),m=d.getUTCMonth()+n,last=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  return new Date(Date.UTC(y,m,Math.min(d.getUTCDate(),last))).toISOString().slice(0,10);
}
/* Laufzeit und Monatsanteile je Kalenderjahr. Excel: erstes Jahr auf 0,1 Monat abgerundet, letztes aufgerundet,
   Schaltjahr = durch 4 teilbar, höchstens 10 Jahre, Personaldauer = abgerundete Summe. Korrigiert: tagesgenau je Monat
   (monthFrac: Anteil je Kalendermonat, für den Stichtag der Tariferhöhung). */
function calcPeriod(c,req){
  const start=calcParseDate(req.sop),end=calcParseDate(req.eop);
  const y0=start?start.getUTCFullYear():0;
  const P={ok:false,years:[],months:[],monthFrac:[],monthsTotal:0,monthsPersonnel:0,daysYear:start?calcDayDiff(Date.UTC(y0,0,1),Date.UTC(y0+1,0,1)):365,warn:[]};
  if(!start||!end){P.warn.push("Start und Ende der Leistung eingeben (Register Projekt & Basisdaten).");return P;}
  if(end<start){P.warn.push("Das Leistungsende liegt vor dem Start.");return P;}
  const y1=end.getUTCFullYear();
  if(y1-y0>=60){P.warn.push("Laufzeiten über 60 Jahre werden nicht berechnet.");return P;}
  if(c.excelMode){
    const total=calcFullMonths(start,new Date(end.getTime()+CALC_DAY_MS));
    const dy=y=>y%4===0?366:365;
    for(let y=y0;P.years.length<10;y++){
      let m;
      if(y0===y1)m=total;
      else if(y===y0)m=Math.floor((calcDayDiff(start,Date.UTC(y,11,31))+1)/dy(y)*120+1e-9)/10;
      else if(y!==y1)m=12;
      else m=Math.ceil((calcDayDiff(Date.UTC(y,0,1),end)+1)/dy(y)*120-1e-9)/10;
      P.years.push(y);P.months.push(m);P.monthFrac.push(null);
      if(y>=y1)break;
    }
    if(y1-y0+1>10)P.warn.push("Excel-kompatibel: Die Personalkosten berücksichtigen nur die ersten 10 Kalenderjahre.");
    P.monthsTotal=total;
    P.monthsPersonnel=Math.floor(P.months.reduce((a,b)=>a+b,0)+1e-9);
  }else{
    for(let y=y0;y<=y1;y++){
      const frac=[];
      for(let mo=0;mo<12;mo++){
        const ms=Date.UTC(y,mo,1),me=Date.UTC(y,mo+1,0),a=Math.max(ms,start.getTime()),b=Math.min(me,end.getTime());
        frac.push(b>=a?(calcDayDiff(a,b)+1)/(calcDayDiff(ms,me)+1):0);
      }
      P.years.push(y);P.months.push(frac.reduce((a,b)=>a+b,0));P.monthFrac.push(frac);
    }
    P.monthsTotal=P.monthsPersonnel=P.months.reduce((a,b)=>a+b,0);
  }
  P.ok=P.monthsTotal>0;
  if(!P.ok)P.warn.push("Die Laufzeit ist kürzer als ein Monat.");
  return P;
}

/* ---- Rechenkern ---- */
function calcNum(v,min,max){const n=Number(v);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):0;}
const calcNameKey=s=>String(s||"").trim().toLowerCase();
/* opts.factors: Faktoren der Sensitivitätsanalyse (wage, sal, fte, opex, nu, capex, rampup) */
function computeCalc(state,opts){
  opts=opts||{};
  const fac=Object.assign({wage:1,sal:1,fte:1,opex:1,nu:1,capex:1,rampup:1},opts.factors||{});
  const c=state.calc||calcDefaults(),req=state.request||{},b=c.base||{},ev=c.eval||{};
  const g=k=>calcNum(b[k],CALC_BASE_FIELDS[k][0],CALC_BASE_FIELDS[k][1]),pct=k=>g(k)/100;
  const evNum=k=>calcNum(ev[k]==null?calcDefaults().eval[k]:ev[k],CALC_EVAL_FIELDS[k][0],CALC_EVAL_FIELDS[k][1]);
  const P=calcPeriod(c,req),warn=P.warn.slice(),excel=!!c.excelMode;
  const gew=pct("profit"),ris=pct("risk"),hv=pct("hv"),bu=pct("bu"),nl=pct("nl"),verh=pct("negotiation"),raise=pct("raise");
  const umlg=hv+bu+nl,den=1-umlg-gew-ris,passMarkup=excel?0:pct("passMarkup");
  if(den<=0.0001)warn.push("Umlagen, Gewinn und Risiko ergeben zusammen 100 % oder mehr; die Zuschläge im Hundert sind nicht berechenbar.");
  if(verh>=0.9)warn.push("Die Verhandlungsmarge ist zu hoch.");
  const inH=x=>den>0.0001?x/den:0,withVerh=x=>verh<0.9?x/(1-verh):0;
  // Ø produktive Jahresstunden
  const grossDays=P.daysYear-g("weekendDays")-g("holidays");
  const presence=grossDays-g("vacation")-g("sick")-g("otherOff");
  if(presence<=0)warn.push("Keine Anwesenheitstage: Abwesenheiten prüfen.");
  const hWage=Math.max(0,presence*g("hoursWage")),hSal=Math.max(0,presence*g("hoursSalary"));
  const soz=presence>0?(g("holidays")+g("vacation")+g("sick")+g("otherOff"))/presence:0;
  const svRows=(Array.isArray(b.sv)?b.sv:[]).map(x=>({p:calcNum(x&&x.pct,0,100)/100,cap:excel?0:calcNum(x&&x.bbg,0,1e7)}));
  const sv=svRows.reduce((a,x)=>a+x.p,0);
  // SV-Anteil je Stunde; Sätze mit Beitragsbemessungsgrenze nur bis zur Grenze des Jahresentgelts je FTE
  const svOn=(T,hours)=>{const ann=T*hours;return T*svRows.reduce((a,x)=>a+x.p*(x.cap>0&&ann>x.cap?x.cap/ann:1),0);};
  const nY=P.years.length,weights=P.months.map(m=>m/12),wSum=weights.reduce((a,x)=>a+x,0);
  const durP=P.monthsPersonnel/12,durT=P.monthsTotal/12;
  // Tarifindex je Kalenderjahr: Erhöhung zum Stichtagsmonat, erstmals im Jahr nach dem Start, Satz je Jahr überschreibbar
  const raiseRate=y=>{const v=(b.raises||{})[String(y)];return calcIsNum(v)?calcNum(v,-20,50)/100:raise;};
  const raiseIdx=P.years.map((y,i)=>{
    if(excel)return Math.pow(1+raise,i);
    const M=Math.round(g("raiseMonth"))-1,frac=P.monthFrac[i]||[];
    let before=1;for(let k=1;k<i;k++)before*=1+raiseRate(P.years[k]);
    if(i===0)return 1;
    const after=before*(1+raiseRate(y));
    const tot=frac.reduce((a,x)=>a+x,0);
    if(!(tot>0))return after;
    return frac.reduce((a,x,mo)=>a+x*(mo>=M?after:before),0)/tot;
  });
  // Volumen je Jahr: Hochlauf im ersten Kalenderjahr, Wachstum ab dem zweiten
  const vol=P.years.map((y,i)=>excel?1:(i===0?pct("firstYearPct"):1)*Math.pow(1+pct("volumeGrowth"),i));
  const avgW=arr=>wSum>0?arr.reduce((a,x,i)=>a+x*weights[i],0)/wSum:0;

  // Tarifgruppen und Personalbedarf (Eingabehilfen, beide Modi)
  const grades=new Map();
  for(const gr of Array.isArray(c.grades)?c.grades:[]){const k=gr.kind+"|"+calcNameKey(gr.name);if(calcNameKey(gr.name)&&!grades.has(k))grades.set(k,calcNum(gr.rate,0,1e8));}
  const quals=new Map(),dupQuals=new Set();
  for(const [key,list] of [["salaries",c.salaries],["wages",c.wages]])(Array.isArray(list)?list:[]).forEach((row,i)=>{
    const k=calcNameKey(row.name);if(!k)return;
    if(quals.has(k))dupQuals.add(row.name.trim());else quals.set(k,{key,i});
  });
  const needFte=new Map(),need=(Array.isArray(c.need)?c.need:[]).map(row=>{
    const t=quals.get(calcNameKey(row.qual)),hDay=t&&t.key==="salaries"?g("hoursSalary"):g("hoursWage");
    const a=calcNum(row.a,0,1e9),bb=calcNum(row.b,0,1e9),allow=calcNum(row.allow,0,300)/100;
    const fte=row.mode==="Schicht"?a*bb*(1+allow):(bb>0&&hDay>0?a/(bb*hDay)*(1+allow):0);
    if(t){const k=t.key+":"+t.i;needFte.set(k,(needFte.get(k)||0)+fte);}
    return {name:String(row.name||""),qual:String(row.qual||""),target:t||null,fte,hDay};
  });

  // Personalkosten: Zuschlagskette 100 … 700 je Qualifikation, Kosten je Kalenderjahr
  function person(list,isWage){
    const key=isWage?"wages":"salaries",kind=isWage?"Lohn":"Gehalt";
    const zusBase=isWage?soz+pct("wageBonus")+pct("wageOther"):pct("salBonus")+pct("salOther");
    const special=isWage?pct("wageSpecial"):pct("salSpecial"),hours=isWage?hWage:hSal;
    const chain=(R,zus)=>{const Sz=R*zus,T=R+Sz,U=svOn(T,hours),V=T+U,W=inH(V)*umlg,X=V+W,Y=inH(V)*(gew+ris),Z=X+Y,AB=withVerh(Z),AA=AB-Z,AC=AB*special,AD=AB+AC;return {R,Sz,T,U,V,W,X,Y,Z,AA,AB,AC,AD};};
    const rows=(Array.isArray(list)?list:[]).map((row,ri)=>{
      const linked=needFte.has(key+":"+ri);
      const fteIn=(linked?needFte.get(key+":"+ri):calcNum(row.fte,0,1e5))*fac.fte;
      const gradeRate=row.grade?grades.get(kind+"|"+calcNameKey(row.grade)):undefined;
      const rate=(gradeRate!==undefined?gradeRate:calcNum(row.rate,0,1e8))*(isWage?fac.wage:fac.sal);
      const gross=calcNum(row.gross,0,500)/100,zus=zusBase+calcNum(row.extra,0,300)/100;
      const yearly=raiseIdx.map(ix=>rate*ix),toHour=v=>isWage?v:(hSal>0?v/hSal:0);
      const ovr=isPlainObject(row.fteYears)?row.fteYears:{};
      const yr=P.years.map((y,i)=>{
        const o=ovr[String(y)],fteY=excel?fteIn:(calcIsNum(o)?calcNum(o,0,1e5)*fac.fte:fteIn*vol[i]);
        const V=chain(toHour(yearly[i]),zus).V,F=fteY*(1+gross),AF=hours*F,ann=AF*V;
        return {fte:fteY,F,AF,V,ann,cost:ann*P.months[i]/12};
      });
      const R=toHour(wSum>0?avgW(yearly):rate),ch=chain(R,zus);
      let fte,F,AF,AG,AH;
      if(excel||!(durT>0)){
        fte=fteIn;F=fte*(1+gross);AF=hours*F;AG=AF*ch.V;AH=AG*durP;
      }else{
        AH=yr.reduce((a,x)=>a+x.cost,0);AG=AH/durT;
        fte=avgW(yr.map(x=>x.fte));F=avgW(yr.map(x=>x.F));AF=avgW(yr.map(x=>x.AF));
      }
      return Object.assign({name:String(row.name||""),fteIn,linked,rate,gradeRate,gross,yearly,yr,F,fte,AF,AG,AH,svEff:ch.T>0?ch.U/ch.T:0},ch);
    });
    const sum=k=>rows.reduce((a,x)=>a+x[k],0);
    const f=chain(1,zusBase);f.R=1;
    return {rows,fte:sum("fte"),F:sum("F"),AF:sum("AF"),AG:sum("AG"),AH:sum("AH"),hours,zus:zusBase,special,factors:f,
      yr:P.years.map((y,i)=>rows.reduce((a,x)=>a+x.yr[i].cost,0))};
  }
  const sal=person(c.salaries,false),wage=person(c.wages,true);

  // Sachkosten; korrigiert: Steigerung je Kalenderjahr, Einmalkosten mit Kalkulationszins als Annuität, Durchreichposten
  const mT=P.monthsTotal,costRaise=excel?0:pct("costRaise"),interest=excel?0:pct("interest");
  const escY=P.years.map((y,i)=>Math.pow(1+costRaise,i)),esc=wSum>0?avgW(escY):1;
  const annuity=interest>0&&durT>0?interest/(1-Math.pow(1+interest,-durT)):0;
  const costRows=(key,list)=>(Array.isArray(list)?list:[]).map(x=>{
    const q=calcNum(x.qty,0,1e7),p=calcNum(x.price,-1e10,1e10),pass=!excel&&x.pass===true,f=fac[key];
    const cat=String(x.category||"").trim();
    if(key==="capex"||key==="rampup"){
      const nominal=q*p*f,P0=P.months,empty=()=>P0.map(()=>0);
      const proc=key==="capex"&&!excel&&["Leasing","Miete"].includes(x.procurement)?x.procurement:"Kauf";
      const life=key==="capex"&&!excel?calcNum(x.usefulLife,0,100):0;
      const startM=key==="capex"&&!excel?Math.max(0,Math.round(calcNum(x.startYear,0,100))-1)*12:0;
      const row={name:String(x.name||""),category:cat,q,p,pass,proc,life,startYear:startM/12+1,nominal:proc==="Kauf"?nominal:0,
        dep:0,interest:0,bookEnd:0,endCharge:0,recovery:0,outside:false,leaseCompressed:false,cashT0:0,cashOut:empty(),cashIn:empty()};
      // Anteil eines Zeitraums [von, von+Dauer) in Vertragsmonaten je Kalenderscheibe
      const spread=(from,len,amount)=>{let cum=0;return P0.map(m=>{const ov=Math.max(0,Math.min(cum+m,from+len)-Math.max(cum,from));cum+=m;return len>0?amount*ov/len:0;});};
      const finish=yr=>{const lz=yr.reduce((a,v)=>a+v,0);return Object.assign(row,{yr,lz,pa:durT>0?lz/durT:0});};
      if(life<=0&&startM===0){
        // Ohne Nutzungsdauer: über die Laufzeit, Kauf linear oder als Annuität
        if(proc!=="Kauf")return finish(spread(0,mT,nominal));
        const pa=annuity?nominal*annuity:(mT>0?nominal/mT*12:0);
        return Object.assign(row,{pa,lz:annuity?pa*durT:nominal,yr:P0.map(m=>pa*m/12),cashT0:nominal,dep:nominal,interest:annuity?pa*durT-nominal:0});
      }
      if(startM>=mT){row.outside=true;row.nominal=0;return finish(empty());}
      const useM=life>0?life*12:mT-startM;
      if(proc!=="Kauf"){
        // Leasing/Miete: keine Kapitalbindung; Kosten über die Nutzung innerhalb der Laufzeit
        row.leaseCompressed=useM>mT-startM;
        return finish(spread(startM,Math.min(useM,mT-startM),nominal));
      }
      // Kauf mit Nutzungsdauer: lineare Abschreibung über Vertragsmonate ab Startjahr, kalkulatorische Zinsen auf den Restbuchwert
      const residual=life>0?Math.min(Math.max(0,calcNum(x.residual,0,1e10)),Math.max(0,nominal)):0;
      const depY=spread(startM,useM,nominal-residual);
      let book=0,cum=0;
      const intY=P0.map((m,i)=>{
        const a=cum,e=cum+m;cum=e;
        if(e<=startM)return 0;
        if(a<=startM)book=nominal;
        const z=interest*Math.max(0,book-depY[i]/2)*(Math.min(e,mT)-Math.max(a,startM))/12;
        book-=depY[i];return z;
      });
      const dep=depY.reduce((a,v)=>a+v,0),bookEnd=Math.max(0,nominal-dep);
      // Vertragsende: Verwertung zum Restwert (übriger Buchwert wird belastet) oder Übernahme durch den Kunden zum Restbuchwert
      const recovery=calcNum(b.residualMode,0,1)===1?bookEnd:Math.min(residual,bookEnd),endCharge=bookEnd-recovery;
      const yr=depY.map((d,i)=>d+intY[i]);
      if(yr.length){yr[yr.length-1]+=endCharge;row.cashIn[yr.length-1]=recovery;}
      if(startM===0)row.cashT0=nominal;
      else{let c2=0;P0.forEach((m,i)=>{if(startM>=c2&&startM<c2+m)row.cashOut[i]=nominal;c2+=m;});}
      Object.assign(row,{dep,interest:intY.reduce((a,v)=>a+v,0),bookEnd,endCharge,recovery,residual});
      return finish(yr);
    }
    const base=q*p*(key==="opex"?12:1)*f,yr=P.months.map((m,i)=>base*escY[i]*m/12);
    const lz=excel?base*durT:yr.reduce((a,v)=>a+v,0);
    return {name:String(x.name||""),category:cat,q,p,pass,nominal:0,pa:excel?base:(durT>0?lz/durT:base),lz,yr};
  });
  const cost={};
  for(const key of CALC_COST_KEYS){
    const rows=costRows(key,c[key]),s=(arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0),pr=rows.filter(x=>x.pass),own=rows.filter(x=>x.proc==="Kauf");
    const perSlice=(arr,f)=>P.years.map((y,i)=>arr.reduce((a,x)=>a+(f(x)[i]||0),0));
    cost[key]={rows,pa:s(rows,"pa"),lz:s(rows,"lz"),nominal:s(rows,"nominal"),passPa:s(pr,"pa"),passLz:s(pr,"lz"),
      yr:perSlice(rows,x=>x.yr),yrPass:perSlice(pr,x=>x.yr),
      // Zahlungsströme der Einmalkosten: Kauf zum Start bzw. im Startjahr, Rückfluss zum Vertragsende; Abschreibung/Annuität nicht zahlungswirksam
      cashT0:s(rows,"cashT0"),cashOut:perSlice(rows,x=>x.cashOut||[]),cashIn:perSlice(rows,x=>x.cashIn||[]),amortYr:perSlice(own,x=>x.yr),
      bookEnd:s(rows,"bookEnd"),endCharge:s(rows,"endCharge"),recovery:s(rows,"recovery"),interest:s(rows,"interest")};
  }

  // Summary: Zuschläge im Hundert auf die Projektkosten ohne Durchreichposten, Durchreichposten mit festem Aufschlag
  const hoursAll=sal.AF+wage.AF;
  const groups=[
    {key:"sal",label:"I-1. Personalkosten Gehälter",pa:sal.AG,lz:excel?sal.AG*durT:sal.AH,hours:sal.AF,passPa:0,passLz:0,yr:sal.yr},
    {key:"wage",label:"I-2. Personalkosten Löhne",pa:wage.AG,lz:excel?wage.AG*durT:wage.AH,hours:wage.AF,passPa:0,passLz:0,yr:wage.yr},
    ...CALC_COST_KEYS.map(k=>({key:k,label:{capex:"II-1. Investitionen/Einmalkosten",opex:"II-2. Monatliche Betriebskosten/Verbräuche",nu:"II-3. Nachunternehmerleistung",rampup:"II-4. Ramp-up-Kosten"}[k],
      pa:cost[k].pa,lz:cost[k].lz,hours:hoursAll,passPa:cost[k].passPa,passLz:cost[k].passLz,yr:cost[k].yr,yrPass:cost[k].yrPass}))
  ];
  const level=(K,Kp)=>{
    const base=inH(K-Kp),um=base*umlg,ge=base*gew,ri=base*ris,pm=Kp*passMarkup,uov=base+Kp+pm,ve=verh<0.9?verh*uov/(1-verh):0;
    return {K,Kp,um,sk:K+um,ge,ri,pm,uov,ve,umv:uov+ve,base};
  };
  const tot=k=>groups.reduce((a,x)=>a+x[k],0);
  const sum={pa:level(tot("pa"),tot("passPa")),lz:level(tot("lz"),tot("passLz"))};

  // OtO-Werte in EUR (Umrechnung aus der Kalkulationswährung); korrigiert: HV+BU als Anteil am Umsatz ohne Verhandlung
  const cur=calcCurrency(c),fx=1/cur.rate;
  const s=sum.pa,hvbu=hv+bu;
  const oto=(to,ebita)=>{
    const gp=excel?(to?(ebita/to+hvbu)*to:0):ebita+s.base*hvbu;
    return {to:to*fx,ebita:ebita*fx,gp:gp*fx,ebitaPct:to?ebita/to:0,gpPct:to?gp/to:0};
  };
  const offer=oto(s.umv,s.ge+s.pm+s.ve),walk=oto(s.uov,s.ge+s.pm);
  const fteNet=sal.fte+wage.fte;
  // Sachkosten nach Kategorie
  const catMap=new Map();
  for(const key of CALC_COST_KEYS)for(const x of cost[key].rows){const k=x.category||"";const v=catMap.get(k)||{name:k,pa:0,lz:0,n:0};v.pa+=x.pa;v.lz+=x.lz;v.n++;catMap.set(k,v);}
  const categories=[...catMap.values()].sort((a,b)=>(a.name?0:1)-(b.name?0:1)||b.lz-a.lz);

  // Ergebnis je Kalenderjahr bei Festpreis (Angebotspreis p.a., optional mit Preisgleitung) und Cashflow
  const pg=evNum("priceIndex")/100,gI=P.years.map((y,i)=>Math.pow(1+pg,i));
  const gAvg=wSum>0?avgW(gI):1;
  const invest=cost.capex.cashT0+cost.rampup.cashT0;
  const years=P.years.map((y,i)=>{
    const m=P.months[i],pers=sal.yr[i]+wage.yr[i],mat=CALC_COST_KEYS.reduce((a,k)=>a+cost[k].yr[i],0);
    const Kp=CALC_COST_KEYS.reduce((a,k)=>a+cost[k].yrPass[i],0),K=pers+mat,L=level(K,Kp);
    const rev=s.umv*m/12*(gAvg>0?gI[i]/gAvg:1),ebita=rev-L.sk-L.ri;
    const amort=cost.capex.amortYr[i]+cost.rampup.amortYr[i],invOut=cost.capex.cashOut[i],recovery=cost.capex.cashIn[i];
    const inflow=rev+recovery,outflow=L.sk-amort+invOut,cash=inflow-outflow;
    return {year:y,months:m,pers,mat,K,sk:L.sk,ri:L.ri,rev,ebita,margin:rev?ebita/rev:0,costPrice:L.umv,amort,invOut,recovery,inflow,outflow,cash,cum:0};
  });
  // Amortisation, Kapitalwert und interne Verzinsung; Investitionen und Ramp-up zum Start
  let tEnd=0,payback=null,cum=-invest;
  const flows=[{t:0,v:-invest}];
  for(const x of years){
    const prev=cum;cum+=x.cash;x.cum=cum;
    if(payback===null&&invest>0&&prev<0&&cum>=0&&x.cash>0)payback=tEnd*12+x.months*(-prev/x.cash);
    tEnd+=x.months/12;flows.push({t:tEnd,v:x.cash});
  }
  const investLater=years.reduce((a,x)=>a+x.invOut,0);
  if(invest<=0&&investLater<=0)payback=0;
  const disc=evNum("discount")/100,npvAt=r=>flows.reduce((a,f)=>a+f.v/Math.pow(1+r,f.t),0);
  let irr=null;
  if(flows.some(f=>f.v<0)&&flows.some(f=>f.v>0)){
    let lo=-0.99,hi=10,flo=npvAt(lo),fhi=npvAt(hi);
    if(flo*fhi<0){for(let k=0;k<200;k++){const mid=(lo+hi)/2,fm=npvAt(mid);if(flo*fm<=0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;}}irr=(lo+hi)/2;}
  }
  const minMargin=evNum("minMargin")/100;
  const floor=minMargin<1?(s.sk+s.ri)/(1-minMargin):0;
  return {period:P,warn,excel,
    rates:{gew,ris,hv,bu,nl,umlg,verh,raise,den,hvbu,costRaise,interest,esc,annuity,passMarkup,raiseIdx,vol},
    days:{grossDays,presence,hWage,hSal,soz,sv,grossSuggest:presence>0?grossDays/presence-1:0},
    sal,wage,cost,categories,need,dupQuals:[...dupQuals],groups,sum,hoursAll,fteNet,fteGross:sal.F+wage.F,perFte:fteNet>0?s.umv/fteNet:0,
    years,cash:{invest,investLater,payback,npv:npvAt(disc),irr,discount:disc,final:cum,recovery:cost.capex.recovery,bookEnd:cost.capex.bookEnd},
    price:{floor,headroom:s.umv-floor,headroomPct:s.umv?(s.umv-floor)/s.umv:0,minMargin},
    eval:{priceIndex:pg,vkMin:evNum("vkMin"),vkMax:evNum("vkMax"),sensi:evNum("sensi")/100},
    oto:{offer,walk,invest:cost.capex.nominal*fx,leasing:cost.opex.pa*fx,fx,currency:"EUR",calcCurrency:cur.code,rate:cur.rate,offerCurrency:(c.oto&&c.oto.currency)||"EUR"}};
}

/* ---- Sensitivität: Ein-Punkt-Variation; Wirkung auf den kostendeckenden Angebotspreis und auf das EBITA bei festem Preis ---- */
function calcSensitivity(state,base){
  const d=base.eval.sensi,fixed=base.sum.pa.umv,ebitaAt=r=>fixed-r.sum.pa.sk-r.sum.pa.ri,e0=ebitaAt(base),pct=v=>(v>0?"+":"−")+fmt(Math.abs(v)*100,0)+" %";
  const clone=fn=>{const st=JSON.parse(JSON.stringify(state));fn(st);return computeCalc(st);};
  const byFactor=(k,sg)=>computeCalc(state,{factors:{[k]:1+sg*d}});
  const drivers=[
    ["wage","Stundenlöhne",sg=>byFactor("wage",sg),pct(-d),pct(d)],
    ["sal","Gehälter",sg=>byFactor("sal",sg),pct(-d),pct(d)],
    ["fte","Personalbedarf (FTE)",sg=>byFactor("fte",sg),pct(-d),pct(d)],
    // Mehr Krankheitstage: gleiche Anwesenheit erfordert mehr Brutto-FTE (Brutto-Zuschlag im Verhältnis der Anwesenheitstage)
    ["sick","Krankheitstage",sg=>clone(st=>{
      const p0=base.days.presence,b=st.calc.base;b.sick=Math.max(0,(+b.sick||0)+sg*3);
      const p1=computeCalc(st).days.presence;
      if(p0>0&&p1>0)for(const row of st.calc.salaries.concat(st.calc.wages))row.gross=((1+(+row.gross||0)/100)*p0/p1-1)*100;
    }),"−3 Tage","+3 Tage"],
    ["raise","Personalkostensteigerung p.a.",sg=>clone(st=>{st.calc.base.raise=(+st.calc.base.raise||0)+sg;}),"−1 Pp.","+1 Pp."],
    ["opex","Betriebskosten",sg=>byFactor("opex",sg),pct(-d),pct(d)],
    ["nu","Nachunternehmer",sg=>byFactor("nu",sg),pct(-d),pct(d)],
    ["capex","Investitionen",sg=>byFactor("capex",sg),pct(-d),pct(d)],
    ["rampup","Ramp-up",sg=>byFactor("rampup",sg),pct(-d),pct(d)],
    ["term","Laufzeit",sg=>clone(st=>{st.request.eop=calcAddMonths(st.request.eop,sg*12);}),"−12 Monate","+12 Monate"]
  ];
  return drivers.map(([key,label,run,lowTxt,highTxt])=>{
    const lo=run(-1),hi=run(1),ok=x=>x.period.ok;
    return {key,label,lowTxt,highTxt,
      eLow:ok(lo)?ebitaAt(lo)-e0:0,eHigh:ok(hi)?ebitaAt(hi)-e0:0,
      pLow:ok(lo)?lo.sum.pa.umv-fixed:0,pHigh:ok(hi)?hi.sum.pa.umv-fixed:0};
  }).sort((a,b)=>Math.max(Math.abs(b.eLow),Math.abs(b.eHigh))-Math.max(Math.abs(a.eLow),Math.abs(a.eHigh)));
}

/* ---- Plausibilität ---- */
// Unveränderte neue Zeile (etwa beim Ausfüllen einer späteren Leerzeile entstanden): ohne Hinweise
const calcRowEmpty=(key,row)=>!!row&&JSON.stringify(Object.assign(calcNewRow(key),row))===JSON.stringify(calcNewRow(key));
function calcChecks(state,r){
  const c=state.calc,out=[],warn=t=>out.push({sev:"warn",text:t}),info=t=>out.push({sev:"info",text:t});
  for(const w of r.warn)warn(w);
  const maxY=Math.max(...Object.keys(CALC_MIN_WAGE).map(Number)),minWage=y=>CALC_MIN_WAGE[Math.min(y,maxY)];
  let laterYears=false;
  const eurCalc=r.oto.calcCurrency==="EUR";
  if(!eurCalc&&r.wage.rows.length)info("Mindestlohnprüfung nur bei Kalkulationswährung EUR (gesetzlicher Mindestlohn Deutschland).");
  if(eurCalc)r.wage.rows.forEach((x,i)=>{
    r.period.years.forEach((y,k)=>{
      if(y<2024||!(x.yearly[k]>0))return;
      if(y>maxY)laterYears=true;
      if(x.yearly[k]+1e-9<minWage(y))warn("Mindestlohn: „"+(x.name||"Lohn "+(i+1))+"“ liegt "+y+" mit "+fmt(x.yearly[k],2)+" €/h unter "+fmt(minWage(y),2)+" €/h.");
    });
  });
  if(laterYears&&r.wage.rows.length)info("Mindestlohn ab "+(maxY+1)+" noch nicht festgelegt; geprüft gegen "+fmt(CALC_MIN_WAGE[maxY],2)+" €/h.");
  for(const [key,res] of [["salaries",r.sal],["wages",r.wage]]){
    res.rows.forEach((x,i)=>{
      if(calcRowEmpty(key,c[key][i]))return;
      const where=CALC_LISTS[key].label+" Zeile "+(i+1)+(x.name?" („"+x.name+"“)":"");
      if(!x.name.trim())info(CALC_LISTS[key].label+" Zeile "+(i+1)+": ohne Bezeichnung.");
      if(!(x.fteIn>0))info(where+": ohne FTE.");
      if(x.fteIn>0&&x.gross===0&&r.days.grossSuggest>=0.05)(key==="wages"?warn:info)(where+": ohne FTE-Brutto-Zuschlag (Vorschlag "+calcPct(r.days.grossSuggest)+").");
      const row=c[key][i];
      if(row&&row.grade&&x.gradeRate===undefined)warn(where+": Tarifgruppe „"+row.grade+"“ nicht gefunden (Art "+(key==="wages"?"Lohn":"Gehalt")+").");
      if(key==="wages"&&x.fteIn>0&&(x.AB<r.eval.vkMin||x.AB>r.eval.vkMax))info(where+": VK-Satz "+fmt(x.AB,2)+" €/h außerhalb der Spanne "+fmt(r.eval.vkMin,0)+"–"+fmt(r.eval.vkMax,0)+" €/h.");
    });
  }
  for(const n of r.dupQuals)warn("Qualifikation „"+n+"“ mehrfach vorhanden; der Personalbedarf wird der ersten Zeile zugeordnet.");
  r.need.forEach((x,i)=>{
    if(calcRowEmpty("need",c.need[i]))return;
    if(!x.qual.trim())warn("Personalbedarf Zeile "+(i+1)+": keine Qualifikation zugeordnet.");
    else if(!x.target)warn("Personalbedarf Zeile "+(i+1)+": Qualifikation „"+x.qual+"“ nicht in Gehältern oder Löhnen gefunden.");
    if(!(x.fte>0))info("Personalbedarf Zeile "+(i+1)+(x.name?" („"+x.name+"“)":"")+": ergibt 0 FTE (Menge und Leistung bzw. Schichten und Besetzung prüfen).");
  });
  for(const key of CALC_COST_KEYS)(c[key]||[]).forEach((row,i)=>{if(!String(row.name||"").trim()&&row.price)info(CALC_LISTS[key].label+" Zeile "+(i+1)+": ohne Bezeichnung.");});
  if(r.period.ok&&r.sum.pa.umv>0){
    if(r.oto.offer.ebitaPct<r.price.minMargin)warn("EBITA-Marge des Angebots ("+calcPct(r.oto.offer.ebitaPct)+") unter der Mindestmarge ("+calcPct(r.price.minMargin)+").");
    const neg=r.years.filter(x=>x.months>0&&x.ebita<0).map(x=>x.year);
    if(neg.length)warn("Festpreis: negatives EBITA in "+neg.join(", ")+". Preisgleitung oder Aufschlag prüfen.");
    if(r.cash.invest+r.cash.investLater>0&&r.cash.payback===null)warn("Investitionen und Ramp-up amortisieren sich nicht innerhalb der Laufzeit.");
  }
  // Abschreibung, Beschaffung und Restbuchwert
  if(!r.excel){
    const takeover=calcNum(c.base&&c.base.residualMode,0,1)===1,mT=r.period.monthsTotal;
    r.cost.capex.rows.forEach((x,i)=>{
      const where=CALC_LISTS.capex.label+" Zeile "+(i+1)+(x.name?" („"+x.name+"“)":"");
      if(x.outside)warn(where+": Startjahr "+x.startYear+" liegt nach dem Vertragsende; die Position wird nicht berücksichtigt.");
      if(x.leaseCompressed)warn(where+": "+x.proc+" läuft über das Vertragsende hinaus; die gesamten Kosten werden innerhalb der Laufzeit angesetzt. Nutzungsdauer an die Laufzeit anpassen oder Übernahme durch den Kunden vereinbaren.");
      if(x.proc==="Kauf"&&x.life>0&&(x.startYear-1)*12+x.life*12<mT-1e-9)info(where+": Nutzungsdauer endet vor dem Vertragsende; Ersatzinvestition prüfen.");
      const raw=(c.capex||[])[i]||{};
      if(x.proc!=="Kauf"&&calcNum(raw.residual,0,1e10)>0)info(where+": Restwert wird bei "+x.proc+" nicht berücksichtigt.");
      if(x.proc==="Kauf"&&calcNum(raw.residual,0,1e10)>x.nominal+1e-9&&x.nominal>0)warn(where+": Restwert über dem Anschaffungswert; begrenzt auf "+calcEur(x.nominal)+".");
      if(x.proc==="Kauf"&&!(x.life>0)&&calcNum(raw.residual,0,1e10)>0)info(where+": Restwert wirkt nur mit Nutzungsdauer.");
    });
    if(takeover&&r.cost.capex.bookEnd>0.5)warn("Restbuchwert "+calcEur(r.cost.capex.bookEnd)+" zum Vertragsende wird vom Kunden übernommen; Übernahme vertraglich vereinbaren.");
    else if(!takeover&&r.cost.capex.endCharge>0.5)info("Restbuchwert über dem Restwert ("+calcEur(r.cost.capex.endCharge)+") wird im letzten Vertragsjahr abgeschrieben.");
  }
  if(!r.excel&&r.sal.rows.concat(r.wage.rows).some(x=>x.svEff<r.days.sv-1e-9))info("Beitragsbemessungsgrenzen senken den SV-Anteil bei mindestens einer Qualifikation (Personalkosten › Stundensätze).");
  return out;
}

/* ---- Darstellung ---- */
let CALC=null;
const calcEur=(n,d)=>fmt(n,d===undefined?0:d)+" €";
// Werte in EUR unabhängig von der Kalkulationswährung (OtO); „€“ bleibt nur bei Kalkulationswährung EUR
const calcEurFix=(n,d)=>fmt(n,d===undefined?0:d)+(calcCurSym()==="€"?" €":" EUR");
const calcPct=(n,d)=>fmt(n*100,d===undefined?2:d)+" %";
function calcFmtIn(v){return Number.isFinite(Number(v))?Number(v).toLocaleString(APP_LOCALE,{maximumFractionDigits:10}):"";}
// Deutsche Schreibweise: Punkt als Tausender-, Komma als Dezimaltrennzeichen; € und % werden ignoriert
function calcParse(text){
  let s=String(text==null?"":text).trim().replace(/[\s €%]/g,"");
  s=s.replace(/^−/,"-");
  // Englisch: Komma als Tausender-, Punkt als Dezimaltrennzeichen
  if(APP_LANG==="en"&&s){s=s.replace(/,/g,"");const n=Number(s);return Number.isFinite(n)?n:NaN;}
  if(!s)return null;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const n=Number(s);
  return Number.isFinite(n)?n:NaN;
}
// .co: Text, .coh: HTML (Diagramme); beide werden bei Eingaben ohne Neuaufbau nachgeführt
const co=(text,cls)=>'<span class="co'+(cls?" "+cls:"")+'">'+escH(text)+'</span>';
const coh=html=>'<div class="coh">'+html+'</div>';
const tdo=(text,cls)=>'<td class="calc'+(cls?" "+cls:"")+'">'+co(text)+'</td>';
function calcInput(path,type,o){
  o=o||{};
  const v=getP(S,path);
  const range=o.min!=null&&o.max!=null&&(type==="num"||type==="pct")?' title="Zulässig: '+escH(fmt(o.min,o.min%1?6:0))+' bis '+escH(fmt(o.max,0))+(type==="pct"?" %":"")+'"':'';
  const attrs=' data-cf="'+escH(path)+'" data-ct="'+type+'"'+range+(o.placeholder?' placeholder="'+escH(o.placeholder)+'"':'')+(o.min!=null?' data-min="'+o.min+'"':'')+(o.max!=null?' data-max="'+o.max+'"':'')+
    (o.list?' list="'+o.list+'"':'')+(o.cl?' data-cl="'+o.cl+'" data-ci="'+o.ci+'" data-cc="'+o.cc+'"':'')+' aria-label="'+escH(o.label||"")+'"';
  if(type==="check")return '<input type="checkbox"'+attrs+(v?' checked':'')+'>';
  if(type==="nsel")return '<select class="ci"'+attrs+'>'+(o.options||[]).map(([k,t])=>'<option value="'+k+'"'+(Number(v)===k?' selected':'')+'>'+escH(t)+'</option>').join("")+'</select>';
  if(type==="sel")return '<select class="ci"'+attrs+'>'+(o.options||[]).map(x=>'<option value="'+escH(x)+'"'+(x===v?' selected':'')+'>'+escH(x)+'</option>').join("")+'</select>';
  const val=type==="text"||type==="date"?(v==null?"":String(v)):(v===""||v==null?"":calcFmtIn(v));
  return '<input class="ci'+(type==="num"||type==="pct"?' num':'')+(o.cls?' '+o.cls:'')+'" type="'+(type==="date"?"date":"text")+'"'+(type==="num"||type==="pct"?' inputmode="decimal"':'')+
    (type==="text"?' maxlength="'+(o.maxlength||200)+'"':'')+attrs+' value="'+escH(val)+'">';
}
const calcField=(label,inner,tip,wide)=>{

const calcOutField=(label,text,tip)=>'<div class="mf"><span>'+escH(label)+(tip?tipHtml(tip):'')+'</span><span class="cout">'+co(text)+'</span></div>';
function calcList(key){const l=getP(S,CALC_LISTS[key].path);return Array.isArray(l)?l:[];}
function calcRowBtns(key,i,n){

}
/* Listentabelle: cols {h, f (Eingabefeld) | out(i) (Ausgabe), num, tip, calc(i) (Ausgabe statt Eingabe, wenn nicht null), list(i)};
   foot: Zellen der Summenzeile nach der Nr-Spalte */
function calcListHtml(key,cols,foot,o){
  o=o||{};
  const def=CALC_LISTS[key],list=calcList(key);
  const act=!o.noActions,cc=c=>c.cls?" "+c.cls:"";
  const head='<tr><th class="cn">Nr</th>'+cols.map(c=>'<th'+(c.num||c.cls?' class="'+(c.num?"r":"")+cc(c)+'"':'')+'>'+escH(c.h)+(c.tip?tipHtml(c.tip):'')+'</th>').join("")+(act?'<th class="cact"><span class="sr-only">Zeilenaktionen</span></th>':'')+'</tr>';
  const body=list.map((row,i)=>'<tr><td class="cn">'+(i+1)+'</td>'+cols.map(c=>{
    if(!c.f)return tdo(c.out(i),c.cls);
    const fixed=c.calc?c.calc(i):null;
    if(fixed!=null)return tdo(fixed,"linked"+cc(c));
    const fi=def.fields.findIndex(f=>f[0]===c.f),fd=def.fields[fi],t=fd[1];
    return '<td class="cin'+(t==="check"?' cc':'')+cc(c)+'">'+calcInput(def.path+"."+i+"."+c.f,t,{min:t==="sel"?undefined:fd[2],max:fd[3],options:t==="sel"?fd[2]:undefined,cl:key,ci:i,cc:fi,
      label:c.h+", Zeile "+(i+1),cls:t==="text"?(c.wide===false?"":"ci-name"):"",placeholder:t==="text"?(c.ph||c.h):"",list:c.list?c.list(i):undefined})+'</td>';
  }).join("")+(act?'<td class="cact">'+calcRowBtns(key,i,list.length)+'</td>':'')+'</tr>').join("")+
    // Leerzeilen wie in Excel: werden erst mit der ersten Eingabe zur Zeile der Liste
    (act?calcGhostRows(key,cols,list.length):'')||
    '<tr><td class="cn"></td><td colspan="'+(cols.length+1)+'" class="hint">Keine Einträge.</td></tr>';
  const tf=foot?'<tfoot><tr><td class="cn"></td>'+foot.map((x,j)=>{const k=cols[j]&&cols[j].cls;return x==null?'<td'+(k?' class="'+k+'"':'')+'></td>':tdo(x,k);}).join("")+(act?'<td></td>':'')+'</tr></tfoot>':'';
  return '<div class="calc-scroll"><table class="calc-tab" data-cl="'+key+'"><thead>'+head+'</thead><tbody>'+body+'</tbody>'+tf+'</table></div>'+
    (act?'<div class="rowbtns"><button type="button" class="btn" data-calc-act="add" data-cl="'+key+'">+ Zeile</button>'+(o.extra||'')+'</div>':'');

// Mindestens CALC_MIN_ROWS Zeilen je Liste und immer CALC_SPARE_ROWS freie Zeilen darunter; Leerzeilen ohne Daten
const CALC_MIN_ROWS=5,CALC_SPARE_ROWS=2;
const calcRowsShown=n=>Math.min(CALC_MAX_ROWS,Math.max(CALC_MIN_ROWS,n+CALC_SPARE_ROWS));
function calcGhostRows(key,cols,n){
  const def=CALC_LISTS[key],cc=c=>c.cls?" "+c.cls:"";let out="";
  for(let i=n;i<calcRowsShown(n);i++){
    out+='<tr class="ghost"><td class="cn">'+(i+1)+'</td>'+cols.map(c=>{
      if(!c.f)return '<td class="calc'+cc(c)+'"></td>';
      const fi=def.fields.findIndex(f=>f[0]===c.f),fd=def.fields[fi],t=fd[1];
      return '<td class="cin'+(t==="check"?' cc':'')+cc(c)+'">'+calcInput(def.path+"."+i+"."+c.f,t,{min:t==="sel"?undefined:fd[2],max:fd[3],options:t==="sel"?fd[2]:undefined,cl:key,ci:i,cc:fi,
        label:c.h+", Zeile "+(i+1),cls:t==="text"?(c.wide===false?"":"ci-name"):"",list:c.list?c.list(i):undefined})+'</td>';
    }).join("")+'<td class="cact"></td></tr>';
  }
  return out;
}
// Eingabe in eine Leerzeile: Liste bis zu dieser Zeile mit neuen Zeilen auffüllen; false, wenn die Höchstzahl erreicht ist
function calcMaterializeRow(path){
  for(const [key,def] of Object.entries(CALC_LISTS)){
    if(!path.startsWith(def.path+"."))continue;
    const m=/^(\d+)\./.exec(path.slice(def.path.length+1));if(!m)return true;
    const i=+m[1];if(i>=CALC_MAX_ROWS)return false;
    const list=Array.isArray(getP(S,def.path))?getP(S,def.path):[];
    if(list.length>i)return true;
    while(list.length<=i)list.push(calcNewRow(key));
    setP(S,def.path,list);
    return true;
  }
  return true;
}

/* ---- Diagramme (SVG, hell, auch im Druck) ---- */
const CALC_SVG_FONT='font-family="Segoe UI,Arial,sans-serif" font-size="11"';
const calcShort=v=>{const a=Math.abs(v);return (v<0?"−":"")+(a>=1e6?fmt(a/1e6,2)+" Mio.":a>=1e3?fmt(a/1e3,0)+" T":fmt(a,0))+" €";};
// Wasserfall von den Projektkosten bis zum Umsatz mit Verhandlung (p.a.)
function calcWaterfallSvg(r){
  const s=r.sum.pa,pers=r.groups[0].pa+r.groups[1].pa,mat=s.K-pers;
  const steps=[["Personalkosten",pers,"#2563eb"],["Sachkosten",mat,"#0d9488"],["Umlagen",s.um,"#64748b"],["Gewinn + Risiko",s.ge+s.ri+s.pm,"#16a34a"],["Verhandlung",s.ve,"#d97706"]];
  const total=s.umv;if(!(total>0))return '<p class="hint">Noch keine Werte für das Diagramm.</p>';
  const W=640,H=230,L=10,T=16,B=48,bw=(W-L*2)/(steps.length+1)-14,sc=(H-T-B)/total;
  let acc=0,out='';
  steps.forEach(([label,v,col],i)=>{
    const x=L+i*(bw+14),y=H-B-(acc+Math.max(v,0))*sc,h=Math.max(1,Math.abs(v)*sc);
    out+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+col+'" rx="2"/>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" fill="#0f172a">'+escH(calcShort(v))+'</text>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-B+14)+'" text-anchor="middle" fill="#475569">'+escH(label)+'</text>';
    acc+=v;
  });
  const x=L+steps.length*(bw+14),y=H-B-total*sc;
  out+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(total*sc).toFixed(1)+'" fill="#4338ca" rx="2"/>'+
    '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" fill="#0f172a" font-weight="700">'+escH(calcShort(total))+'</text>'+
    '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-B+14)+'" text-anchor="middle" fill="#475569">Umsatz</text>';
  return '<svg class="calc-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Wasserfall von den Projektkosten bis zum Umsatz pro Jahr" '+CALC_SVG_FONT+'><line x1="0" y1="'+(H-B)+'" x2="'+W+'" y2="'+(H-B)+'" stroke="#cbd5e1"/>'+out+'</svg>';
}
// EBITA je Kalenderjahr bei Festpreis
function calcYearBarsSvg(r){
  const ys=r.years.filter(x=>x.months>0);if(!ys.length)return '';
  // Skala von min(0, kleinster Wert) bis max(0, größter Wert)
  const W=640,H=200,T=18,B=36,hi=Math.max(0,...ys.map(x=>x.ebita)),lo=Math.min(0,...ys.map(x=>x.ebita)),span=Math.max(1,hi-lo);
  const sc=(H-T-B)/span,mid=T+hi*sc,bw=Math.min(70,(W-20)/ys.length-12);
  let out='<line x1="0" y1="'+mid+'" x2="'+W+'" y2="'+mid+'" stroke="#94a3b8"/>';
  ys.forEach((x,i)=>{
    const cx=10+i*(bw+12),h=Math.abs(x.ebita)*sc,y=x.ebita>=0?mid-h:mid;
    out+='<rect x="'+cx+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" fill="'+(x.ebita>=0?"#16a34a":"#dc2626")+'" rx="2"/>'+
      '<text x="'+(cx+bw/2).toFixed(1)+'" y="'+(x.ebita>=0?y-4:y+h+12).toFixed(1)+'" text-anchor="middle" fill="#0f172a">'+escH(calcPct(x.margin,1))+'</text>'+
      '<text x="'+(cx+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" fill="#475569">'+x.year+'</text>';
  });
  return '<svg class="calc-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="EBITA-Marge je Kalenderjahr bei Festpreis" '+CALC_SVG_FONT+'>'+out+'</svg>';
}
// Tornado: Wirkung auf das EBITA p.a. bei festem Angebotspreis
function calcTornadoSvg(rows){
  if(!rows.length)return '';
  const W=640,rowH=24,L=190,R=70,H=rows.length*rowH+30,max=Math.max(1,...rows.map(x=>Math.max(Math.abs(x.eLow),Math.abs(x.eHigh)))),cx=L+(W-L-R)/2,sc=(W-L-R)/2/max;
  let out='<line x1="'+cx+'" y1="4" x2="'+cx+'" y2="'+(H-22)+'" stroke="#475569"/>';
  rows.forEach((x,i)=>{
    const y=8+i*rowH;
    for(const [v,lab] of [[x.eLow,x.lowTxt],[x.eHigh,x.highTxt]]){
      const w=Math.abs(v)*sc,x0=v>=0?cx:cx-w;
      out+='<rect x="'+x0.toFixed(1)+'" y="'+y+'" width="'+Math.max(1,w).toFixed(1)+'" height="16" fill="'+(v>=0?"#16a34a":"#dc2626")+'" opacity=".85" rx="2"><title>'+escH(x.label+" "+lab+": "+calcShort(v))+'</title></rect>';
    }
    out+='<text x="'+(L-8)+'" y="'+(y+12)+'" text-anchor="end" fill="#0f172a">'+escH(x.label)+'</text>'+
      '<text x="'+(W-R+6)+'" y="'+(y+12)+'" fill="#475569">'+escH(calcShort(Math.max(Math.abs(x.eLow),Math.abs(x.eHigh))))+'</text>';
  });
  out+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" fill="#475569">Δ EBITA p.a. bei festem Angebotspreis</text>';
  return '<svg class="calc-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tornado-Diagramm der Sensitivitätsanalyse" '+CALC_SVG_FONT+'>'+out+'</svg>';
}

  summary:{de:{t:"So lesen Sie dieses Register",steps:["Kopfdaten, Rechenmodus, Version und Kalkulationswährung prüfen.","Kostenaufbau von den Projektkosten über Umlagen, Gewinn und Risiko bis zum Umsatz mit Verhandlung nachvollziehen.","Kennzahlen prüfen: TO p.a., TO Laufzeit, Umsatz je FTE und EBITA-Marge.","Plausibilität beachten: Warnungen vor der Freigabe klären.","Bei Bedarf die Summary drucken oder als PDF speichern."],tips:["Das Register hat keine Eingaben; alle Werte kommen aus den übrigen Registern.","Der Rechenweg am Ende erklärt die Formeln.","Sachkosten nach Kategorie erscheinen, sobald Kategorien vergeben sind."]},
    en:{t:"How to read this tab",steps:["Check the header data, calculation mode, version and calculation currency.","Follow the cost build-up from project costs via allocations, profit and risk to revenue incl. negotiation.","Check the key figures: TO p.a., TO over the term, revenue per FTE and EBITA margin.","Observe the plausibility check: resolve warnings before approval.","If required, print the summary or save it as PDF."],tips:["This tab has no inputs; all values come from the other tabs.","The calculation method at the end explains the formulas.","Material costs by category appear as soon as categories are assigned."]}},
  auswertung:{de:{t:"So arbeiten Sie in diesem Register",steps:["Einstellungen setzen: Preisgleitung, Diskontierungszins, Mindest-EBITA-Marge, Variation der Sensitivität und VK-Spanne.","Preisuntergrenze und Verhandlungsspielraum für die Preisverhandlung nutzen.","Ergebnis je Kalenderjahr prüfen: negative Über-/Unterdeckung zeigt das Festpreis-Risiko.","Cashflow, Amortisation, Kapitalwert und interne Verzinsung bei Investitionen bewerten.","Sensitivitätsanalyse lesen und Alternativen als Varianten speichern und vergleichen."],tips:["Die Sensitivität variiert jeden Treiber einzeln; die größten Wirkungen stehen oben.","Varianten speichern den ganzen Stand; Laden ersetzt den aktuellen Stand, Rückgängig bleibt möglich.","Plausibilitätsprüfungen: Warnungen in Orange, Hinweise in Grau."]},
    en:{t:"How to work on this tab",steps:["Set the analysis settings: price escalation, discount rate, minimum EBITA margin, sensitivity variation and sales rate range.","Use the price floor and negotiation headroom for price negotiations.","Check the result per calendar year: a negative over/under-recovery shows the fixed-price risk.","Assess cash flow, payback, net present value and internal rate of return for investments.","Read the sensitivity analysis and save and compare alternatives as variants."],tips:["The sensitivity varies each driver individually; the largest effects are at the top.","Variants store the whole state; loading replaces the current state, undo remains possible.","Plausibility checks: warnings in orange, notes in grey."]}},
  oto:{de:{t:"So arbeiten Sie in diesem Register",steps:["Opportunity-Angaben ergänzen: Datum, Status, SFDC-Nr., Angebotsnummer, Angebotswährung und Abrechnungsart.","OtO-Werte prüfen; sie stehen in EUR, bei anderer Kalkulationswährung umgerechnet.","Mit „OtO-Werte kopieren“ in das OtO-Formular übertragen (Bezeichnung und Wert, durch Tabulator getrennt).","Link zum Ablageordner eintragen und die OtO-Abgabeunterlage dort ablegen."],tips:["Rahmenvertrag: Jahresvolumen; Projektgeschäft: Gesamtvolumen.","Die Vertragsprüfung erfolgt separat und ist nicht Teil dieses Werkzeugs."]},
    en:{t:"How to work on this tab",steps:["Complete the opportunity details: date, status, SFDC no., offer number, offer currency and billing type.","Check the OtO values; they are in EUR, converted if the calculation currency differs.","Transfer them to the OtO form with “Copy OtO values” (label and value, separated by tabs).","Enter the link to the filing folder and file the OtO submission document there."],tips:["Framework contract: annual volume; project business: total volume.","The contract review takes place separately and is not part of this tool."]}},
  stammdaten:{de:{t:"So arbeiten Sie mit den Stammdaten",steps:["Stammdatendatei öffnen (eigene oder von Kollegen erhalten) oder hier neu aufbauen. Eine Datei enthält alle Länder.","Länderprofile anlegen: in Projekt & Basisdaten Land und Basisdaten pflegen und „Als Länderprofil speichern“ wählen.","Mitarbeiterklassen, Tarifgruppen und Sachkosten direkt hier erfassen oder in der Kalkulation mit „In Stammdaten übernehmen“ zurückschreiben.","Gültig von/bis eintragen, wenn Werte nur für einen Zeitraum gelten. Vorschläge kommen nur aus Einträgen, die zum Kalkulationsdatum gültig sind.","Stammdaten speichern und weitergeben. Dateien von Kollegen mit „Datei zusammenführen“ übernehmen: neue Einträge kommen hinzu, bei Abweichungen gilt der zuletzt geänderte."],tips:["In der Kalkulation erscheinen Vorschläge beim Tippen der Qualifikation bzw. Bezeichnung; die Auswahl füllt nur leere Felder.","Land leer bedeutet: gilt für alle Länder.","Werte werden als Kopie übernommen; Änderungen der Stammdaten ändern bestehende Kalkulationen nicht."]},
    en:{t:"How to work with the master data",steps:["Open a master data file (your own or one received from colleagues) or build it here. One file contains all countries.","Create country profiles: maintain the country and base data under Project & base data and choose “Save as country profile”.","Enter staff classes, pay groups and material costs here, or write them back from the calculation with “Add to master data”.","Enter valid from/to if values apply only for a period. Suggestions only come from entries valid on the calculation date.","Save and share the master data. Take over files from colleagues with “Merge file”: new entries are added; for differences the most recently changed entry wins."],tips:["In the calculation, suggestions appear while typing the qualification or description; selecting one fills only empty fields.","An empty country means: applies to all countries.","Values are copied; changes to the master data do not change existing calculations."]}},
  dokumentation:{de:{t:"So arbeiten Sie in diesem Register",steps:["Ihren Namen für das Änderungsprotokoll eintragen.","Version, Freigabestatus, Prüfer und Datum der Freigabe pflegen.","Wesentliche Änderungen im Protokoll kommentieren (Begründung).","Mit „Version abschließen“ den Stand mit Umsatz und EBITA-Marge in die Versionshistorie übernehmen; Änderungen danach gehören zur neuen Version.","Protokoll bei Bedarf drucken; es ist Teil der Kalkulationsdatei und des Excel-Exports."],tips:["Das Änderungsprotokoll wird automatisch geführt, auch für Einfügen und Zeilenaktionen.","Rückgängig nimmt den zugehörigen Protokolleintrag mit zurück."]},
    en:{t:"How to work on this tab",steps:["Enter your name for the change log.","Maintain version, approval status, reviewer and approval date.","Comment on significant changes in the log (reason).","Use “Close version” to copy the state with revenue and EBITA margin into the version history; later changes belong to the new version.","Print the log if required; it is part of the calculation file and the Excel export."],tips:["The change log is kept automatically, including pasting and row actions.","Undo also removes the related log entry."]}}
};
// Handlungs- und Verfahrensanweisung auf der Startseite
const CALC_GUIDE={
  de:{t:"Handlungs- und Verfahrensanweisung",sub:"Empfohlenes Vorgehen für Projektkalkulationen mit dem Kalkulationstool. Interne Richtlinien zu Freigabegrenzen und Zuständigkeiten gehen vor.",sec:[
    {h:"1. Zweck und Geltungsbereich",p:["Das Werkzeug ermittelt Selbstkosten, Angebotspreis und OtO-Werte für Dienstleistungsprojekte aus Personal- und Sachkosten. Es ersetzt das Excel-Kalkulationstool Light V1.0 und rechnet auf Wunsch mit dessen Logik (Excel-kompatibel).","Es gilt für Angebots-, Korrektur- und Nachkalkulationen. Die Vertragsprüfung ist nicht Teil des Werkzeugs."]},
    {h:"2. Rollen und Verantwortung",ul:["Kalkulator: erfasst die Daten, dokumentiert Quellen und Annahmen und verantwortet die Richtigkeit der Eingaben.","Prüfer bzw. Freigeber: prüft Kalkulation und Plausibilität nach dem Vier-Augen-Prinzip und gibt den Stand frei.","Alle Beteiligten: Ergebnisse vor der Verwendung auf Plausibilität prüfen; das Werkzeug unterstützt, entscheidet aber nicht."]},
    {h:"3. Ablauf",ol:["Vorbereitung: Leistungsbeschreibung, Mengengerüst, Personal- und Schichtmodell, Angebote für Sachkosten und die gültige Landesvorlage bereitstellen.","Projekt anlegen: Datei › Neue Kalkulation; Projektdaten, Start und Ende der Leistung und das Land eintragen; Länderprofil aus den Stammdaten übernehmen (Basisdaten, Währung, Kurs, Tarifgruppen) oder Vorlage laden.","Basisdaten prüfen: Zuschläge, Arbeitszeit, Abwesenheiten, SV-Sätze, Tariferhöhung und Sachkostenparameter mit den Vorgaben abgleichen.","Personalkosten erfassen: Personalbedarf, Qualifikationen, Gehälter und Löhne bzw. Tarifgruppen, FTE-Brutto-Zuschlag.","Sachkosten erfassen: Investitionen mit Beschaffung und Abschreibung, Betriebskosten, Nachunternehmer, Ramp-up; Quelle je Zeile angeben.","Ergebnis prüfen: Summary, Plausibilität, Ergebnis je Jahr, Cashflow, Preisuntergrenze und Sensitivität; Alternativen als Varianten vergleichen.","Speichern: regelmäßig mit Datei › Speichern; für Zwischenstände Speichern unter mit sprechendem Dateinamen.","Freigabe: Prüfer und Freigabestatus eintragen, Änderungen kommentieren, Version abschließen.","OtO und Ablage: OtO-Werte kopieren und übertragen, Kalkulationsdatei, Excel-Export und Gesamtbericht (PDF) im Ablageordner speichern."]},
    {h:"4. Prüfungen vor der Freigabe",ul:["Keine offenen Warnungen in der Plausibilität, oder Warnungen sind begründet und kommentiert.","Laufzeit, Mengengerüst und FTE entsprechen der Leistungsbeschreibung.","Löhne über dem Mindestlohn und VK-Sätze in der üblichen Spanne.","Sachkosten mit Quelle belegt; Durchreichposten mit dem Kunden abgestimmt.","Restbuchwerte zum Vertragsende geklärt (Verwertung oder Übernahme durch den Kunden).","EBITA-Marge mindestens auf der Mindestmarge; Festpreis-Risiko je Jahr bewertet.","Bei Fremdwährung: Wechselkurs und Kursdatum nach Vorgabe; OtO-Werte in EUR geprüft."]},
    {h:"5. Dokumentation und Versionierung",ul:["Das Änderungsprotokoll zeichnet jede Änderung mit altem und neuem Wert, Bearbeiter und Wirkung auf den Umsatz auf; wesentliche Änderungen kommentieren.","Mit jeder Abgabe an den Kunden eine Version abschließen; die Versionshistorie zeigt die Entwicklung von Umsatz und Marge.","Freigegebene Stände nicht mehr ändern; Änderungen in einer neuen Version vornehmen."]},
    {h:"6. Datenhaltung und Ablage",ul:["Das Werkzeug läuft lokal im Browser und überträgt keine Daten. Der letzte Stand bleibt im Browser des Geräts erhalten, ersetzt aber nicht die Datei.","Maßgeblich ist die gespeicherte Kalkulationsdatei (JSON) im Ablageordner des Projekts; dazu Excel-Export und PDF-Bericht für Dritte.","Stammdaten (Länderprofile, Mitarbeiterklassen, Tarifgruppen, Sachkosten, Kurse) als eine Datei pflegen, speichern und weitergeben; Dateien von Kollegen zusammenführen. Werte gelten über „gültig von/bis“."]},
    {h:"7. Besondere Fälle",ul:["Abgleich mit Excel-Kalkulationen: Schalter „Excel-kompatibel rechnen“; danach wieder ausschalten.","Kalkulation in Landeswährung: Kalkulationswährung und Kurs setzen; Mindestlohnprüfung und vorbelegte Beitragsbemessungsgrenzen gelten nur für Deutschland.","Mehrere Szenarien: als Varianten speichern, vergleichen und die gewählte Variante laden.","Projektdaten aus dem Lagerplaner: Datei › Projektdaten aus Lagerplaner-Planungsdatei."]}]},
  en:{t:"Operating procedure",sub:"Recommended procedure for project calculations with the costing tool. Internal guidelines on approval limits and responsibilities take precedence.",sec:[
    {h:"1. Purpose and scope",p:["The tool determines full costs, offer price and OtO values for service projects from personnel and material costs. It replaces the Excel Kalkulationstool Light V1.0 and can calculate with its logic on request (Excel-compatible).","It applies to offer, revised and post-calculations. The contract review is not part of the tool."]},
    {h:"2. Roles and responsibilities",ul:["Calculator: enters the data, documents sources and assumptions and is responsible for the correctness of the inputs.","Reviewer or approver: checks the calculation and plausibility following the four-eyes principle and approves the state.","Everyone involved: check results for plausibility before use; the tool supports but does not decide."]},
    {h:"3. Procedure",ol:["Preparation: provide the scope of services, volume structure, staffing and shift model, quotes for material costs and the applicable country template.","Create the project: File › New calculation; enter project data, service start and end and the country; apply the country profile from the master data (base data, currency, rate, pay groups) or load a template.","Check base data: compare mark-ups, working time, absences, social security rates, pay increase and material cost parameters with the specifications.","Enter personnel costs: staffing need, qualifications, salaries and wages or pay groups, gross FTE mark-up.","Enter material costs: investments with procurement and depreciation, operating costs, subcontractors, ramp-up; state the source per row.","Check the result: summary, plausibility, result per year, cash flow, price floor and sensitivity; compare alternatives as variants.","Save: regularly with File › Save; use Save as with a meaningful file name for interim states.","Approval: enter the reviewer and approval status, comment on changes, close the version.","OtO and filing: copy and transfer the OtO values; store the calculation file, Excel export and full report (PDF) in the filing folder."]},
    {h:"4. Checks before approval",ul:["No open warnings in the plausibility check, or warnings are justified and commented.","Term, volume structure and FTE match the scope of services.","Wages above the minimum wage and sales rates within the usual range.","Material costs backed by a source; pass-through items agreed with the customer.","Residual book values at contract end clarified (disposal or takeover by the customer).","EBITA margin at least at the minimum margin; fixed-price risk per year assessed.","For foreign currency: exchange rate and rate date as specified; OtO values in EUR checked."]},
    {h:"5. Documentation and versioning",ul:["The change log records every change with old and new value, editor and effect on revenue; comment on significant changes.","Close a version with every submission to the customer; the version history shows how revenue and margin developed.","Do not change approved states; make changes in a new version."]},
    {h:"6. Data storage and filing",ul:["The tool runs locally in the browser and transfers no data. The latest state is kept in the browser on the device but does not replace the file.","The saved calculation file (JSON) in the project's filing folder is authoritative; add the Excel export and PDF report for third parties.","Maintain the master data (country profiles, staff classes, pay groups, material costs, rates) as one file, save and share it; merge files from colleagues. Values apply via “valid from/to”."]},
    {h:"7. Special cases",ul:["Comparison with Excel calculations: switch on “Calculate Excel-compatible”; switch it off again afterwards.","Calculation in local currency: set the calculation currency and rate; the minimum wage check and pre-filled contribution ceilings apply to Germany only.","Several scenarios: save them as variants, compare them and load the chosen variant.","Project data from the Lagerplaner: File › Project data from Lagerplaner planning file."]}]}
