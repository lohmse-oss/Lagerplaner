<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Leadec Logistics Betriebsmodell · Modellnavigator</title>
<style>
:root {
  color-scheme: light;
  --ink: #0f172a; --ink2: #334155; --muted: #64748b; --line: #e2e8f0; --line2: #cbd5e1;
  --bg: #f1f5f9; --card: #ffffff; --soft: #f8fafc; --hover: #eff6ff;
  --side: #0f172a; --side-ink: #cbd5e1; --side-line: #1e293b;
  --accent: #2563eb; --accent-soft: #dbeafe; --accent-ink: #1e40af;
  --perf: #c2702b; --perf-soft: #fdf1e6;
  --fu: #1e3a5f; --be: #284b75; --ge: #355d8c; --no: #4a71a2; --au: #6584b2;
  --a-P: #4a71a2; --a-D: #2e7d4f; --a-M: #b36b00; --a-W: #12707d; --a-RT: #6a4ba3; --a-K: #9b1c1c;
  --sidebar-width: 248px;
  font-family: "Segoe UI", "Source Sans Pro", system-ui, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); line-height: 1.45; font-size: 14.5px; }
.card, .blk, .regel-card, td { hyphens: auto; overflow-wrap: break-word; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-ink); }

/* Seitenleiste */
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); background: var(--side); color: #fff; display: flex; flex-direction: column; gap: 4px; padding: 14px 12px; overflow-y: auto; z-index: 40; transition: transform .2s ease; }
.sb-brand { padding: 4px 6px 12px; border-bottom: 1px solid var(--side-line); margin-bottom: 6px; }
.sb-brand b { display: block; font-size: 15px; letter-spacing: .01em; }
.sb-brand span { font-size: 12px; color: var(--side-ink); }
.sb-title { font-size: 11.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; padding: 10px 8px 4px; }
.nav { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: #e2e8f0; border-radius: 6px; padding: 6px 10px; font-size: 14px; }
.nav:hover { background: #1e293b; }
.nav.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.nav:focus-visible { outline-color: #f59e0b; }
.nav.dirty::after { content: ' ●'; color: #f59e0b; }
.sb-meta { margin-top: auto; padding: 12px 8px 4px; border-top: 1px solid var(--side-line); font-size: 11.5px; color: var(--side-ink); line-height: 1.5; }

/* Hauptbereich */
.main { margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; transition: margin-left .2s ease; }
body.sb-zu .sidebar { transform: translateX(-100%); }
body.sb-zu .main { margin-left: 0; }
.top { position: sticky; top: 0; z-index: 30; background: var(--side); color: #fff; display: flex; align-items: center; gap: 12px; padding: 9px 18px; }
.top h1 { font-size: 17px; font-weight: 700; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .tb { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 4px 10px; font-size: 16px; line-height: 1.2; }
.top .tb:focus-visible { outline-color: #f59e0b; }
.top input { width: min(360px, 40vw); border: 1px solid #334155; background: #1e293b; color: #fff; border-radius: 6px; padding: 6px 10px; }
.top input::placeholder { color: #94a3b8; }
.top h1 .brand { font-weight: 400; color: #94a3b8; }
.qs { position: relative; }
.qs-pop { position: absolute; right: 0; top: calc(100% + 6px); width: min(520px, calc(100vw - 24px)); max-height: min(70vh, 520px); overflow-y: auto; background: #fff; color: var(--ink); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 12px 32px rgba(15, 23, 42, .25); padding: 4px; z-index: 60; }
.qs-item { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 5px; padding: 6px 8px; font-size: 13.5px; }
.qs-item:hover, .qs-item.act { background: var(--hover); }
.qs-item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qs-all { display: block; width: 100%; text-align: left; background: var(--soft); border: 0; border-top: 1px solid var(--line); border-radius: 0 0 5px 5px; padding: 8px; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--accent-ink); }
.qs-all.act, .qs-all:hover { background: var(--hover); }
.qs-leer { padding: 10px; font-size: 13px; color: var(--muted); }
kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; color: var(--ink2); }
#view { padding: 22px 26px 40px; max-width: 1440px; width: 100%; outline: none; }
.v-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.v-head h2 { font-size: 22px; font-weight: 800; }
.v-head p { color: var(--muted); max-width: 820px; margin-top: 3px; }
.hint { font-size: 12.5px; color: var(--muted); }
h3.sec { font-size: 15.5px; font-weight: 800; margin: 24px 0 10px; }

/* Bausteine der Oberfläche */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card.click { cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
.card.click:hover { border-color: var(--accent); background: var(--hover); }
.card h4 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.card p { color: var(--ink2); font-size: 13.5px; }
.kenn { font-family: Consolas, "Courier New", monospace; font-size: 12px; font-weight: 700; color: var(--muted); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; border: 1px solid var(--line2); border-radius: 10px; padding: 0 7px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.tag.art { color: #fff; border-color: transparent; }
.tag.art-P { background: var(--a-P); } .tag.art-D { background: var(--a-D); } .tag.art-M { background: var(--a-M); }
.tag.art-W { background: var(--a-W); } .tag.art-RT { background: var(--a-RT); } .tag.art-K { background: var(--a-K); }
.tag.warn { border-color: #d97706; color: #8a4b00; background: #fef3c7; }
.tag.lnk { border-color: #93c5fd; color: var(--accent-ink); background: var(--accent-soft); }
.tag.erg { border-color: #a78bfa; color: #5b21b6; background: #ede9fe; }
.ablage td .pfad { font-family: Consolas, "Courier New", monospace; font-size: 12px; word-break: break-all; }
.ablage td.akt { white-space: nowrap; text-align: right; }
.ablage td:nth-child(3) { min-width: 200px; }
.ablage td:first-child { white-space: nowrap; }
.ablage td.akt .btn { font-size: 12px; padding: 2px 8px; }
.form-grid { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 8px 12px; align-items: center; max-width: 760px; }
.form-grid input[type=text], .form-grid select, .form-grid textarea { border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; background: #fff; width: 100%; }
.form-grid textarea { min-height: 58px; resize: vertical; }
.form-grid label { font-size: 13px; font-weight: 700; color: var(--muted); }
.top .tb.edit-on { background: #f59e0b; border-color: #f59e0b; color: #111827; font-weight: 700; }
.top .tb#ed-toggle { font-size: 13.5px; }
.ed-banner { background: #fef3c7; border-bottom: 1px solid #d97706; color: #8a4b00; font-size: 13px; padding: 6px 26px; }
.ed-btn { font-size: 11.5px; font-weight: 700; padding: 0 7px; margin-left: 6px; border: 1px solid #d97706; border-radius: 4px; background: #fff; color: #8a4b00; vertical-align: 1px; }
.ed-btn:hover { background: #fef3c7; }
.vs-neu { background: #fef3c7; box-shadow: 0 0 0 2px #fef3c7; border-radius: 2px; }
.tag.vs { border-color: #d97706; color: #8a4b00; background: #fef3c7; }
.ed-form textarea, .ed-form input { width: 100%; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; font: inherit; background: #fff; }
.ed-form textarea { min-height: 90px; resize: vertical; }
.ed-form input { margin-top: 6px; }
.ed-form .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.anh-box { border: 1px solid var(--line); border-radius: 6px; background: var(--soft); padding: 8px 10px; margin: 0 0 12px; }
.anh-kopf { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.anh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 3px 0; border-top: 1px solid var(--line); }
.anh:first-of-type { border-top: 0; }
.anh a { font-weight: 700; }
.anh .kenn { font-weight: 400; word-break: break-all; }
.anh-akt { margin-left: auto; display: flex; gap: 4px; }
.anh-akt .btn { font-size: 11.5px; padding: 1px 7px; }
.st-offen { color: #8a4b00; font-weight: 700; } .st-uebernommen { color: #15803d; font-weight: 700; } .st-veraltet { color: #b91c1c; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 200; display: flex; gap: 12px; align-items: center; background: var(--ink); color: #fff; border-radius: 8px; padding: 9px 12px 9px 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); font-size: 13.5px; max-width: calc(100vw - 32px); }
.toast[hidden] { display: none; }
.toast .btn { background: #fff; color: var(--ink); }
.konflikt td { vertical-align: top; }
.stift { display: inline-block; margin-left: 5px; padding: 0 5px; border: 1px solid #d97706; border-radius: 4px; background: #fff; color: #8a4b00; font-size: 11.5px; font-weight: 700; line-height: 1.5; cursor: pointer; vertical-align: 1px; }
.stift:hover, .stift:focus-visible { background: #fef3c7; }
.band-head .stift { background: rgba(255, 255, 255, .9); }
.inline-ed { position: fixed; z-index: 150; width: min(440px, calc(100vw - 24px)); background: #fff; border: 1px solid #d97706; border-radius: 8px; box-shadow: 0 12px 32px rgba(15, 23, 42, .25); padding: 10px 12px; }
.inline-ed h4 { font-size: 13px; font-weight: 800; margin-bottom: 6px; }
.rollen { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: -4px 0 12px; }
.rollen .btn { font-size: 12.5px; padding: 3px 10px; }
.rollen-box { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; }
.rollen-box .los { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }
.nav .anz { float: right; font-size: 11px; font-weight: 700; background: #334155; color: #e2e8f0; border-radius: 8px; padding: 0 6px; margin-top: 2px; }
.nav.on .anz { background: #bfdbfe; color: var(--accent-ink); }
#d-merk.on { color: #b45309; border-color: #d97706; }
/* Grafiken */
.viz text { font-family: inherit; }
.viz .lab { font-size: 12px; fill: var(--ink); }
.viz .mut { font-size: 11px; fill: var(--muted); }
.viz .grid { stroke: var(--line); stroke-width: 1; }
.viz [data-open] { cursor: pointer; }
.viz [data-open]:hover .knoten, .viz [data-open]:focus .knoten { stroke: var(--accent); }
.viz [data-open]:focus { outline: none; }
.viz [data-open]:focus-visible rect, .viz [data-open]:focus-visible circle { stroke: #f59e0b; stroke-width: 3; }
.netz-leg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.tile .z { font-size: 26px; font-weight: 800; line-height: 1.1; }
.tile .z small { font-size: 14px; font-weight: 600; color: var(--muted); }
.tile .l { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
.tile .l .ref { white-space: normal; }
.tile .spur { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.tile .spur i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.balken { display: grid; grid-template-columns: minmax(90px, 210px) minmax(40px, 1fr) auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.balken .spur { height: 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 0 4px 4px 0; position: relative; }
.balken .spur i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.balken .w { color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.diff del { background: #fee2e2; color: #7f1d1d; text-decoration: line-through; border-radius: 2px; }
.diff ins { background: #dcfce7; color: #14532d; text-decoration: none; border-radius: 2px; }
.em.hl-an .blk:not(.hl):not(.hl-src) { opacity: .45; }
.blk.hl { border-color: #d97706; box-shadow: 0 0 0 2px #fde68a; }
.blk.hl-src { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.banner { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: #fef3c7; border: 1px solid #d97706; color: #8a4b00; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; }
.okmsg { background: #dcfce7; border: 1px solid #16a34a; color: #14532d; border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 13.5px; }
@media (max-width: 760px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.cnt { display: inline-flex; gap: 4px; align-items: baseline; font-size: 12px; border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; background: #fff; color: var(--ink2); }
.cnt b { font-size: 13px; }
.ref { color: var(--accent-ink); text-decoration: underline; text-decoration-color: #93c5fd; text-underline-offset: 2px; cursor: pointer; white-space: nowrap; font-weight: 600; }
.ref:hover { background: var(--hover); }
.btn { border: 1px solid var(--line2); background: #fff; border-radius: 6px; padding: 5px 11px; font-size: 13.5px; font-weight: 600; }
.btn:hover { border-color: var(--accent); background: var(--hover); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #1d4ed8; }
a.btn { display: inline-block; text-decoration: none; color: var(--ink); }
a.btn.primary { color: #fff; }
table.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
table.kv td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv td:first-child { width: 190px; color: var(--muted); font-weight: 700; }
table.list { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
table.list th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 7px 8px; border-bottom: 2px solid var(--line2); background: var(--soft); }
table.list td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.note { font-size: 13px; color: var(--ink2); background: var(--soft); border-left: 4px solid var(--line2); padding: 10px 12px; margin-top: 14px; }

/* Startsicht Ebenenmodell */
.em { display: grid; grid-template-columns: 34px minmax(0, 1fr) 220px; gap: 8px; }
.persp { grid-column: 1; border: 1px solid var(--line); border-left: 5px solid var(--fu); background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 8px 0; cursor: help; }
.persp.PE { border-left-color: var(--perf); }
.persp b { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
.band { grid-column: 2; display: grid; grid-template-columns: 172px minmax(0, 1fr); background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.band-head { color: #fff; padding: 12px 14px; text-align: left; border: 0; display: flex; flex-direction: column; gap: 3px; }
.band-head:hover { filter: brightness(1.12); }
.band-head b { font-size: 18px; font-weight: 800; }
.band-head .code { font-size: 11.5px; opacity: .8; font-weight: 700; letter-spacing: .05em; }
.band-head .lf { font-size: 12.5px; opacity: .92; }
.band-head .ptag { display: none; }
.b-FU { background: var(--fu); } .b-BE { background: var(--be); } .b-GE { background: var(--ge); } .b-NO { background: var(--no); } .b-AU { background: var(--au); }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; padding: 6px; }
.blk { border: 1px solid var(--line2); border-radius: 5px; background: #fff; padding: 8px 9px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-height: 78px; }
.blk:hover { border-color: var(--accent); background: var(--hover); }
.blk b { font-size: 13px; font-weight: 800; }
.blk span.t { font-size: 12px; color: var(--ink2); }
.blk .foot { margin-top: auto; display: flex; gap: 4px; flex-wrap: wrap; padding-top: 4px; }
.blk.feld { padding: 6px; gap: 4px; }
.blk.feld .rp { display: block; width: 100%; text-align: left; border: 0; border-radius: 3px; padding: 3px 6px; font-size: 12px; font-weight: 700; }
.rp.v { background: #e2e8f0; color: var(--ink); }
.rp.w { background: var(--fu); color: #fff; }
.rp:hover { outline: 2px solid var(--accent); }
.side-col { grid-column: 3; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 8px; }
.side-box { border: 1px solid var(--line2); border-radius: 6px; background: #fff; overflow: hidden; }
.side-box summary { list-style: none; cursor: pointer; }
.side-box summary::-webkit-details-marker { display: none; }
.side-box summary:hover { background: var(--hover); }
.side-box h4 { background: #e8eef7; font-size: 13.5px; font-weight: 800; padding: 7px 10px; }
.side-box p { font-size: 12.5px; color: var(--ink2); padding: 8px 10px 0; }
.side-box p:last-child { padding-bottom: 10px; }
.side-box .more { display: block; font-size: 12px; font-weight: 700; color: var(--accent-ink); padding: 4px 10px 8px; }
.side-box .more::before { content: '▸ '; }
.side-box[open] .more::before { content: '▾ '; }
.side-box[open] .more { padding-bottom: 0; }
.em-foot { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

/* Wirkungskette */
.chain { display: flex; flex-direction: column; gap: 0; max-width: 760px; }
.chain .step { display: grid; grid-template-columns: 150px 1fr; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #fff; text-align: left; padding: 0; }
.chain .step .n { color: #fff; padding: 10px 12px; font-weight: 800; }
.chain .step .t { padding: 10px 12px; font-size: 13.5px; color: var(--ink2); }
.chain .arr { text-align: center; color: var(--muted); font-size: 18px; line-height: 1.4; }

/* Regeln */
.felder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.feld-col { display: flex; flex-direction: column; gap: 8px; }
.feld-col h4 { font-size: 13.5px; font-weight: 800; color: #fff; background: var(--no); border-radius: 6px; padding: 8px 10px; }
.regel-card { text-align: left; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--line2); border-radius: 6px; padding: 10px; }
.regel-card.w { border-top-color: var(--fu); }
.regel-card:hover { border-color: var(--accent); background: var(--hover); }
.regel-card b { display: block; font-size: 14px; }
.regel-card .rolle { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.regel-card p { font-size: 12.5px; color: var(--ink2); margin-top: 4px; }

/* Komponenten */
.weg { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; margin-top: 8px; }
.weg > div { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font-size: 12.5px; }
.weg > div i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.weg > span { padding-left: 56px; color: var(--muted); line-height: 1.1; font-size: 12px; }

/* Objekte */

<script>
(function () {
  'use strict';
  const NAVIGATOR = { fassung: '1.7', stand: '28.10.2026' };

  function index() {
    const obj = new Map(B.objekte.map(o => [o.kennung, o]));

    B.objekte.forEach(o => o.bezuege.forEach(b => { if (!ein.has(b.ziel)) ein.set(b.ziel, []); ein.get(b.ziel).push({ von: o.kennung, art: b.art }); }));

    IX = {
      obj, ein,
      ebene: new Map(B.ebenen.map(e => [e.code, e])),
      bs: new Map(B.bausteine.map(b => [b.code, b])),
      komp: new Map(B.komponenten.map(k => [k.code, k])),
      regel: new Map(B.regeln.map(r => [r.nr, r])),
      feld: new Map(B.felder.map(f => [f.nr, f])),
      kanon: new Map(B.kanon.map(k => [k.kennung, k])),
      stufe: new Map(B.stufen.map(s => [s.nr, s])),
      dim: new Map(B.dimensionen.map(d => [d.code, d])),
    };
  }
  const objekte = (f) => B.objekte.filter(f);
  const kompName = c => (IX.komp.get(c) || { n: c }).n;
  const bsName = c => (IX.bs.get(c) || { n: c || 'bausteinübergreifend' }).n;
  const ebeneName = c => (IX.ebene.get(c) || { n: c }).n;

  // ---------- Linkregister ----------
  // Das Linkregister ordnet Dokumenten eine Datei zu und führt ergänzende Dokumente, die sich im Betrieb
  // als standardsetzend erwiesen haben. Grundlage ist bm-links.js; Änderungen im Navigator bleiben bis zum
  // Speichern als Entwurf im Browser erhalten.

  const leer = () => ({ stand: '', basis: '', links: {}, ergaenzungen: [], anhaenge: {} });
  const kopie = x => JSON.parse(JSON.stringify(x));
  const normL = x => { const l = Object.assign(leer(), kopie(x || {})); l.links = l.links || {}; l.ergaenzungen = l.ergaenzungen || []; l.anhaenge = l.anhaenge || {}; return l; };
  let L = leer(), LDATEI = null, ERG = [], scan = [], ablageMsg = '';
  const ungespeichert = () => JSON.stringify(L) !== JSON.stringify(LDATEI || leer());
  function linksLaden() {

    let entwurf = null;
    try { entwurf = JSON.parse(localStorage.getItem(LINK_KEY) || 'null'); } catch (e) { entwurf = null; }
    L = entwurf ? normL(entwurf) : (LDATEI ? kopie(LDATEI) : leer());

  function linksMerken() {

    ergAnwenden();
  }
  function ergAnwenden() {
    if (IX) for (const o of ERG) IX.obj.delete(o.kennung);

      kennung: e.kennung, art: 'D', ergaenzung: true, n: e.n, ebene: 'GE', baustein: e.baustein, typ: e.typ || 'Ergänzung', regeln: e.regeln || [],
      zweck: e.notiz || '', fundstelle: 'Linkregister', status: 'Ergänzung', profil: { 'Aufgenommen am': e.aufgenommen || '' }, bezuege: []

  const alle = () => B.objekte.concat(ERG);
  const nErg = () => ERG.length === 1 ? '1 ergänzendes Dokument' : `${ERG.length} ergänzende Dokumente`;
  const linkPfad = k => L.links[k] || (L.ergaenzungen.find(e => e.kennung === k) || {}).datei || '';
  function linkHref(pfad) {
    if (!pfad) return '';
    if (/^[a-z][a-z0-9+.-]*:/i.test(pfad)) return pfad;
    let b = (L.basis || '').trim();
    if (b.startsWith('\\\\')) b = 'file:' + b.replace(/\\/g, '/');
    if (b && !/[\/\\]$/.test(b)) b += '/';

  }
  const oeffnen = (k, label) => { const pf = linkPfad(k); return pf ? `<a class="btn primary" href="${esc(linkHref(pf))}" target="_blank" rel="noopener" title="${esc(pf)}">${esc(label || 'Dokument öffnen')}</a>` : ''; };
  function setLink(k, pfad) {
    const e = L.ergaenzungen.find(x => x.kennung === k);

  const pfadFuer = f => { const t = scan.find(x => x.name === f.name && x.size === f.size) || scan.find(x => x.name === f.name); return t ? t.pfad : f.name; };
  let pickZiel = null, neuDatei = '';
  function waehle(ziel) { pickZiel = ziel; $('pick').value = ''; $('pick').click(); }
  $('pick').onchange = () => {
    const f = $('pick').files[0];
    // Die Auswahl wird sofort übernommen und das Feld geleert, damit keine Dateiangaben im Seitenzustand bleiben.
    $('pick').value = '';
    if (!f || !pickZiel) return;
    const pf = pfadFuer(f);
    if (pickZiel === '__neu') { neuDatei = pf; const el = $('e-datei'); if (el) el.textContent = pf; return; }
    if (pickZiel.startsWith('__anh:')) {
      const k = pickZiel.slice(6);
      aktion(`${pf} an ${elementName(k)} angehängt.`, () => { if (!anhangDazu(k, pf)) return false; linksMerken(); });
      nachAenderung();
      return;
    }
    const ziel = pickZiel;
    aktion(`${ziel} ist mit ${pf} verknüpft.`, () => setLink(ziel, pf));
    ablageMsg = `${ziel} ist mit ${pf} verknüpft.`;
    nachAenderung();
  };
  $('pickdir').onchange = () => {
    const fs = [...$('pickdir').files];
    scan = fs.map(f => ({ pfad: f.webkitRelativePath || f.name, name: f.name, size: f.size }));
    $('pickdir').value = '';
    let neu = 0, belegt = 0, ohne = 0, anh = 0;
    aktion('Dokumentordner eingelesen.', () => {
    // Register-Dokumente und Ergänzungen erhalten ihre Datei; Dateien mit der Kennung einer Methode,
    // eines Werkzeugs, einer Routine oder Kennzahl werden diesem Element als Anhang angehängt.
    const re = /(?:^|[^A-Z0-9])((?:D|X)-[A-Z]{2}-\d{2}|M-\d{2}-\d{2}|W-[RMIPQS]-\d{2}|RT-\d-\d{2}|K[34]-[SCORE]-\d{2})(?![0-9])/;
    for (const f of scan) {
      const m = f.name.toUpperCase().match(re);
      const o = m && IX.obj.get(m[1]);
      if (!o) { ohne++; continue; }
      if (o.art !== 'D') { if (anhangDazu(o.kennung, f.pfad)) anh++; continue; }
      if (linkPfad(o.kennung)) { belegt++; continue; }
      setLink(o.kennung, f.pfad); neu++;
    }
    linksMerken();
    });
    const z = (n, e, m) => `${n} ${n === 1 ? e : m}`;
    ablageMsg = `${z(scan.length, 'Datei', 'Dateien')} eingelesen: ${z(neu, 'Dokument', 'Dokumente')} neu zugeordnet, ${z(anh, 'Anhang', 'Anhänge')} an Methoden, Werkzeugen, Routinen oder Kennzahlen, ${belegt} mit bereits verknüpfter Kennung nicht überschrieben, ${ohne} ohne passende Kennung im Dateinamen.`;

  };
  function nachAenderung() {
    if (state.ansicht === 'ablage' || state.ansicht === 'objekte') renderView();

  }
  function herunterladen(name, text, typ) {

    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  const heute = () => new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  // Direkt speichern: Chrome und Edge können einen Ordner verbinden und dorthin schreiben. Die Verbindung
  // bleibt in IndexedDB erhalten; die Schreibberechtigung bestätigt der Browser beim ersten Speichern einer Sitzung.
  // Andere Browser erhalten die Datei als Download.
  const ordnerMoeglich = 'showDirectoryPicker' in window;
  let ORDNER = null;
  function idb(modus, fn) {
    return new Promise((ok, fehler) => {
      const r = indexedDB.open('bm-navigator', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onerror = () => fehler(r.error);
      r.onsuccess = () => { const tx = r.result.transaction('kv', modus); const q = fn(tx.objectStore('kv')); tx.oncomplete = () => ok(q && q.result); tx.onerror = () => fehler(tx.error); };
    });

  // ---------- Merkliste und Verlauf ----------

  // Wortweiser Vergleich zweier Fassungen: entfernte Wörter durchgestrichen, neue hervorgehoben.
  function vergleich(alt, neu) {
    const a = String(alt || '').split(/(\s+)/), b = String(neu || '').split(/(\s+)/);
    if (a.length * b.length > 250000) return [esc(alt), esc(neu)];
    const m = Array.from({ length: a.length + 1 }, () => new Uint16Array(b.length + 1));
    for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) m[i][j] = a[i] === b[j] ? m[i + 1][j + 1] + 1 : Math.max(m[i + 1][j], m[i][j + 1]);
    let i = 0, j = 0, x = '', y = '';
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { x += esc(a[i]); y += esc(b[j]); i++; j++; }
      else if (m[i + 1][j] >= m[i][j + 1]) { x += /^\s+$/.test(a[i]) ? esc(a[i]) : `<del>${esc(a[i])}</del>`; i++; }
      else { y += /^\s+$/.test(b[j]) ? esc(b[j]) : `<ins>${esc(b[j])}</ins>`; j++; }
    }
    for (; i < a.length; i++) x += /^\s+$/.test(a[i]) ? esc(a[i]) : `<del>${esc(a[i])}</del>`;
    for (; j < b.length; j++) y += /^\s+$/.test(b[j]) ? esc(b[j]) : `<ins>${esc(b[j])}</ins>`;
    return [x, y];

        ${treffer(`M${R} ${mid(4)} H${ri} V${mid(2)} H${R + 4}`)}${treffer(`M${ri} ${mid(3)} H${R + 4}`)}

        <rect x="${ri - 6}" y="${mid(3) - 72}" width="86" height="44" fill="transparent"/>
        <text class="lab" x="${ri + 8}" y="${mid(3) - 48}" font-weight="800">Rückführung</text><text class="mut" x="${ri + 8}" y="${mid(3) - 33}">intern, C07</text><text class="mut" x="${ri + 8}" y="${mid(3) + 18}">M-04-02</text>

      <g data-open="M-06-03" tabindex="0" role="button" aria-label="Externer Pfad: Bewertung von Kundenänderungen, M-06-03"><title>Externer Pfad: Kundenänderung über den Baustein Kunden &amp; Partner, Bewertung nach M-06-03</title>
        <rect x="4" y="${mid(2) - 22}" width="118" height="44" rx="6" fill="#fff" stroke="var(--line2)" stroke-width="1.5"/>

  VIEWS.komponenten = () => head('Befähigungskomponenten', 'Sechs Befähigungskomponenten bündeln die Zweige, die aus mehreren Bausteinen zusammenlaufen. Führend ist B03.')
    + (einl('wirkungsprinzip') ? `<div class="note" style="margin:0 0 14px"><b>Wirkungsprinzip nach B03 Kapitel 1.2</b>${einl('wirkungsprinzip', 'margin-top:4px')}</div>` : '')
    + `<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(360px,1fr))">${B.komponenten.map(k => `<button type="button" class="card click" data-open="komp:${k.code}"><span class="kenn">${k.code}</span><h4>${esc(k.n)}</h4><p>${esc(k.gegenstand)}${stift('komp:' + k.code, 'Gegenstand')}</p>${k.weg ? `<div class="weg"><div><i>Gestaltungsmittel</i><span>${esc(stripRefs(k.weg.gestaltungsmittel))}${stift('komp:' + k.code, 'Gestaltungsmittel')}</span></div><span aria-hidden="true">↓</span><div><i>Methode</i><span>${esc(stripRefs(k.weg.methode))}${stift('komp:' + k.code, 'Methode oder Verfahren')}</span></div><span aria-hidden="true">↓</span><div><i>Realisierung</i><span>${esc(k.weg.realisierung)}${stift('komp:' + k.code, 'Realisierung')}</span></div></div>` : ''}<div class="tags">${(k.zufuehrend || []).map(b => `<span class="tag">${esc(b)}</span>`).join('')}</div></button>`).join('')}</div>`;
  const stripRefs = t => String(t || '').replace(/\s*\([^)]*\)/g, '');

  // Routinen im Takt: je Kaskadenstufe die Häufigkeit der Routinen auf einer logarithmischen Achse.
  // Die Umrechnung des Takts in Termine je Monat beruht auf Annahmen, die unter der Grafik stehen.
  const TAKT = [[/quartal/i, 1 / 3], [/14-täglich/i, 2.17], [/wöchentlich/i, 4.33], [/monatlich/i, 1], [/schichtbeginn und -ende/i, 84], [/schichtwechsel/i, 42], [/täglich/i, 21]];
  const proMonat = t => { const m = TAKT.find(([r]) => r.test(t || '')); return m ? m[1] : null; };
  const minuten = d => { const z = String(d || '').match(/\d+/g); return z ? z.map(Number).reduce((a, b) => a + b, 0) / z.length : null; };
  function routinenTakt() {
    const rts = objekte(o => o.art === 'RT').map(o => ({ o, f: proMonat(o.profil.Takt), d: minuten(o.profil.Dauer) })).filter(x => x.f);
    if (!rts.length) return '';
    const stufen = [...new Set(rts.map(x => x.o.stufe))].sort(), W = 640, L = 120, Rr = 24, ZH = 58, T = 26;
    const lo = Math.log10(0.25), hi = Math.log10(120), xs = f => L + (Math.log10(f) - lo) / (hi - lo) * (W - L - Rr);
    const H = T + stufen.length * ZH + 34;
    const ticks = [[1 / 3, 'quartalsweise'], [1, 'monatlich'], [4.33, 'wöchentlich'], [21, 'täglich'], [84, '2× je Schicht']];
    // Je Stufe nach Häufigkeit sortiert; Beschriftung abwechselnd über und unter dem Punkt, gleicher Takt seitlich versetzt.
    const punkte = stufen.map((st, zi) => rts.filter(x => x.o.stufe === st).sort((a, b) => a.f - b.f).map(({ o, f, d }, i, reihe) => {
      const gleich = reihe.filter(x => x.f === f), gi = gleich.findIndex(x => x.o === o);
      const x = xs(f) + (gleich.length > 1 ? (gi - (gleich.length - 1) / 2) * 16 : 0), y = T + zi * ZH + ZH / 2;
      const ly = i % 2 ? y + 20 : y - 11, anker = x > W - 40 ? 'end' : x < L + 30 ? 'start' : 'middle';
      const std = d ? (f * d / 60).toFixed(1).replace('.', ',') : null;
      return `<g data-open="${o.kennung}" tabindex="0" role="button" aria-label="${o.kennung} ${svgEsc(o.n)}, ${svgEsc(o.profil.Takt)}, ${svgEsc(o.profil.Dauer || '')}"><title>${o.kennung} ${svgEsc(o.n)}\n${svgEsc(o.profil.Takt)} · ${svgEsc(o.profil.Dauer || '')}${std ? `\netwa ${std} Stunden je Monat` : ''}</title><circle cx="${x.toFixed(1)}" cy="${y}" r="12" fill="transparent"/><circle class="knoten" cx="${x.toFixed(1)}" cy="${y}" r="6" fill="var(--accent)" stroke="#fff" stroke-width="2"/><text class="lab" x="${(anker === 'end' ? x + 6 : anker === 'start' ? x - 6 : x).toFixed(1)}" y="${ly}" text-anchor="${anker}">${o.kennung}</text></g>`;
    }).join('')).join('');
    return `<h3 class="sec">Routinen im Takt</h3><p class="hint" style="margin-bottom:6px">Je Kaskadenstufe, wie oft eine Routine im Monat stattfindet. Je höher die Stufe, desto seltener und länger die Termine, je näher am Shopfloor, desto häufiger und kürzer.</p>
      <div class="card" style="padding:10px"><svg class="viz" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Routinen nach Kaskadenstufe und Häufigkeit je Monat">
        ${ticks.map(([f, t]) => `<line class="grid" x1="${xs(f).toFixed(1)}" y1="${T - 6}" x2="${xs(f).toFixed(1)}" y2="${H - 26}"/><text class="mut" x="${xs(f).toFixed(1)}" y="${H - 10}" text-anchor="middle">${t}</text>`).join('')}
        ${stufen.map((st, i) => `<text class="lab" x="4" y="${T + i * ZH + ZH / 2 + 4}" font-weight="700">${st} ${svgEsc((IX.stufe.get(st) || {}).n || '')}</text>${i ? `<line class="grid" x1="0" y1="${T + i * ZH}" x2="${W}" y2="${T + i * ZH}"/>` : ''}`).join('')}
        ${punkte}
      </svg></div>
      <p class="hint" style="margin-top:6px">Annahmen für die Umrechnung: zwei Schichten an 21 Arbeitstagen je Monat, 14-täglich als 2,17 und wöchentlich als 4,33 Termine je Monat, quartalsweise als ein Drittel. Die Werte zeigen die Größenordnung, nicht den Kalender des Standorts. Name, Takt, Dauer und Zeitaufwand je Monat zeigt der Hinweis am Punkt; ein Klick öffnet die Routine.</p>`;
  }

      + `<h3 class="sec">Kennzahlen nach Dimension und Kontext</h3>${score}<h3 class="sec">Statusbewertung</h3>${status}`;

  // Objektkatalog mit Filtern
  const F_KEYS = ['q', 'art', 'ebene', 'regel', 'baustein', 'komp', 'stufe', 'pflege'];
  const PFLEGE = { geaendert: 'gegenüber Kanon geändert', anhang: 'mit Anhang', ohneDatei: 'Dokument ohne Datei', kohaerenz: 'mit Kohärenzhinweis' };
  const kohaerenzSet = () => new Set(((B0 && B0.meta.pruefung && B0.meta.pruefung.kohaerenz) || []).flatMap(x => x.match(/\b(M-\d{2}-\d{2}|D-[A-Z]{2}-\d{2}|W-[RMIPQS]-\d{2}|RT-\d-\d{2}|K[34]-[SCORE]-\d{2})\b/g) || []));
  const zielVon = o => o.art === 'P' ? 'Regel ' + o.regel : o.kennung;
  function pflegeTrifft(o, wert, koh) {
    if (wert === 'geaendert') return !kanonSicht && A.aenderungen.some(v => v.ziel === zielVon(o));
    if (wert === 'anhang') return anhaenge(zielVon(o)).length > 0;
    if (wert === 'ohneDatei') return o.art === 'D' && !linkPfad(o.kennung);
    if (wert === 'kohaerenz') return koh.has(o.kennung);
    return true;
  }
  // Markiert die Suchbegriffe im Text.
  function hl(text) {
    const h = esc(text), w = (state.q || '').trim().split(/\s+/).filter(x => x.length > 1);

    return h.replace(new RegExp('(' + w.map(x => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi'), '<mark>$1</mark>');
  }
  function filtern() {
    const q = (state.q || '').trim().toLowerCase();
    const arts = (state.art || '').split(',').filter(Boolean);
    const koh = state.pflege === 'kohaerenz' ? kohaerenzSet() : null;
    return alle().filter(o => {
      if (arts.length && !arts.includes(o.art)) return false;
      if (state.pflege && !pflegeTrifft(o, state.pflege, koh)) return false;
      if (state.ebene && o.ebene !== state.ebene) return false;
      if (state.regel && !(String(o.regel) === state.regel || (o.regeln || []).map(String).includes(state.regel))) return false;
      if (state.baustein && o.baustein !== state.baustein) return false;
      if (state.komp && !(o.komponenten || []).includes(state.komp)) return false;
      if (state.stufe && !((o.stufen || []).includes(+state.stufe) || o.stufe === +state.stufe)) return false;
      if (q) { const t = [o.kennung, o.n, o.zweck, o.typ, ...Object.values(o.profil || {})].join(' ').toLowerCase(); if (!q.split(/\s+/).every(w => t.includes(w))) return false; }
      return true;
    }).sort((a, b) => ARTEN.indexOf(a.art) - ARTEN.indexOf(b.art) || (a.art === 'P' ? a.regel - b.regel : a.kennung.localeCompare(b.kennung, 'de', { numeric: true })));
  }
  function objTags(o) {
    const t = [`<span class="tag">${o.ebene}</span>`];

    if (o.art === 'D' && o.regeln && o.regeln.length) t.push(`<span class="tag">Regel ${o.regeln.join(', ')}</span>`);
    if (o.art === 'D' && o.mindestkriterium) t.push('<span class="tag warn">Mindestkriterium</span>');
    if (o.baustein) t.push(`<span class="tag">${o.baustein}</span>`);
    if (o.komponenten && o.komponenten.length) t.push(`<span class="tag">${o.komponenten.length === 6 ? 'alle Komponenten' : o.komponenten.join(', ')}</span>`);
    if (o.art === 'RT') t.push(`<span class="tag">Stufe ${o.stufe}</span>`);
    if (o.art === 'K') { t.push(`<span class="tag">SCORE ${o.kontext === 3 ? 'III' : 'IV'} · ${o.dimension}</span>`); if (o.pflichtkern) t.push('<span class="tag warn">Pflichtkern</span>'); }

    if (linkPfad(o.kennung)) t.push('<span class="tag lnk" title="Datei verknüpft">Datei</span>');
    if (!kanonSicht && A.aenderungen.some(v => v.ziel === o.kennung || (o.art === 'P' && v.ziel === 'Regel ' + o.regel))) t.push('<span class="tag vs" title="Gegenüber dem Kanon geändert">geändert</span>');
    const na = anhaenge(o.art === 'P' ? 'Regel ' + o.regel : o.kennung).length;
    if (na) t.push(`<span class="tag lnk" title="Angehängte Dateien">${na === 1 ? '1 Anhang' : na + ' Anhänge'}</span>`);
    return t.join('');
  }
  const listHtml = l => l.length ? ARTEN.map(a => { const g = l.filter(o => o.art === a); return g.length ? `<h3 class="grp">${artTag(a)} ${g.length}</h3>${g.map(objRow).join('')}` : ''; }).join('') : '<p class="hint">Kein Objekt entspricht der Auswahl.</p>';
  function aktivChips() {
    const lab = {

    return {
      kicker: `Kanon · Gruppe ${k.gruppe}`,
      titel: `${k.kennung} ${k.n}`,
      body: kv([['Inhalt', k.inhalt], ['Führender Ort für', ebenen.map(e => refBtn('ebene:' + e.code, 'Ebene ' + e.n)).join(', '), true], ['Stand', k.vorgemerkt ? `vorgemerkt in der Änderungsliste ${k.vorgemerkt}` : 'Fassung ' + B.meta.fassung]])
        + (kenn === 'C02' ? `<p style="margin:12px 0"><a class="btn primary" href="${esc(B.meta.pcfDatei)}" target="_blank" rel="noopener">Process Framework öffnen</a></p>` : '')
        + (objs.length ? `<h3>Objekte mit Fundstelle in ${esc(kenn)}</h3>${byArt(objs)}` : '')
    };
  }

  // ---------- Ereignisse ----------
  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-view]');
    if (nav) { e.preventDefault(); go(nav.dataset.view); return; }
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); const p = {}; ['art', 'ebene', 'regel', 'baustein', 'komp', 'stufe', 'pflege'].forEach(k => { if (g.dataset[k]) p[k] = g.dataset[k]; }); go(g.dataset.go, p); return; }
    const o = e.target.closest('[data-open]');
    if (o) { e.preventDefault(); open(o.dataset.open); }
  });
  // Die Kopfsuche durchsucht immer den ganzen Bestand und den Kanon. Sie zeigt die besten Treffer
  // direkt an; der letzte Eintrag führt in die Objektliste mit allen Treffern.
  const QS_MAX = 8;
  let qsAkt = -1;
  function suche(q) {
    const w = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!w.length) return { treffer: [], gesamt: 0 };
    const rang = (kenn, n, rest) => {
      const k = kenn.toLowerCase(), nl = n.toLowerCase(), t = [k, nl, rest].join(' ');
      if (!w.every(x => t.includes(x))) return -1;
      const q0 = w.join(' ');
      return k === q0 ? 0 : k.startsWith(q0) ? 1 : w.every(x => nl.includes(x)) ? (nl.startsWith(w[0]) ? 2 : 3) : 4;
    };
    const obj = alle().map(o => ({ key: o.art === 'P' ? 'Regel ' + o.regel : o.kennung, kenn: o.kennung, n: o.n, tag: artTag(o.art), r: rang(o.kennung, o.n, [o.zweck, o.typ, ...Object.values(o.profil || {})].join(' ').toLowerCase()) }));
    const kan = B.kanon.map(k => ({ key: 'kanon:' + k.kennung, kenn: k.kennung, n: k.n, tag: '<span class="tag">Kanon</span>', r: rang(k.kennung, k.n, String(k.inhalt || '').toLowerCase()) }));
    const gefunden = obj.concat(kan).filter(x => x.r >= 0).sort((a, b) => a.r - b.r);
    return { treffer: gefunden.slice(0, QS_MAX), gesamt: obj.filter(x => x.r >= 0).length };
  }
  function qsZeigen() {
    const v = $('q').value.trim(), pop = $('qs-pop');
    if (!v) { qsZu(); return; }
    const { treffer, gesamt } = suche(v);
    qsAkt = treffer.length ? 0 : -1;
    pop.innerHTML = (treffer.length ? treffer.map((t, i) => `<button type="button" class="qs-item" role="option" id="qs-${i}" data-open="${esc(t.key)}" tabindex="-1"><span class="kenn">${esc(t.kenn)}</span><span class="nm">${esc(t.n)}</span>${t.tag}</button>`).join('') : '<div class="qs-leer">Kein Treffer.</div>')
      + (gesamt ? `<button type="button" class="qs-all" role="option" id="qs-${treffer.length}" data-qs-all tabindex="-1">Alle ${gesamt} Objekttreffer in der Objektliste anzeigen</button>` : '');
    pop.hidden = false;
    $('q').setAttribute('aria-expanded', 'true');
    qsMark();
  }
  function qsMark() {
    const items = $('qs-pop').querySelectorAll('[role=option]');
    items.forEach((x, i) => x.classList.toggle('act', i === qsAkt));
    if (items[qsAkt]) { $('q').setAttribute('aria-activedescendant', items[qsAkt].id); items[qsAkt].scrollIntoView({ block: 'nearest' }); } else $('q').removeAttribute('aria-activedescendant');
  }
  function qsZu() { $('qs-pop').hidden = true; $('q').setAttribute('aria-expanded', 'false'); $('q').removeAttribute('aria-activedescendant'); qsAkt = -1; }
  const qsAlle = () => { const v = $('q').value.trim(); qsZu(); $('q').value = ''; go('objekte', { q: v }); };
  $('q').addEventListener('input', qsZeigen);
  $('q').addEventListener('focus', () => { if ($('q').value.trim()) qsZeigen(); });
  $('q').addEventListener('keydown', e => {
    const items = $('qs-pop').querySelectorAll('[role=option]');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if ($('qs-pop').hidden) qsZeigen(); else if (items.length) { qsAkt = (qsAkt + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; qsMark(); } }
    else if (e.key === 'Enter') { e.preventDefault(); const it = items[qsAkt]; if (!it) return; if (it.hasAttribute('data-qs-all')) qsAlle(); else { qsZu(); open(it.dataset.open); } }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (!$('qs-pop').hidden) qsZu(); else { $('q').value = ''; $('q').blur(); } }
  });
  $('qs-pop').addEventListener('mousedown', e => e.preventDefault());
  $('qs-pop').addEventListener('click', e => { if (e.target.closest('[data-qs-all]')) { e.stopPropagation(); qsAlle(); } else if (e.target.closest('[data-open]')) qsZu(); });
  $('q').addEventListener('blur', () => setTimeout(qsZu, 120));
  $('sb-toggle').onclick = () => { if (matchMedia('(max-width:760px)').matches) document.body.classList.toggle('sb-auf'); else document.body.classList.toggle('sb-zu'); };
  const onNav = () => {
    const s = readHash();
    const viewChanged = s.ansicht !== state.ansicht || F_KEYS.some(k => (s[k] || '') !== (state[k] || ''));
    state = s;
    if (viewChanged) renderView();
    if (s.o) { if (!$('ovl').classList.contains('open') || stack[stack.length - 1] !== s.o) open(s.o); } else closeDrawer(true);
  };
  window.addEventListener('hashchange', onNav);
  window.addEventListener('popstate', onNav);

  // ---------- Start ----------
  function start(data) {
    B0 = data; B = data;
    index();
    linksLaden();
    aenLaden();
    const m = B.meta;
    document.title = `${m.titel} · Modellnavigator · Fassung ${m.fassung}`;
    $('h-brand').textContent = `${m.titel} · `;
    $('sb-meta').innerHTML = `Kanon ${esc(m.fassung)} · Navigator ${NAVIGATOR.fassung}<br>Datendatei vom ${esc(m.erzeugt)}<br>${esc(m.status)}<span id="sb-aen"></span>`;
    edAnzeigen();
    state = readHash();
    renderView();
    if (state.o) open(state.o);
  }
  if (window.BM && window.BM.objekte) start(window.BM);
  else {
    $('view').innerHTML = `<div class="err"><p>Die Datendatei bm-daten.js wurde nicht gefunden. Sie muss im selben Ordner liegen wie diese Seite.</p><p style="margin-top:12px"><button class="btn primary" id="f-open" type="button">Datendatei öffnen</button></p></div>`;
    $('f-open').onclick = () => $('fileinput').click();
    $('fileinput').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const t = String(r.result); start(JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1))); } catch (err) { alert('Die Datei ist keine gültige Datendatei des Modellnavigators.'); } }; r.readAsText(f, 'utf-8'); };
  }
})();
</script>
</body>
</html>
